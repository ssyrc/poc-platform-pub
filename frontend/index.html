      const preferredY = category === "training" ? "eval_accuracy" : (yMetricKeys.find((k) => k !== (xField || preferredX)) || yMetricKeys[0] || null);
      const preferredGroups = axisFieldKeys.has("gpu_type") ? ["gpu_type"] : [];

      const cached = category === "training" ? null : selectionCacheRef.current[selectionKey];
      if (cached) {
        if (cached.xField && axisFieldKeys.has(cached.xField)) setXField(cached.xField);
        else if (!xField || !axisFieldKeys.has(xField)) setXField(preferredX);
        if (cached.yField && yMetricKeys.includes(cached.yField)) setYField(cached.yField);
        else if (!yField || !yMetricKeys.includes(yField)) setYField(preferredY);
        const nextGroups = (cached.groupFields || []).filter((g) => axisFieldKeys.has(g));
        setGroupFields(nextGroups.length ? nextGroups : preferredGroups);
      } else {
        if (category === "training") {
          setXField(preferredX);
          setYField(preferredY);
          setGroupFields(preferredGroups);
        } else {
          if (!xField || !axisFieldKeys.has(xField)) setXField(preferredX);
          if (!yField || !yMetricKeys.includes(yField)) setYField(preferredY);
          setGroupFields((prev) => {
            const nextGroups = prev.filter((g) => axisFieldKeys.has(g));
            return nextGroups.length ? nextGroups : preferredGroups;
          });
        }
      }
      setFilters((prev) => {
        const next = {};
        Object.entries(prev).forEach(([k, v]) => {
          if (allDimKeys.includes(k) || k === "gpu_type") next[k] = v;
        });
        return next;
      });
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [selectionKey, allMetricKeys.join("|"), allDimKeys.join("|"), Array.from(axisFieldKeys).join("|")]);

    // ============ CHART DATA PROJECTION ============
    // Apply filters to modelPins, then project each pin to a row carrying
    // x/y/group/full args.
    const candidatePins = useMemo(() => {
      return modelPins.filter((p) => {
        for (const [k, v] of Object.entries(filters)) {
          if (v === "__any__") continue;
          if (String(p.dims?.[k] ?? "") !== String(v)) return false;
        }
        return true;
      });
    }, [modelPins, filters]);

    const candidatePinIds = useMemo(() => candidatePins.map((p) => String(p.id || "")).filter(Boolean), [candidatePins]);

    useEffect(() => {
      const previousCandidateIds = (prevCandidatePinIdsRef.current || []).map(String);
      setChartPinIds((prev) => {
        if (prev === null) return candidatePinIds;
        const allowed = new Set(candidatePinIds);
        const prevIds = (prev || []).map(String);
        const wasAllSelected = previousCandidateIds.length > 0 && previousCandidateIds.every((id) => prevIds.includes(id));
        if (wasAllSelected) return candidatePinIds;
        return prevIds.filter((id) => allowed.has(String(id)));
      });
      prevCandidatePinIdsRef.current = candidatePinIds;
    }, [candidatePinIds.join("|")]);

    const selectedChartPinIds = useMemo(() => {
      const allowed = new Set(candidatePinIds);
      const src = chartPinIds === null ? candidatePinIds : chartPinIds;
      return (src || []).filter((id) => allowed.has(String(id)));
    }, [chartPinIds, candidatePinIds.join("|")]);
    const selectedChartPinSet = useMemo(() => new Set(selectedChartPinIds.map(String)), [selectedChartPinIds.join("|")]);

    const filteredPins = useMemo(() => {
      return candidatePins.filter((p) => selectedChartPinSet.has(String(p.id || "")));
    }, [candidatePins, selectedChartPinIds.join("|")]);

    const autoDashboardScopeFields = useMemo(() => {
      const distinctCount = (field) => {
        const vals = new Set();
        (filteredPins || []).forEach((pin) => {
          const v = dashboardValueForPinField(pin, field);
          if (v !== undefined && v !== null && String(v).trim() !== "") vals.add(String(v));
        });
        return vals.size;
      };
      const fields = [];
      if (versionFilter === "__all__" && distinctCount("version") > 1) fields.push("version");
      if (model === "__all__" && distinctCount("model") > 1) fields.push("model");
      if (envFilter === "__all__" && distinctCount("env") > 1) fields.push("env");
      if (category === "inference" && testKind === "vllm" && modeFilter === "__all__" && distinctCount("mode") > 1) fields.push("mode");
      return fields;
    }, [filteredPins, versionFilter, model, envFilter, modeFilter, category, testKind]);

    const activeDashboardGroupFields = useMemo(() => {
      const base = groupFields.length ? groupFields : ["gpu_type"];
      return Array.from(new Set([...base, ...autoDashboardScopeFields]));
    }, [groupFields.join("|"), autoDashboardScopeFields.join("|")]);
    const hasExplicitDashboardGroups = groupFields.length > 0;
    const hasAutoDashboardScope = autoDashboardScopeFields.length > 0;

    function pinToRow(p) {
      const rawX =
        xField === "gpu_type"
          ? p.gpu_type
          : (p.metrics?.[xField] != null
              ? p.metrics[xField]
              : (p.dims?.[xField] != null ? p.dims[xField] : null));
      const metricX = p.metrics?.[xField] != null ? asFiniteNumber(p.metrics[xField]) : null;
      const dimX = p.metrics?.[xField] == null ? asFiniteNumber(rawX) : null;
      const categoricalX = ["gpu_type", "model", "precision", "fp8", "fp8_hybrid", "env", "mode"].includes(xField);
      const xVal = xField === "gpu_type" ? p.gpu_type : (metricX != null ? metricX : (!categoricalX && dimX != null ? dimX : rawX));
      const yVal = asFiniteNumber(p.metrics?.[yField]);
      const groupParts = activeDashboardGroupFields.map((g) => {
        const v = dashboardValueForPinField(p, g) ?? "∅";
        return `${g}=${v}`;
      });
      const groupKey = groupParts.length ? groupParts.join(" / ") : "";
      return {
        ...p,
        _x: xVal,
        _y: yVal,
        _xKey: xField,
        _yKey: yField,
        _groupKey: groupKey,
        _groupParts: groupParts,
        _dims: p.dims,
        _metrics: p.metrics,
      };
    }

    const projected = useMemo(
      () => filteredPins
              .map(pinToRow)
              .filter((r) => r._x != null && r._y != null && !Number.isNaN(r._y))
              .sort((a, b) => {
                const ax = a._x, bx = b._x;
                if (typeof ax === "number" && typeof bx === "number") return ax - bx;
                return String(ax).localeCompare(String(bx));
              }),
      // eslint-disable-next-line react-hooks/exhaustive-deps
      [filteredPins, xField, yField, activeDashboardGroupFields.join("|")]
    );

    // Distinct GPUs and group keys, sorted for stable colors.
    const gpus = useMemo(() => {
      const s = new Set();
      projected.forEach((r) => s.add(r.gpu_type));
      return Array.from(s).sort();
    }, [projected]);

    const groupKeys = useMemo(() => {
      const s = new Set();
      projected.forEach((r) => s.add(r._groupKey || ""));
      return Array.from(s).sort();
    }, [projected]);

    // activeDashboardGroupFields is the chart series key. If the user leaves groups empty
    // while selecting all versions/models/environments, keep series separated by scope
    // instead of connecting unrelated runs into one GPU-only line.
    const colorOf = useCallback((gpu, groupKey) => {
      if (activeDashboardGroupFields.length) {
        const idx = Math.max(0, groupKeys.indexOf(groupKey || ""));
        return DASHBOARD_CHART_COLORS[idx % DASHBOARD_CHART_COLORS.length];
      }
      return colorForGpu(gpu);
    }, [groupKeys, activeDashboardGroupFields.join("|")]);

    function dashboardGroupDisplayFromKey(groupKey) {
      if (!activeDashboardGroupFields.length) return "";
      const raw = String(groupKey || "");
      if (!raw) return "—";
      return raw.split(" / ").map((part) => {
        const pos = part.indexOf("=");
        if (pos < 0) return part;
        const k = part.slice(0, pos);
        const v = part.slice(pos + 1);
        return dashValueLabel(k, v);
      }).filter(Boolean).join(" / ");
    }
    function dashboardValueForPinField(pin, field) {
      if (!pin || !field) return null;
      if (field === "gpu_type") return pin.gpu_type || pin.dims?.gpu_type || null;
      if (field === "model") return pin.model || pin.dims?.model || null;
      if (pin.metrics && pin.metrics[field] != null) return pin.metrics[field];
      if (pin.dims && pin.dims[field] != null) return pin.dims[field];
      if (pin.hyperparameters && pin.hyperparameters[field] != null) return pin.hyperparameters[field];
      return null;
    }
    function dashboardPinGroupInfo(pin) {
      const row = pinToRow(pin);
      const label = activeDashboardGroupFields.length ? activeDashboardGroupFields.map(fieldLabel).join(" / ") : "Gpu type";
      const value = activeDashboardGroupFields.length ? dashboardGroupDisplayFromKey(row._groupKey) : String(pin.gpu_type || pin.dims?.gpu_type || "—");
      return { label, value, color: colorOf(row.gpu_type, row._groupKey || "") };
    }
    function dashboardPinNumGpus(pin) {
      const hp = pin?.hyperparameters || {};
      const params = pin?.request_params || {};
      const args = params.args || {};
      const candidates = [
        pin?.num_gpus, pin?.dims?.num_gpus, pin?.dims?.NUM_GPUS, pin?.metrics?.NUM_GPUS,
        hp.NUM_GPUS, hp.num_gpus, hp["num_gpus"], hp["NUM_GPUS"],
        params.num_gpus, params.gpu_count, args.NUM_GPUS, args.MLPERF_NUM_GPUS, args.gpu_count,
      ];
      for (const v of candidates) {
        const n = asFiniteNumber(v);
        if (n != null) return String(n);
      }
      const perHost = params.gpu_counts_by_host || params.selected_gpus_by_host || params.prefill_gpu_counts || params.decode_gpu_counts;
      if (perHost && typeof perHost === "object") {
        const vals = Object.values(perHost).map((v) => {
          if (Array.isArray(v)) return v.length;
          const s = String(v || "").trim();
          if (!s) return null;
          if (s.includes(",")) return s.split(",").map((x) => x.trim()).filter(Boolean).length;
          return asFiniteNumber(s);
        }).filter((v) => v != null);
        if (vals.length) return vals.join(" / ");
      }
      return "—";
    }
    function dashboardSeriesLabel(series) {
      return activeDashboardGroupFields.length ? dashboardGroupDisplayFromKey(series.groupKey) : String(series.gpu_type || "—");
    }

    // ============ CHART RENDER PROPS ============
    // Bar:
    //   data = [{ gpu_type, "gpu+group": yval, ... }]
    //   one Bar per (gpu, groupKey).  If no groups, just 1 series per chart.
    // Scatter:
    //   one Scatter series per (gpu, groupKey)
    // Line:
    //   one Line series per (gpu, groupKey), data sorted by X
    const seriesByGpuGroup = useMemo(() => {
      const m = new Map();
      projected.forEach((r) => {
        const key = `${r.gpu_type}::${r._groupKey || ""}`;
        if (!m.has(key)) {
          m.set(key, { gpu_type: r.gpu_type, groupKey: r._groupKey || "", points: [] });
        }
        m.get(key).points.push(r);
      });
      return Array.from(m.values());
    }, [projected]);

    // Bar data: aggregate by the currently selected x axis, preserving y/group choices.
    const barData = useMemo(() => {
      if (chartType !== "bar") return [];
      const byX = new Map();
      projected.forEach((r) => {
        const xKey = typeof r._x === "number" ? String(r._x) : String(r._x ?? "∅");
        const colName = `${r.gpu_type}${r._groupKey ? " · " + r._groupKey : ""}`;
        if (!byX.has(xKey)) {
          byX.set(xKey, { _x: r._x, _xLabel: typeof r._x === "number" ? String(Math.round(r._x)) : String(r._x ?? "∅"), _samples: [] });
        }
        const row = byX.get(xKey);
        if (!row[`__vals__${colName}`]) row[`__vals__${colName}`] = [];
        if (typeof r._y === "number") row[`__vals__${colName}`].push(r._y);
        row._samples.push(r);
      });
      const rows = Array.from(byX.values()).map((row) => {
        Object.keys(row).forEach((k) => {
          if (!k.startsWith("__vals__")) return;
          const col = k.slice("__vals__".length);
          const vals = row[k];
          row[col] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
          delete row[k];
        });
        return row;
      });
      rows.sort((a, b) => {
        const ax = a._x, bx = b._x;
        if (typeof ax === "number" && typeof bx === "number") return ax - bx;
        return String(ax).localeCompare(String(bx));
      });
      return rows;
    }, [chartType, projected]);

    const barColumns = useMemo(() => {
      if (chartType !== "bar") return [];
      const cols = new Set();
      projected.forEach((r) => cols.add(`${r.gpu_type}${r._groupKey ? " · " + r._groupKey : ""}`));
      return Array.from(cols).sort();
    }, [chartType, projected]);

    const legendItems = useMemo(() => {
      if (!activeDashboardGroupFields.length) {
        return gpus.map((g) => ({ key: `gpu:${g}`, label: g, color: colorForGpu(g) }));
      }
      const m = new Map();
      seriesByGpuGroup.forEach((s) => {
        const key = s.groupKey || "__empty__";
        if (!m.has(key)) {
          m.set(key, {
            key,
            label: dashboardSeriesLabel(s),
            color: colorOf(s.gpu_type, s.groupKey || ""),
          });
        }
      });
      return Array.from(m.values()).sort((a, b) => String(a.label).localeCompare(String(b.label)));
    }, [activeDashboardGroupFields.join("|"), gpus.join("|"), groupKeys.join("|"), seriesByGpuGroup]);

    const yDomain = useMemo(() => {
      const vals = projected
        .map((r) => r._y)
        .filter((v) => typeof v === "number" && Number.isFinite(v));
      if (!vals.length) return ["auto", "auto"];
      const min = Math.min(...vals);
      const max = Math.max(...vals);
      if (min === max) {
        const base = Math.max(Math.abs(min), 1);
        const pad = base * 0.01;
        return [min - pad, max + pad];
      }
      const pad = (max - min) * 0.12;
      return [min - pad, max + pad];
    }, [projected]);

    const numericXAxisProps = useMemo(() => {
      const vals = Array.from(new Set(projected
        .map((r) => r._x)
        .filter((v) => typeof v === "number" && Number.isFinite(v))))
        .sort((a, b) => a - b);
      if (!vals.length) return {};
      const min = vals[0];
      const max = vals[vals.length - 1];
      const niceIntStep = (raw) => {
        const x = Math.max(1, Math.ceil(Math.abs(Number(raw) || 1)));
        const exp = Math.floor(Math.log10(x));
        const base = Math.pow(10, exp);
        const frac = x / base;
        const nice = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10;
        return Math.max(1, Math.round(nice * base));
      };
      const range = Math.max(Math.abs(max - min), 1);
      const step = niceIntStep(range / 4);
      let lo = Math.floor(min / step) * step;
      let hi = Math.ceil(max / step) * step;
      if (min >= 0) lo = 0;
      if (hi <= max || (max >= 0 && hi === max)) hi += step;
      if (lo >= min && min < 0) lo -= step;
      const ticks = [];
      for (let x = lo; x <= hi + 1e-9 && ticks.length < 30; x += step) {
        ticks.push(Math.round(x));
      }
      return { ticks, domain: [ticks[0], ticks[ticks.length - 1]], allowDecimals: false };
    }, [projected]);

    const xIsNumeric = typeof projected[0]?._x === "number";

    // ============ EVENT HANDLERS ============
    function onDropX(fieldKey) {
      if (!axisFieldKeys.has(fieldKey)) return;

      setYField(fieldKey);
    }
    function onDropGroup(fieldKey) {
      if (!axisFieldKeys.has(fieldKey)) return;
      setGroupFields((prev) => (prev.includes(fieldKey) ? prev : [...prev, fieldKey]));
    }
    function removeGroup(idx) {
      setGroupFields((prev) => prev.filter((_, i) => i !== idx));
    }
    function setFilter(k, v) {
      setFilters((prev) => ({ ...prev, [k]: v }));

    function toggleChartPin(id) {

    function selectAllChartPins() { setChartPinIds(candidatePinIds); }
    function clearChartPins() { setChartPinIds([]); }
    function removePin(id) {
      setPinned((all || []).filter((p) => p.id !== id));
    }
    function clearAll() {

      setPinned([]);
    }
    async function downloadReport() {
      const runIds = Array.from(new Set(projected.map((r) => r.run_id).filter(Boolean)));
      const monitorEntries = await Promise.all(runIds.map(async (rid) => [
        rid,
        await fetch(`/api/runs/${rid}/gpu_samples`).then((r) => r.ok ? r.json() : null).catch(() => null),
      ]));
      const monitorByRun = Object.fromEntries(monitorEntries.filter(([, v]) => v));
      const html = buildDashboardReport({
        category, model, chartType, xField, yField, groupFields, filters,
        data: projected, gpus: new Set(gpus), groupKeys: new Set(groupKeys), monitorByRun,
      });
      const blob = new Blob([html], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      a.href = url;
      a.download = `dashboard_${category}_${stamp}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    async function copyDashboardPath(path) {
      if (!path) return;
      try { await navigator.clipboard.writeText(path); }
      catch (_) {
        const ta = document.createElement("textarea");
        ta.value = path;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
    }
    function selectPinFromChartPayload(payload) {
      const pinId = payload?.id || payload?._samples?.[0]?.id;
      if (pinId) setSelectedPinId(String(pinId));
    }
    function handleDashboardChartClick(evt) {
      const payload = evt?.activePayload?.[0]?.payload || evt?.payload;
      selectPinFromChartPayload(payload);
    }

    function dashboardPinStartTimeLabel(pin) {
      const raw = pin?.start_time || pin?._run?.start_time || pin?.pinned_at;
      if (raw == null || raw === "") return "—";
      let ms = null;
      if (typeof raw === "number") ms = raw > 1e12 ? raw : raw * 1000;
      else {
        const n = Number(raw);
        if (Number.isFinite(n)) ms = n > 1e12 ? n : n * 1000;
        else {
          const parsed = Date.parse(String(raw));
          if (Number.isFinite(parsed)) ms = parsed;
        }
      }
      return ms == null ? String(raw) : new Date(ms).toLocaleString();
    }
    function DashboardLineDot(props) {
      const { cx, cy, payload, stroke } = props || {};
      if (cx == null || cy == null || !payload) return null;
      const selected = String(payload.id || "") === String(selectedPinId || "");
      return (
        <circle cx={cx} cy={cy} r={selected ? 6 : 3.2}

          style={{ cursor: "pointer", filter: selected ? "drop-shadow(0 0 8px rgba(187,134,252,.75))" : "none" }}
          onMouseEnter={() => setHoveredPinId(String(payload.id || ""))}
          onMouseLeave={() => setHoveredPinId(null)}
          onClick={(e) => { e.stopPropagation(); setSelectedPinId(String(payload.id || "")); }} />
      );
    }
    function DashboardScatterShape(props) {
      const { cx, cy, payload, fill } = props || {};
      if (cx == null || cy == null || !payload) return null;
      const selected = String(payload.id || "") === String(selectedPinId || "");
      return (
        <circle cx={cx} cy={cy} r={selected ? 7 : 4.2}
          fill={selected ? "#F8F4FF" : (fill || "#03DAC6")}
          stroke={fill || "#03DAC6"} strokeWidth={selected ? 2.6 : 1}
          style={{ cursor: "pointer", filter: selected ? "drop-shadow(0 0 8px rgba(3,218,198,.75))" : "none" }}
          onMouseEnter={() => setHoveredPinId(String(payload.id || ""))}
          onMouseLeave={() => setHoveredPinId(null)}
          onClick={(e) => { e.stopPropagation(); setSelectedPinId(String(payload.id || "")); }} />
      );
    }

    // ============ RENDER ============
    if (!all.length) {
      return (
        <div className="space-y-5">
          <div className="rounded-xl border border-line bg-ink-850/40 p-12 text-center shadow-panel">
            <div className="font-mono text-[11px] tracking-[0.18em] uppercase text-volt mb-2">
              dashboard
            </div>
            <div className="text-2xl font-medium tracking-tight mb-2">아직 반영된 결과가 없습니다</div>
            <div className="text-fog-400 max-w-xl mx-auto">
              Training · Inference 테스트 탭에서 호스트별 결과 옆 <b className="text-volt">▴ 대시보드 반영</b> 버튼을 눌러주세요.
            </div>
          </div>
          <RecentRunsPanel pinned={pinned} setPinned={setPinned} onDeleteRun={onDeleteRun} />
        </div>
      );
    }

    const fieldsInUse = new Set([
      xField, yField, ...groupFields,
    ].filter(Boolean));

    const renderSelect = (label, value, onChange, options, allLabel, disabled = false) => (
      <div className="dash-mini-section">
        <div className="label-mono mb-2">{label}</div>
        <select value={value} onChange={(e) => onChange(e.target.value)} className="inp font-mono" disabled={disabled}>
          {allLabel && <option value="__all__">{allLabel}</option>}
          {options.map((v) => <option key={v.value ?? v} value={v.value ?? v}>{v.label ?? v}</option>)}
        </select>
      </div>
    );

    const controlsPanel = (
      <div className="card card-pad dash-side">
        <div className="dash-mini-section">
          <div className="label-mono mb-2">카테고리</div>
          <div className="seg w-full grid grid-cols-1 gap-2">
            {[
              ["training", "Training 테스트"],
              ["inference", "Inference 테스트"],
            ].map(([value, label]) => (
              <button

                className={"seg-btn" + (category === value ? " active" : "")}
                onClick={() => {

                  setVersionFilter("__all__");
                  setModel("__all__");

                  setModeFilter("__all__");

                  setChartPinIds(null);

        <div className="dash-mini-section">

            className="inp font-mono"
          >
            {categoryTestKindOptions.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}

        {!(category === "inference" && testKind === "vllm") && renderSelect(

          versionOptions, "all versions"
        )}

        {renderSelect(

          modelOptions, "all models"

        {renderSelect(

          envOptions.map((v) => ({ value: v, label: dashValueLabel("env", v) })), "all environments"
        )}

        {category === "inference" && testKind === "vllm" && renderSelect(

        <div className="dash-mini-section">

    const trainingAxisFieldGroups = [

      { label: "Parallelism", fields: MLPERF_PARALLEL_FIELDS.filter((k) => axisFieldKeys.has(k)) },
    ].filter((g) => g.fields.length);
    const inferenceAxisFieldGroups = [

    ].filter((g) => g.fields.length);
    const axisFieldGroups = category === "training" ? trainingAxisFieldGroups : inferenceAxisFieldGroups;
    const resultFieldGroups = category === "training"
      ? [{ label: "Result", fields: MLPERF_RESULT_FIELDS.filter((k) => allMetricKeys.includes(k)) }]
      : [{ label: "Result", fields: allMetricKeys }];
    const renderOptionGroups = (groups) => groups.map((g) => (
      <optgroup key={g.label} label={g.label}>

      </optgroup>

    const chartControls = (
      <div className="axis-select-panel">
        <div className="label-mono mb-3">axis / groups</div>
        <div className="axis-select-grid">
          <label className="axis-select-card">
            <span>x axis</span>
            <select className="inp" value={xField || ""} onChange={(e) => setXField(e.target.value || null)}>

          <label className="axis-select-card">

            </select>
          </label>
          <label className="axis-select-card axis-select-card-wide">
            <span>groups</span>
            <select className="inp" value={groupFields[0] || "__none__"} onChange={(e) => setGroupFields(e.target.value === "__none__" ? [] : [e.target.value])}>
              <option value="__none__">None</option>
              {renderOptionGroups(axisFieldGroups)}
            </select>

    const chartPanel = (
      <div className="card card-pad min-h-[560px]">
        {chartControls}
        <div className="flex items-center justify-between mb-3">
          <div className="text-[10px] font-mono uppercase tracking-[0.16em] text-fog-500">
            {chartType} · pins: {projected.length} · gpus: {gpus.length} · groups: {groupKeys.length || 1}{hasAutoDashboardScope ? " · auto scope" : ""}
          </div>
          <div className="dashboard-legend">
            {legendItems.map((item) => (
              <button key={item.key} className="dashboard-legend-item" type="button">

                <span>{item.label}</span>
              </button>
            ))}

        {projected.length === 0 ? (

            조건에 맞는 데이터 포인트가 없습니다. 필터를 풀어보세요.
          </div>
        ) : (
          <div data-dashboard-chart>
            <ResponsiveContainer width="100%" height={500}>
              {chartType === "bar" ? (
                <BarChart data={barData} margin={{ top: 10, right: 24, left: 4, bottom: 8 }} onClick={handleDashboardChartClick}>
                  <CartesianGrid stroke="#2c2a39" strokeDasharray="3 3" />
                  <XAxis dataKey="_xLabel"
                         tickFormatter={(v) => typeof v === "number" ? _fmtAxis(v) : String(v)}
                         tick={{ fontSize: 11, fontFamily: "ui-monospace, monospace", fill: "#9aa3b2" }}
                         stroke="#46415c" />
                  <YAxis tick={{ fontSize: 11, fontFamily: "ui-monospace, monospace", fill: "#9aa3b2" }}
                         tickFormatter={_fmtAxis}
                         stroke="#46415c" domain={yDomain}
                         label={{ value: yField || "", angle: -90, position: "insideLeft", style: { fill: "#9aa3b2", fontSize: 11, fontFamily: "ui-monospace, monospace" } }}/>
                  <Tooltip content={<BarTooltip yField={yField} />} cursor={{ fill: "rgba(3,218,198,0.06)" }} />
                  {barColumns.map((col, idx) => (
                    <Bar key={col} dataKey={col} name={col === "value" ? "" : col} fill={DASHBOARD_CHART_COLORS[idx % DASHBOARD_CHART_COLORS.length]} radius={[4, 4, 0, 0]} onClick={(payload) => selectPinFromChartPayload(payload?.payload)}>
                      {barData.map((entry, i) => (
                        <Cell key={`${col}-${i}`} fill={colorOf(col.split(" · ")[0], col.includes(" · ") ? col.split(" · ").slice(1).join(" · ") : "")} />
                      ))}
                    </Bar>
                  ))}
                </BarChart>
              ) : chartType === "scatter" ? (
                <ScatterChart margin={{ top: 10, right: 24, left: 4, bottom: 12 }} onClick={handleDashboardChartClick}>
                  <CartesianGrid stroke="#2c2a39" strokeDasharray="3 3" />
                  <XAxis type={xIsNumeric ? "number" : "category"}
                         dataKey="_x" name={xField || ""}
                         tickFormatter={xIsNumeric ? _fmtAxis : undefined}
                         {...(xIsNumeric ? numericXAxisProps : {})}
                         tick={{ fontSize: 11, fontFamily: "ui-monospace, monospace", fill: "#9aa3b2" }}
                         stroke="#46415c"

                  <YAxis type="number" dataKey="_y" name={yField || ""}
                         tick={{ fontSize: 11, fontFamily: "ui-monospace, monospace", fill: "#9aa3b2" }}
                         tickFormatter={_fmtAxis}
                         stroke="#46415c" domain={yDomain}

                  <Tooltip content={(props) => <PointTooltip {...props} preferredId={hoveredPinId} />} cursor={{ stroke: "#46415c", strokeDasharray: "3 3" }} />
                  {seriesByGpuGroup.map((s) => (
                    <Scatter key={`${s.gpu_type}::${s.groupKey}`} name={dashboardSeriesLabel(s)} data={s.points} fill={colorOf(s.gpu_type, s.groupKey)} shape={(props) => <DashboardScatterShape {...props} />} />

                  <CartesianGrid stroke="#2c2a39" strokeDasharray="3 3" />
                  <XAxis type={xIsNumeric ? "number" : "category"}
                         dataKey="_x" name={xField || ""} allowDuplicatedCategory={false}
                         tickFormatter={xIsNumeric ? _fmtAxis : undefined}
                         {...(xIsNumeric ? numericXAxisProps : {})}
                         tick={{ fontSize: 11, fontFamily: "ui-monospace, monospace", fill: "#9aa3b2" }}
                         stroke="#46415c"
                         label={{ value: fieldLabel(xField || ""), position: "insideBottom", offset: -4, style: { fill: "#9aa3b2", fontSize: 11, fontFamily: "ui-monospace, monospace" } }}/>
                  <YAxis type="number" dataKey="_y"
                         tick={{ fontSize: 11, fontFamily: "ui-monospace, monospace", fill: "#9aa3b2" }}
                         tickFormatter={_fmtAxis}
                         stroke="#46415c" domain={yDomain}
                         label={{ value: fieldLabel(yField || ""), angle: -90, position: "insideLeft", style: { fill: "#9aa3b2", fontSize: 11, fontFamily: "ui-monospace, monospace" } }}/>
                  <Tooltip content={(props) => <PointTooltip {...props} preferredId={hoveredPinId} />} />
                  {seriesByGpuGroup.map((s) => {
                    const sorted = [...s.points].sort((a, b) => {
                      const ax = a._x, bx = b._x;
                      if (typeof ax === "number" && typeof bx === "number") return ax - bx;
                      return String(ax).localeCompare(String(bx));
                    });
                    const c = colorOf(s.gpu_type, s.groupKey);
                    return (
                      <Line key={`${s.gpu_type}::${s.groupKey}`} type="linear" dataKey="_y" data={sorted}
                            name={dashboardSeriesLabel(s)}
                            stroke={c} strokeWidth={2.4}
                            dot={(props) => <DashboardLineDot {...props} />}
                            activeDot={(props) => <DashboardLineDot {...props} />} isAnimationActive={false} />
                    );
                  })}
                </LineChart>
              )}
            </ResponsiveContainer>
          </div>
        )}
      </div>
    );

    const tablePins = candidatePins.filter((p) =>
      dashboardPinCategory(p) === category && dashboardTestKindOfPin(p) === testKind
    );
    const pinnedCategoryLabel = `${category === "training" ? "Training 테스트" : "Inference 테스트"} · ${dashboardTestKindLabel(category, testKind)}`;

    const pinnedTable = (
      <div className="card card-pad">
        <div className="flex items-center justify-between mb-3">
          <div>
            <div className="label-mono">pinned data · {pinnedCategoryLabel}</div>
            <div className="text-[11px] text-fog-500 mt-1">체크된 pinned data만 그래프에 표시됩니다. 현재 {selectedChartPinIds.length}/{candidatePinIds.length}개 표시 중입니다.</div>
          </div>
          <div className="flex items-center gap-2">
            <button className="copy-mini" onClick={selectAllChartPins}>전체 선택</button>
            <button className="copy-mini" onClick={clearChartPins}>전체 해제</button>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="pinned-data-table w-full text-[11px] font-mono">
            <thead>
              <tr>
                <th className="text-center">그래프</th>
                <th className="text-left">{activeDashboardGroupFields.length ? activeDashboardGroupFields.map(fieldLabel).join(" / ") : "Gpu type"}</th>
                <th className="text-right">num_gpus</th>
                <th className="text-left">model</th>
                {xField && <th className="text-right">{fieldLabel(xField)}</th>}
                {yField && <th className="text-right">{fieldLabel(yField)}</th>}
                <th className="text-center">실험 세팅 확인</th>
                <th className="text-center">결과 확인</th>
                <th className="text-center">log path</th>
                <th className="text-right">start time</th>
                <th className="text-right"></th>
              </tr>
            </thead>
            <tbody>
              {tablePins.map((p) => {
                const logPath = p.log_dir || p.log_path || "";
                const g = dashboardPinGroupInfo(p);
                const isSelected = String(selectedPinId || "") === String(p.id || "");
                return (
                  <tr key={p.id}
                    className={"pinned-data-row " + (isSelected ? "selected" : "")}
                    onClick={() => setSelectedPinId(String(p.id || ""))}>
                    <td className="text-center" onClick={(e) => e.stopPropagation()}>
                      <input type="checkbox" checked={selectedChartPinSet.has(String(p.id || ""))} onChange={() => toggleChartPin(p.id)} title="그래프 표시" />
                    </td>
                    <td>
                      <span className="pin-value-pill">
                        <span className="pin-swatch" style={{ backgroundColor: g.color }} />
                        {g.value}
                      </span>
                    </td>
                    <td className="text-right">{dashboardPinNumGpus(p)}</td>
                    <td className="truncate max-w-[220px]">{p.model || "—"}</td>
                    {xField && <td className="text-right">{_fmt(dashboardValueForPinField(p, xField))}</td>}
                    {yField && <td className="text-right">{_fmt(dashboardValueForPinField(p, yField))}</td>}
                    <td className="text-center">
                      <button className="copy-mini" onClick={(e) => { e.stopPropagation(); setHpPreviewPin(p); }}>확인</button>
                    </td>
                    <td className="text-center">
                      <button className="copy-mini" onClick={(e) => { e.stopPropagation(); setResultPreviewPin(p); }}>확인</button>
                    </td>
                    <td className="text-center">
                      {logPath ? (
                        <button className="copy-mini" onClick={(e) => { e.stopPropagation(); copyDashboardPath(logPath); }} title="log path copy">copy</button>
                      ) : <span className="text-fog-600">—</span>}
                    </td>
                    <td className="text-right text-fog-500">{dashboardPinStartTimeLabel(p)}</td>
                    <td className="text-right">
                      <button onClick={(e) => { e.stopPropagation(); removePin(p.id); }} className="text-fog-500 hover:text-err text-[12px]">×</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );

    const hpPreviewEntries = dashboardExperimentSettingEntries(hpPreviewPin);
    const resultPreviewEntries = dashboardResultMetricEntries(resultPreviewPin);
    const hpPreviewModal = hpPreviewPin ? (
      <ModalShell title="실험 세팅 확인" subtitle={hpPreviewPin.run_id || hpPreviewPin.model || "pinned data"}
        onClose={() => setHpPreviewPin(null)}>
        {hpPreviewEntries.length ? (
          <div className="overflow-x-auto rounded-xl border border-line bg-ink-950/50">
            <table className="w-full text-[12px] font-mono">
              <tbody>
                {hpPreviewEntries.map(([k, v]) => (
                  <tr key={k} className="border-b border-line/40 last:border-b-0">
                    <td className="px-3 py-2 text-fog-500 whitespace-nowrap">{k}</td>
                    <td className="px-3 py-2 text-fog-100 break-all whitespace-pre-wrap">{String(v)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="text-fog-500 text-[13px]">저장된 실험 세팅 snapshot이 없습니다.</div>
        )}
      </ModalShell>
    ) : null;
    const resultPreviewModal = resultPreviewPin ? (
      <ModalShell title="결과 확인" subtitle={resultPreviewPin.run_id || resultPreviewPin.model || "pinned data"}
        onClose={() => setResultPreviewPin(null)}>
        {resultPreviewEntries.length ? (
          <div className="overflow-x-auto rounded-xl border border-line bg-ink-950/50">
            <table className="w-full text-[12px] font-mono">
              <thead>
                <tr className="border-b border-line/60 text-fog-500">
                  <th className="px-3 py-2 text-left">metric</th>
                  <th className="px-3 py-2 text-right">value</th>
                </tr>
              </thead>
              <tbody>
                {resultPreviewEntries.map(([k, v]) => (
                  <tr key={k} className="border-b border-line/40 last:border-b-0">
                    <td className="px-3 py-2 text-fog-500 whitespace-nowrap">{fieldLabel(k)}</td>
                    <td className="px-3 py-2 text-fog-100 text-right break-all">{String(v)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="text-fog-500 text-[13px]">저장된 parsed result metric이 없습니다.</div>
        )}
      </ModalShell>
    ) : null;

    return (
      <div className="space-y-5">
        <div className="dashboard-layout">
          {controlsPanel}
          {chartPanel}
        </div>
        {pinnedTable}
        <RecentRunsPanel pinned={pinned} setPinned={setPinned} onDeleteRun={onDeleteRun} />
        {hpPreviewModal}
        {resultPreviewModal}
      </div>
    );
  }

  // Custom Tooltip for bar charts (displays which gpu+col + Y value).
  function BarTooltip({ active, payload, yField }) {
    if (!active || !payload || !payload.length) return null;
    const row = payload[0].payload;
    return (
      <div className="rounded-md border border-line bg-ink-900/95 px-3 py-2 text-[11px] font-mono shadow-panel">
        <div className="text-volt mb-1">{row.gpu_type}</div>
        {payload.map((p, i) => (
          <div key={i}>
            <span className="text-fog-500">{p.dataKey === "value" ? fieldLabel(yField) : p.dataKey} = </span>
            <span className="text-fog-100">{_fmt(p.value)}</span>
          </div>
        ))}
      </div>
    );
  }

  const BenchPill = ({ active, onClick, children, disabled }) => (
    <button type="button" onClick={onClick} disabled={disabled}
      className={"btn px-3 py-1.5 rounded-md text-sm font-medium border " +
        (active ? "bg-volt/10 text-volt border-volt/40"
                : "bg-ink-850 text-fog-200 border-line hover:bg-ink-700") +
        (disabled ? " opacity-50 cursor-not-allowed" : "")}>
      {children}
    </button>
  );

  const BenchField = ({ label, children, hint }) => (
    <div>
      <div className="flex items-center justify-between mb-1.5">
        <span className="text-[12px] text-fog-300 font-medium tracking-tight">{label}</span>
        {hint && <span className="text-[11px] text-fog-500">{hint}</span>}
      </div>
      {children}
    </div>
  );

  const BenchNumInput = ({ value, onChange, min, placeholder }) => (
    <input type="number" min={min} value={value} placeholder={placeholder}
      onChange={(e) => onChange(e.target.value)}
      className="w-full bg-ink-850 border border-line rounded px-2 py-1.5 text-sm font-mono text-fog-100 focus:outline-none focus:border-volt/50"/>
  );

  // =========================================================================
  // 2/3. vLLM Bench tab + PD tab
  //   Both share most of the layout with the MLPerf tab. They produce a
  //   "kind"-flavored start payload that POSTs to /api/runs.
  // =========================================================================

  function VllmBenchConfig({ onStart, busy, historyPanel }) {
    // ----- localStorage keys (v2 schema: includes mode + ray topology) -----
    const STATE_KEY = "platform_vllm_state_v2";
    const WORKERS_DRAFT_KEY = "platform_vllm_workers_draft_v2";

    // ----- Restore persisted draft -----
    const persisted = (() => {
      try { return JSON.parse(window.localStorage.getItem(STATE_KEY) || "{}"); }
      catch (_) { return {}; }
    })();

    // ----- top-level mode -----
    const [mode, setMode]       = useState(persisted.mode || "single"); // single | multi

    // ----- common -----
    const [engine, setEngine]   = useState(persisted.engine || "vllm");
    const [model, setModel]     = useState(persisted.model || "Qwen3-32B");
    const [modelPath, setModelPath] = useState(persisted.modelPath || "");
    const [gpuType, setGpuType] = useState(persisted.gpuType || "H100");
    const [bmtHost, setBmtHost] = useState(persisted.bmtHost || "");

    // ----- single-node -----
    const [singleHost, setSingleHost] = useState(persisted.singleHost || "");

    // ----- multi-node -----
    const [rayHeadHost, setRayHeadHost] = useState(persisted.rayHeadHost || "");
    const [rayHeadPort, setRayHeadPort] = useState(persisted.rayHeadPort ?? 6379);
    const [rayWorkerPort, setRayWorkerPort] = useState(persisted.rayWorkerPort ?? 6379);
    const rayWorkersRef = useRef(null);

    // ----- vllm serve -----
    const [vllmPort, setVllmPort] = useState(persisted.vllmPort ?? 8000);
    const [tp, setTp]   = useState(persisted.tp ?? 1);
    const [pp, setPp]   = useState(persisted.pp ?? 1);

    // ----- bench data + bench serve args -----
    const [benchData, setBenchData]     = useState(persisted.benchData || "sharegpt");
    const [datasetPath, setDatasetPath] = useState(persisted.datasetPath || "");
    const [numPrompts, setNumPrompts]   = useState(persisted.numPrompts ?? 200);
    const [inputLen, setInputLen]       = useState(persisted.inputLen ?? 1024);    // random only
    const [outputLen, setOutputLen]     = useState(persisted.outputLen ?? 1024);   // sharegpt_output_len | random_output_len
    const [requestRate, setRequestRate]     = useState(persisted.requestRate || "inf");
    const [maxConcurrency, setMaxConcurrency] = useState(persisted.maxConcurrency ?? 32);
    const [maxModelLen, setMaxModelLen]   = useState(persisted.maxModelLen ?? 4096);

    const [dryRun, setDryRun] = useState(false);
    const [error, setError]   = useState("");

    // Persist whenever anything changes (debounced lightly).
    useEffect(() => {
      const snap = {
        mode, engine, model, modelPath, gpuType, bmtHost, singleHost,
        rayHeadHost, rayHeadPort, rayWorkerPort,
        vllmPort, tp, pp,
        benchData, datasetPath, numPrompts, inputLen, outputLen,
        requestRate, maxConcurrency, maxModelLen,
      };
      try { window.localStorage.setItem(STATE_KEY, JSON.stringify(snap)); } catch (_) {}
    }, [mode, engine, model, modelPath, gpuType, bmtHost, singleHost,
        rayHeadHost, rayHeadPort, rayWorkerPort,
        vllmPort, tp, pp,
        benchData, datasetPath, numPrompts, inputLen, outputLen,
        requestRate, maxConcurrency, maxModelLen]);

    // vLLM Bench 탭에서는 세부 argument 정의 UI를 제거한다.
    // CLI/env escape-hatch는 의도적으로 전송하지 않고, 화면에 보이는
    // vllm serve / vllm bench serve 필드만 params로 전달한다.
    const argSchema = [];

    const validData = SUPPORTED_VLLM.bench_data[engine] || [];
    useEffect(() => {
      if (validData.length === 0) { setBenchData(""); return; }
      if (!validData.includes(benchData)) setBenchData(validData[0]);
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [engine]);

    const saveWorkersDraft = (v) => {
      try { window.localStorage.setItem(WORKERS_DRAFT_KEY, v || ""); } catch (_) {}
    };

    // Parse worker textarea -> sorted unique host list
    const parseWorkers = () => {
      const raw = rayWorkersRef.current?.value || "";
      return Array.from(new Set(raw.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)));
    };

    const submit = async () => {
      setError("");
      if (engine === "sglang") { setError("sglang 엔진은 추후 개발 예정입니다."); return; }
      if (!model.trim())   { setError("model_name을 입력하세요."); return; }
      if (!modelPath.trim()) { setError("model_path를 입력하세요. 폐쇄망에서는 사전에 다운로드된 로컬 모델 폴더가 필요합니다."); return; }
      if (!benchData)      { setError("bench_data를 선택하세요."); return; }

      let hosts = [];
      if (mode === "single") {
        if (!singleHost.trim()) { setError("host를 입력하세요."); return; }
        hosts = [singleHost.trim()];
      } else {
        if (!rayHeadHost.trim()) { setError("ray head host를 입력하세요."); return; }
        const workers = parseWorkers();
        if (workers.length === 0) { setError("ray worker host를 1개 이상 입력하세요."); return; }
        saveWorkersDraft(rayWorkersRef.current?.value || "");
        hosts = [rayHeadHost.trim(), ...workers];
      }
      const node_gpu_map = Object.fromEntries(hosts.map((h) => [h, gpuType]));

      const cliArgs = {};
      const envArgs = {};

      try {
        await onStart({
          kind: "vllm_bench",
          suite: "vllm",
          version: "bench",
          gpu_type: gpuType,
          hosts,
          node_gpu_map,
          dry_run: dryRun,
          params: {
            engine,
            model: model.trim(),
            model_path: modelPath.trim(),
            bench_data: benchData,
            mode,
            vllm_port: Number(vllmPort),
            tp: Number(tp),
            pp: Number(pp),
            ...(mode === "multi" ? {
              ray_head_port:   Number(rayHeadPort),
              ray_worker_port: Number(rayWorkerPort),
            } : {}),
            num_prompts:    Number(numPrompts),
            request_rate:   String(requestRate),
            max_concurrency: Number(maxConcurrency),
            max_model_len:  Number(maxModelLen),
            ...(datasetPath.trim() ? { dataset_path: datasetPath.trim() } : {}),
            ...(benchData === "random" ? { input_len: Number(inputLen) } : {}),
            output_len:     Number(outputLen),
            ...(bmtHost.trim() ? { bmt_host: bmtHost.trim() } : {}),
            ...(cliArgs.extra_args ? { extra_args: String(cliArgs.extra_args) } : {}),
            args: envArgs,
          },
        });
      } catch (e) {
        setError(String(e.message || e));
      }
    };

    const Pill = BenchPill;
    const Field = BenchField;
    const NumInput = BenchNumInput;

    const topologyPanel = (
      <div className="space-y-5">
        <div>
          <h2 className="text-[11px] uppercase tracking-[0.18em] text-fog-400 font-mono mb-3">
            topology & model
          </h2>
          <Field label="engine">
            <div className="flex gap-2">
              <Pill active={engine === "vllm"} onClick={() => setEngine("vllm")}>vllm</Pill>
              <Pill active={engine === "sglang"} onClick={() => setEngine("sglang")}>
                sglang <span className="text-[9px] text-fog-500 ml-1">TBD</span>
              </Pill>
            </div>
          </Field>
        </div>

        <div className="rounded-lg border border-line bg-ink-900/40 p-3 space-y-3">
          <Field label="topology">
            <div className="flex gap-2 flex-wrap">
              <Pill active={mode === "single"} onClick={() => setMode("single")}>single node</Pill>
              <Pill active={mode === "multi"}  onClick={() => setMode("multi")}>multi node (ray)</Pill>
            </div>
          </Field>

          <Field label="gpu type">
            <select value={gpuType} onChange={(e) => setGpuType(e.target.value)}
              className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono">
              {SUPPORTED_VLLM.gpus.map((g) => <option key={g} value={g}>{g}</option>)}
            </select>
          </Field>

          {mode === "single" ? (
            <Field label="host">
              <input type="text" value={singleHost}
                onChange={(e) => setSingleHost(e.target.value)} spellCheck={false}
                placeholder="e.g. gpu-node01"
                className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 placeholder-fog-600 focus:outline-none focus:border-volt/50"/>
            </Field>
          ) : (
            <>
              <div className="grid grid-cols-3 gap-2">
                <div className="col-span-2">
                  <Field label="ray head host">
                    <input type="text" value={rayHeadHost}
                      onChange={(e) => setRayHeadHost(e.target.value)} spellCheck={false}
                      placeholder="e.g. gpu-node01"
                      className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 placeholder-fog-600 focus:outline-none focus:border-volt/50"/>
                  </Field>
                </div>
                <Field label="head port" hint="ray --port">
                  <NumInput value={rayHeadPort} onChange={setRayHeadPort} min={1} placeholder="6379"/>
                </Field>
              </div>

              <Field label="ray worker hosts" hint="space- or comma-separated">
                <textarea ref={rayWorkersRef} rows={2} spellCheck={false}
                  defaultValue={(() => { try { return window.localStorage.getItem(WORKERS_DRAFT_KEY) || ""; } catch (_) { return ""; } })()}
                  onInput={(e) => saveWorkersDraft(e.currentTarget.value)}
                  placeholder="gpu-node02  gpu-node03"
                  className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 focus:outline-none focus:border-volt/50"/>
              </Field>

              <Field label="worker port" hint="port they connect TO on head (ray address)">
                <NumInput value={rayWorkerPort} onChange={setRayWorkerPort} min={1} placeholder="6379"/>
              </Field>
            </>
          )}
        </div>

        <div className="rounded-lg border border-line bg-ink-900/40 p-3 space-y-3">
          <Field label="model_name" hint="served model name / request model">
            <input type="text" value={model} onChange={(e) => setModel(e.target.value)}
              spellCheck={false} placeholder="e.g. Qwen3-32B"
              className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 focus:outline-none focus:border-volt/50"
            />
          </Field>
          <Field label="model_path" hint="local folder on every serve host">
            <input type="text" value={modelPath} onChange={(e) => setModelPath(e.target.value)}
              spellCheck={false} placeholder="/home/.../models/Qwen3-32B"
              className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 focus:outline-none focus:border-volt/50"
            />
          </Field>
          <div className="text-[10px] text-fog-500 font-mono leading-snug">
            폐쇄망 기준: serve host에 이미 존재하는 로컬 모델 폴더를 Docker에 read-only mount하여 사용합니다.
          </div>
        </div>

        {historyPanel}
      </div>
    );

    const argumentPanel = (
      <div className="space-y-5">
        <div className="pt-0">
          <h2 className="text-[11px] uppercase tracking-[0.18em] text-fog-400 font-mono mb-3">
            vllm serve / bench arguments
          </h2>
        </div>

        <div className="rounded-lg border border-line bg-ink-900/40 p-3 space-y-3">
          <div className="text-[11px] uppercase tracking-[0.16em] text-fog-400 font-mono">
            vllm serve arguments
          </div>
          <div className="grid grid-cols-3 gap-2">
            <Field label="port" hint="--port">
              <NumInput value={vllmPort} onChange={setVllmPort} min={1} placeholder="8000"/>
            </Field>
            <Field label="tensor parallel" hint="--tp">
              <NumInput value={tp} onChange={setTp} min={1} placeholder="1"/>
            </Field>
            <Field label="pipeline parallel" hint="--pp">
              <NumInput value={pp} onChange={setPp} min={1} placeholder="1"/>
            </Field>
          </div>
          <Field label="max_model_len">
            <NumInput value={maxModelLen} onChange={setMaxModelLen} min={64} placeholder="4096"/>
          </Field>
        </div>

        <div className="rounded-lg border border-line bg-ink-900/40 p-3 space-y-3">
          <div className="text-[11px] uppercase tracking-[0.16em] text-fog-400 font-mono">
            vllm bench serve arguments
          </div>

          <Field label="dataset-name" hint={validData.length ? "" : "engine TBD"}>
            {validData.length === 0 ? (
              <div className="text-xs text-fog-500 italic font-mono">no datasets</div>
            ) : (
              <div className="flex gap-2 flex-wrap">
                {validData.map((d) => (
                  <Pill key={d} active={benchData === d} onClick={() => setBenchData(d)}>{d}</Pill>
                ))}
              </div>
            )}
          </Field>

          <Field label="dataset-path" hint={benchData === "sharegpt" ? "ShareGPT JSON path" : "optional for random"}>
            <input type="text" value={datasetPath}
              onChange={(e) => setDatasetPath(e.target.value)} spellCheck={false}
              placeholder={benchData === "sharegpt"
                ? "/path/to/ShareGPT_V3_unfiltered_cleaned_split.json"
                : "(usually unused for random)"}
              className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 placeholder-fog-600 focus:outline-none focus:border-volt/50"
            />
          </Field>

          <div className="grid grid-cols-3 gap-2">
            <Field label="num-prompts">
              <NumInput value={numPrompts} onChange={setNumPrompts} min={1} placeholder="200"/>
            </Field>
            {benchData === "random" ? (
              <Field label="input-len" hint="--random-input-len">
                <NumInput value={inputLen} onChange={setInputLen} min={1} placeholder="1024"/>
              </Field>
            ) : (
              <div />
            )}
            <Field label="output-len" hint={benchData === "random" ? "--random-output-len" : "--sharegpt-output-len"}>
              <NumInput value={outputLen} onChange={setOutputLen} min={1} placeholder="1024"/>
            </Field>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <Field label="request-rate" hint="inf = offline">
              <input type="text" value={requestRate}
                onChange={(e) => setRequestRate(e.target.value)} placeholder="inf"
                className="w-full bg-ink-850 border border-line rounded px-2 py-1.5 text-sm font-mono text-fog-100"/>
            </Field>
            <Field label="max-concurrency">
              <NumInput value={maxConcurrency} onChange={setMaxConcurrency} min={1} placeholder="32"/>
            </Field>
          </div>
        </div>

        <Field label="bmt host" hint="serve와 분리된 별도 BMT 호스트 (optional). 비우면 single host / ray head가 BMT 역할">
          <input type="text" value={bmtHost} onChange={(e) => setBmtHost(e.target.value)}
            spellCheck={false} placeholder="e.g. gpu-node03 (optional)"
            className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 placeholder-fog-600 focus:outline-none focus:border-volt/50"
          />
        </Field>

        <label className="flex items-center gap-2 text-sm select-none cursor-pointer">
          <input type="checkbox" checked={dryRun} onChange={(e) => setDryRun(e.target.checked)} className="accent-volt"/>
          <span className="text-fog-200">dry-run</span>
        </label>

        {error && <div className="text-xs text-err border border-err/40 bg-err/5 px-3 py-2 rounded font-mono">{error}</div>}

        <button onClick={submit}
          disabled={busy
            || !model.trim()
            || !modelPath.trim()
            || (mode === "single" && !singleHost.trim())
            || (mode === "multi"  && !rayHeadHost.trim())}
          className={"btn w-full py-2.5 rounded-md font-semibold tracking-tight " +
            (busy
              || !model.trim()
              || !modelPath.trim()
              || (mode === "single" && !singleHost.trim())
              || (mode === "multi"  && !rayHeadHost.trim())
              ? "bg-ink-700 text-fog-400 cursor-not-allowed"
              : "bg-volt text-ink-950 hover:bg-voltlo shadow-voltglow")}>
          {busy ? "starting…" : "▸ run vllm bench"}
        </button>
      </div>
    );

    return (
      <div className="grid gap-5 xl:grid-cols-2 items-start">
        {topologyPanel}
        {argumentPanel}
      </div>
    );
  }


  function PdConfig({ onStart, busy, args, setArgs, showAdv, setShowAdv, setSchema }) {
    const KEY_P = "platform_pd_prefill_v1";
    const KEY_D = "platform_pd_decode_v1";

    const [engine, setEngine] = useState("vllm");
    const [model, setModel] = useState("Qwen3-32B");
    const [modelPath, setModelPath] = useState("");
    const [benchData, setBenchData] = useState("sharegpt");
    const [numPrompts, setNumPrompts] = useState(200);
    const [requestRate, setRequestRate] = useState("inf");
    const [maxModelLen, setMaxModelLen] = useState(4096);
    const [gpuType, setGpuType] = useState("H100");
    const [prefillTp, setPrefillTp] = useState(4);
    const [decodeTp, setDecodeTp] = useState(4);
    const [prefill, setPrefill] = useState(() => {
      try { return JSON.parse(window.localStorage.getItem(KEY_P) || "[]"); } catch (_) { return []; }
    });
    const [decode, setDecode] = useState(() => {
      try { return JSON.parse(window.localStorage.getItem(KEY_D) || "[]"); } catch (_) { return []; }
    });
    const [dryRun, setDryRun] = useState(false);
    const [error, setError] = useState("");
    const prefillRef = useRef(null);
    const decodeRef = useRef(null);

    const argSchema = resolveSchema(PD_ARG_SCHEMAS, `${engine}:${benchData || ""}`);

    // Push schema up so the 2nd column can render the same fields.
    useEffect(() => {
      if (setSchema) setSchema(argSchema);
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [engine, benchData]);

    useEffect(() => {
      const allowed = new Set(argSchema.map((f) => f.key));
      setArgs((prev) => {
        const next = {};
        Object.entries(prev || {}).forEach(([k, v]) => { if (allowed.has(k)) next[k] = v; });
        return next;
      });
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [engine, benchData]);

    useEffect(() => {
      try { window.localStorage.setItem(KEY_P, JSON.stringify(prefill)); } catch (_) {}
    }, [prefill]);
    useEffect(() => {
      try { window.localStorage.setItem(KEY_D, JSON.stringify(decode)); } catch (_) {}
    }, [decode]);

    const validData = SUPPORTED_PD.bench_data[engine] || [];
    useEffect(() => {
      if (validData.length === 0) { setBenchData(""); return; }
      if (!validData.includes(benchData)) setBenchData(validData[0]);
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [engine]);

    const addToList = (which) => {
      const ref = which === "prefill" ? prefillRef : decodeRef;
      const setter = which === "prefill" ? setPrefill : setDecode;
      const raw = ref.current?.value || "";
      const hs = Array.from(new Set(raw.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)));
      if (!hs.length) { setError(`${which} host를 입력하세요.`); return; }
      setError("");
      setter((prev) => {
        const m = new Map(prev.map((n) => [n.host, n]));
        hs.forEach((h) => m.set(h, { host: h, gpu_type: gpuType }));
        return Array.from(m.values()).sort((a, b) => a.host.localeCompare(b.host));
      });
      if (ref.current) ref.current.value = "";
    };
    const removeFrom = (which, host) => {
      const setter = which === "prefill" ? setPrefill : setDecode;
      setter((prev) => prev.filter((n) => n.host !== host));
    };

    const submit = async () => {
      setError("");
      if (engine === "sglang") { setError("sglang PD는 추후 개발 예정입니다."); return; }
      if (!prefill.length) { setError("prefill 노드를 1개 이상 추가하세요."); return; }
      if (!decode.length) { setError("decode 노드를 1개 이상 추가하세요."); return; }
      if (!model.trim()) { setError("model_name을 입력하세요."); return; }
      if (!modelPath.trim()) { setError("model_path를 입력하세요. PD에서도 사전에 다운로드된 로컬 모델 폴더가 필요합니다."); return; }
      if (!benchData) { setError("bench_data를 선택하세요."); return; }

      const allNodes = [...prefill, ...decode];
      const node_gpu_map = Object.fromEntries(allNodes.map((n) => [n.host, n.gpu_type]));
      const hosts = allNodes.map((n) => n.host);

      const compact = compactArgs(args);
      const cliKeys = new Set(argSchema.filter((f) => f.role === "cli").map((f) => f.key));
      const cliArgs = {};
      const envArgs = {};
      Object.entries(compact).forEach(([k, v]) => {
        if (cliKeys.has(k)) cliArgs[k] = v; else envArgs[k] = v;
      });

      try {
        await onStart({
          kind: "pd_bench",
          suite: "pd",
          version: "bench",
          gpu_type: gpuType,
          hosts,
          node_gpu_map,
          dry_run: dryRun,
          params: {
            engine, model: model.trim(), model_path: modelPath.trim(), bench_data: benchData,
            prefill_hosts: prefill.map((n) => n.host),
            decode_hosts: decode.map((n) => n.host),
            prefill_tp: Number(prefillTp), decode_tp: Number(decodeTp),
            num_prompts: Number(numPrompts), request_rate: String(requestRate),
            max_model_len: Number(maxModelLen),
            ...(cliArgs.extra_args ? { extra_args: String(cliArgs.extra_args) } : {}),
            args: envArgs,
          },
        });
      } catch (e) {
        setError(String(e.message || e));
      }
    };

    const Pill = ({ active, onClick, children, disabled }) => (
      <button type="button" onClick={onClick} disabled={disabled}
        className={"btn px-3 py-1.5 rounded-md text-sm font-medium border " +
          (active ? "bg-volt/10 text-volt border-volt/40"
                  : "bg-ink-850 text-fog-200 border-line hover:bg-ink-700") +
          (disabled ? " opacity-50 cursor-not-allowed" : "")}>
        {children}
      </button>
    );
    const Field = ({ label, children, hint }) => (
      <div>
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-[11px] uppercase tracking-[0.16em] text-fog-400 font-mono">{label}</span>
          {hint && <span className="text-[10px] text-fog-500 font-mono">{hint}</span>}
        </div>
        {children}
      </div>
    );

    const NodeList = ({ which, nodes, refEl }) => (
      <div className="rounded-lg border border-line bg-ink-900/40 p-3 space-y-2">
        <div className="flex items-center justify-between">
          <div className="text-[11px] uppercase tracking-[0.16em] text-fog-400 font-mono">
            {which} hosts
          </div>
          <span className="text-[10px] font-mono text-fog-500">
            {nodes.length} node{nodes.length === 1 ? "" : "s"}
          </span>
        </div>
        <textarea ref={refEl} rows={2} spellCheck={false}
          className="w-full bg-ink-850 border border-line rounded-md px-2 py-1.5 text-sm font-mono text-fog-100 focus:outline-none focus:border-volt/50"
        />
        <button type="button" onClick={() => addToList(which)}
          className="btn w-full py-1.5 rounded-md font-semibold bg-ink-700 hover:bg-ink-600 border border-line text-fog-100 text-xs">
          + add {which}
        </button>
        {nodes.length > 0 && (
          <div className="space-y-1 max-h-[120px] overflow-y-auto pr-1">
            {nodes.map((n) => (
              <div key={n.host} className="flex items-center justify-between gap-1 rounded bg-ink-700/70 border border-line px-2 py-1">
                <div className="font-mono text-[11px] text-fog-100 truncate">
                  <span className="dot mr-2" style={{ background: colorForHost(n.host) }}></span>{n.host}
                </div>
                <button onClick={() => removeFrom(which, n.host)}
                  className="btn shrink-0 px-1.5 py-0.5 rounded text-[10px] font-mono border border-line bg-ink-850 hover:bg-err/10 text-fog-300 hover:text-err">
                  ×
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    );

    return (
      <div className="space-y-5">
        <div>
          <h2 className="text-[11px] uppercase tracking-[0.18em] text-fog-400 font-mono mb-3">
            pd config
          </h2>
          <Field label="engine">
            <div className="flex gap-2">
              <Pill active={engine === "vllm"} onClick={() => setEngine("vllm")}>vllm</Pill>
              <Pill active={engine === "sglang"} onClick={() => setEngine("sglang")}>
                sglang <span className="text-[9px] text-fog-500 ml-1">TBD</span>
              </Pill>
            </div>
          </Field>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <Field label="model_name" hint="served model name">
            <input type="text" value={model} onChange={(e) => setModel(e.target.value)} spellCheck={false}
              placeholder="e.g. Qwen3-32B"
              className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 focus:outline-none focus:border-volt/50"/>
          </Field>
          <Field label="model_path" hint="local folder on every P/D host">
            <input type="text" value={modelPath} onChange={(e) => setModelPath(e.target.value)} spellCheck={false}
              placeholder="/home/.../models/Qwen3-32B"
              className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 focus:outline-none focus:border-volt/50"/>
          </Field>
        </div>

        <Field label="bench data">
          {validData.length === 0 ? (
            <div className="text-xs text-fog-500 italic font-mono">TBD</div>
          ) : (
            <div className="flex gap-2 flex-wrap">
              {validData.map((d) => (
                <Pill key={d} active={benchData === d} onClick={() => setBenchData(d)}>{d}</Pill>
              ))}
            </div>
          )}
        </Field>

        <Field label="gpu type">
          <select value={gpuType} onChange={(e) => setGpuType(e.target.value)}
            className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono">
            {SUPPORTED_PD.gpus.map((g) => <option key={g} value={g}>{g}</option>)}
          </select>
        </Field>

        <div className="grid grid-cols-2 gap-3">
          <Field label="prefill TP">
            <input type="number" min={1} value={prefillTp}
              onChange={(e) => setPrefillTp(e.target.value)}
              className="w-full bg-ink-850 border border-line rounded px-2 py-1.5 text-sm font-mono"/>
          </Field>
          <Field label="decode TP">
            <input type="number" min={1} value={decodeTp}
              onChange={(e) => setDecodeTp(e.target.value)}
              className="w-full bg-ink-850 border border-line rounded px-2 py-1.5 text-sm font-mono"/>
          </Field>
        </div>

        <NodeList which="prefill" nodes={prefill} refEl={prefillRef} />
        <NodeList which="decode"  nodes={decode}  refEl={decodeRef} />

        <div className="grid grid-cols-3 gap-2">
          <Field label="num prompts">
            <input type="number" value={numPrompts}
              onChange={(e) => setNumPrompts(e.target.value)}
              className="w-full bg-ink-850 border border-line rounded px-2 py-1.5 text-sm font-mono"/>
          </Field>
          <Field label="req rate">
            <input type="text" value={requestRate}
              onChange={(e) => setRequestRate(e.target.value)} placeholder="inf"
              className="w-full bg-ink-850 border border-line rounded px-2 py-1.5 text-sm font-mono"/>
          </Field>
          <Field label="max len">
            <input type="number" value={maxModelLen}
              onChange={(e) => setMaxModelLen(e.target.value)}
              className="w-full bg-ink-850 border border-line rounded px-2 py-1.5 text-sm font-mono"/>
          </Field>
        </div>

        <div className="rounded-lg border border-line bg-ink-900/40 p-3 space-y-2">
          <label className="flex items-center gap-2 text-sm select-none cursor-pointer">
            <input
              type="checkbox"
              checked={!!showAdv}
              onChange={(e) => setShowAdv(e.target.checked)}
              className="accent-volt"
            />
            <span className="text-fog-100">세부 argument 정의</span>
            <span className="ml-auto text-[10px] font-mono text-fog-500">
              {showAdv
                ? `${argSchema.length} field${argSchema.length === 1 ? "" : "s"} 표시중`
                : `${argSchema.length} available`}
            </span>
          </label>
          {showAdv && (
            <div className="text-[10px] text-fog-500 font-mono leading-snug pl-6">
              우측 패널의 두번째 column에 engine={engine} · bench_data={benchData || "—"}
              전용 advanced arguments가 표시됩니다.
            </div>
          )}
        </div>

        <label className="flex items-center gap-2 text-sm select-none cursor-pointer">
          <input type="checkbox" checked={dryRun} onChange={(e) => setDryRun(e.target.checked)} className="accent-volt"/>
          <span className="text-fog-200">dry-run</span>
        </label>

        {error && <div className="text-xs text-err border border-err/40 bg-err/5 px-3 py-2 rounded font-mono">{error}</div>}

        <button onClick={submit} disabled={busy || !prefill.length || !decode.length || !model.trim() || !modelPath.trim()}
          className={"btn w-full py-2.5 rounded-md font-semibold tracking-tight " +
            (busy || !prefill.length || !decode.length || !model.trim() || !modelPath.trim()
              ? "bg-ink-700 text-fog-400 cursor-not-allowed"
              : "bg-volt text-ink-950 hover:bg-voltlo shadow-voltglow")}>
          {busy ? "starting…" : "▸ run pd"}
        </button>
      </div>
    );
  }

  // Memoize vLLM/PD config panels so that polling-driven re-renders in App
  // don't reset the host textarea's IME composition (Korean input bug).
  // Re-render when historyPanel changes so run history/status stays fresh.
  const VllmBenchConfigStable = React.memo(
    VllmBenchConfig,
    (prev, next) =>
      prev.busy === next.busy &&
      prev.args === next.args &&
      prev.historyPanel === next.historyPanel
  );

  const PdConfigStable = React.memo(
    PdConfig,
    (prev, next) =>
      prev.busy === next.busy &&
      prev.args === next.args &&
      prev.showAdv === next.showAdv
  );

  // =========================================================================
  // v3.5 — Sidebar nav, Cluster management tab, merged llm-d Inference tab
  // =========================================================================
