          <span className="text-[10px] font-mono text-fog-500">
            {rows.length} host{rows.length !== 1 ? "s" : ""}
          </span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-ink-900/60">
              <tr className="text-left text-[10px] uppercase tracking-wider text-fog-500 font-mono">
                <th className="px-3 py-2">host</th>
                <th className="px-3 py-2">status</th>
                <th className="px-3 py-2">exit</th>
                <th className="px-3 py-2">duration</th>
                <th className="px-3 py-2">parsed metrics</th>
                <th className="px-3 py-2">log path</th>
                <th className="px-3 py-2">action</th>
              </tr>
            </thead>
            <tbody>
              {rows.length === 0 && (
                <tr>
                  <td colSpan="7" className="px-3 py-4 text-fog-500 font-mono italic">
                    no result yet
                  </td>
                </tr>
              )}
              {rows.map((r) => {
                const m = r.metrics || {};
                const entries = metricEntries(m);
                const validationEntries = summaryEntries(r);
                const displayEntries = [...entries, ...validationEntries];
                const ui = r.ui_status;
                const actualStatus = r.status || r.summary?.status || ui || "unknown";
                const errorMessages = normalizeErrorMessages(r);
                const showErrorsOnly = isErrorStatus(actualStatus) && errorMessages.length > 0;
                const tone =
                  actualStatus === "success" ? "text-ok"   :
                  actualStatus === "running" ? "text-volt" :
                  actualStatus === "pending" ? "text-volt" :
                  actualStatus === "analyzing" ? "text-volt" :
                  actualStatus === "stopped" ? "text-warn" :
                  actualStatus === "partial" ? "text-warn" :
                  actualStatus === "ready"   ? "text-ok"   :
                  "text-err";

                return (
                  <tr key={r.host} className="border-t border-line hover:bg-ink-700/30 align-top">
                    <td className="px-3 py-2 font-mono text-fog-100 whitespace-nowrap">
                      <span className="dot mr-2" style={{ background: colorForHost(r.host) }}></span>
                      {r.host}
                    </td>
                    <td className="px-3 py-2 whitespace-nowrap">
                      <span className={"text-[10px] uppercase font-mono tracking-wider " + tone}>
                        {actualStatus}
                      </span>
                    </td>
                    <td className="px-3 py-2 font-mono text-fog-300 whitespace-nowrap">{r.exit_code ?? "—"}</td>
                    <td className="px-3 py-2 font-mono text-fog-300 num whitespace-nowrap">
                      {fmtDur(r.duration_sec)}
                    </td>
                    <td className="px-3 py-2 min-w-[360px]">
                      {showErrorsOnly ? (
                        <div className="space-y-1">
                          {errorMessages.map((msg, idx) => (
                            <div key={idx} className="font-mono text-[11px] text-err whitespace-pre-wrap break-words">
                              {msg}
                            </div>
                          ))}
                        </div>
                      ) : displayEntries.length === 0 ? (
                        <span className="font-mono text-fog-500 italic">
                          {ui === "analyzing" ? "waiting for result log…" : "no metric parsed"}
                        </span>
                      ) : (
                        <div className="flex flex-wrap gap-1.5">
                          {displayEntries.map((kv) => (
                            <span key={kv.key} className="inline-flex items-center gap-1 rounded border border-line bg-ink-700/70 px-2 py-1 font-mono text-[11px]">
                              <span className="text-fog-400">{kv.key}</span>
                              <span className="text-fog-100 num">{fmtMetricValue(kv.value)}</span>
                            </span>
                          ))}
                        </div>
                      )}
                    </td>
                    <td className="px-3 py-2 font-mono text-[11px] text-fog-400 whitespace-nowrap">
                      {r.log_dir ? (
                        <button
                          type="button"
                          onClick={() => copyPath(r.log_dir)}
                          title={r.log_dir}
                          className="btn px-2 py-1 rounded bg-ink-700 hover:bg-ink-600 border border-line text-fog-200 font-mono text-[10px]"
                        >
                          copy path
                        </button>
                      ) : (
                        <span className="text-fog-600">—</span>
                      )}
                    </td>
                    <td className="px-3 py-2 whitespace-nowrap">
                      {entries.length > 0 && pinToDashboard && String(actualStatus || "").toLowerCase() === "success" ? (
                        <button
                          type="button"
                          onClick={() => pinToDashboard(r)}
                          title="이 host의 결과를 0번 대시보드 탭에 반영합니다"
                          className="btn px-2 py-1 rounded border border-volt/40 bg-volt/10 hover:bg-volt/20 text-volt font-mono text-[10px] uppercase tracking-wider"
                        >
                          ▴ 대시보드 반영
                        </button>
                      ) : (
                        <span className="text-fog-600">—</span>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // ---------------------- coming soon (legacy) ----------------------

  function ComingSoonTab({ title, blurb }) {
    return (
      <div className="rounded-xl border border-line bg-ink-850/40 p-12 text-center shadow-panel">
        <div className="font-mono text-[11px] tracking-[0.18em] uppercase text-volt mb-2">
          coming soon
        </div>
        <div className="text-2xl font-medium tracking-tight mb-2">{title}</div>
        <div className="text-fog-400 max-w-xl mx-auto">{blurb}</div>
      </div>
    );
  }

  // ===========================================================================
  // 0. Dashboard v2 — flat-array pin store
  // ===========================================================================
  // Each pin captures one (run_id, host) tuple's full record:
  //   {
  //     id,                                       // unique
  //     kind: "mlperf"|"vllm_bench"|"pd_bench",
  //     gpu_type, model, host, run_id,
  //     dims:    { suite, version, engine, bench_data, max_concurrency, tp, ... },
  //     metrics: { tokens_per_sec, ttft_ms, eval_accuracy, ... },
  //     pinned_at,
  //   }
  //
  // Stored under localStorage["mlperf_platform_dashboard_v2"] as an array.
  // The old v1 dict is silently discarded (different schema).

  const DASHBOARD_KEY = "mlperf_platform_dashboard_v2";

  const loadDashboard = () => {
    try {
      const raw = window.localStorage.getItem(DASHBOARD_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr.map(normalizeDashboardPinRecord).filter(Boolean) : [];
    } catch (_) {
      return [];
    }
  };
  const saveDashboard = (arr) => {
    try { window.localStorage.setItem(DASHBOARD_KEY, JSON.stringify(arr || [])); } catch (_) {}
  };
  function safeDashboardIdPart(value) {
    return String(value || "")
      .trim()
      .replace(/[^A-Za-z0-9_.-]+/g, "_")
      .replace(/^_+|_+$/g, "") || "unknown";
  }
  function dashboardPinSemanticKey(item) {
    if (!item || typeof item !== "object") return "";
    const rid = String(item.run_id || "").trim();
    if (rid) {
      const host = String(item.host || item.dims?.host || item.log_host || "all").trim() || "all";
      return `run:${rid}::host:${host}`;
    }
    const id = String(item.id || "").trim();
    return id ? `id:${id}` : "";
  }
  function stableDashboardPinId(item) {
    const rid = String(item?.run_id || "").trim();
    if (!rid) return String(item?.id || "").trim();
    const host = String(item?.host || item?.dims?.host || item?.log_host || "all").trim() || "all";
    return `pin_${safeDashboardIdPart(rid)}_${safeDashboardIdPart(host)}`;
  }
  function mergeDashboardPins(...lists) {
    const byKey = new Map();
    (lists || []).forEach((list) => {
      (Array.isArray(list) ? list : []).forEach((raw) => {
        const item = normalizeDashboardPinRecord(raw);
        if (!item) return;
        const key = dashboardPinSemanticKey(item);
        if (!key) return;
        const prev = byKey.get(key) || {};
        const merged = { ...prev, ...item };
        const stableId = stableDashboardPinId(merged);
        if (stableId) merged.id = stableId;
        byKey.set(key, merged);
      });
    });
    return Array.from(byKey.values());
  }

  // Dashboard chart palette — aligned with the dark neon UI token set.
  const DASHBOARD_CHART_COLORS = [
    "#03DAC6", "#BB86FC", "#F2557D", "#FFB74D", "#60A5FA",
    "#4ADE80", "#7C4DFF", "#F97316", "#EC4899", "#FACC15",
  ];
  const GPU_BASE_COLORS = {
    H100: "#03DAC6",
    A100: "#BB86FC",
    V100: "#60A5FA",
    GH200: "#4ADE80",
    B300: "#F2557D",
    RTX6000: "#FFB74D",
    RTX_PRO_6000: "#7C4DFF",
    MI300X: "#F97316",
  };
  function _hashIndex(s, mod) {
    let h = 0;
    const str = String(s || "");
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return Math.abs(h) % Math.max(1, mod || 1);
  }
  function colorForGpuGroup(gpu, groupIdx, groupCount) {
    const base = GPU_BASE_COLORS[gpu] || DASHBOARD_CHART_COLORS[_hashIndex(gpu, DASHBOARD_CHART_COLORS.length)];
    if (!groupCount || groupCount <= 1) return base;
    const start = Math.max(0, DASHBOARD_CHART_COLORS.indexOf(base));
    return DASHBOARD_CHART_COLORS[(start + Math.max(0, groupIdx || 0)) % DASHBOARD_CHART_COLORS.length];
  }
  function colorForGpu(gpu) {
    return colorForGpuGroup(gpu, 0, 1);
  }

  // Flatten a result-table row's metrics dict into { key: number } pairs.
  function flattenMetrics(metrics) {
    const out = {};
    if (!metrics) return out;
    const md = metrics.metric_display || metrics.metric_values;
    if (Array.isArray(md)) {
      md.forEach((kv) => {
        const v = kv.value;
        if (typeof v === "number" && !Number.isNaN(v)) out[kv.key] = v;
      });
    } else if (md && typeof md === "object") {
      Object.entries(md).forEach(([k, v]) => {
        if (typeof v === "number" && !Number.isNaN(v)) out[k] = v;
      });
    }
    Object.entries(metrics).forEach(([k, v]) => {
      if (typeof v === "number" && !Number.isNaN(v) && !(k in out)) out[k] = v;
    });
    return out;
  }

  // =========================================================================
  // 0. Dashboard tab v2 — flat-array pin store, drag-and-drop axes,
  //    chart-type switcher (bar/scatter/line), filter selects, groups,
  //    GPU+group color scheme, HTML report download.
  // =========================================================================

  // Pretty label for kind (mlperf/vllm_bench/pd_bench).
  function _kindLbl(k) {
    if (k === "training") return "Training 테스트";
    if (k === "inference") return "Inference 테스트";
    if (k === "mlperf" || k === "mlperf_k8s") return "MLPerf Training";
    if (k === "mlperf_inference") return "MLPerf Inference";
    if (k === "llmd_bench") return "Inference 테스트";
    if (k === "vllm_bench") return "vLLM Bench";
    if (k === "pd_bench") return "PD 분산 추론";
    return k;
  }

  function runKindLabel(run) {
    const k = run?.kind || "mlperf";
    const suite = run?.suite || "";
    if (k === "mlperf_k8s" || (k === "mlperf" && suite === "training")) return "Training - MLPerf";
    if (k === "mlperf" && suite === "inference") return "Inference - MLPerf";
    if (k === "mlperf_inference") return "Inference - MLPerf";
    if (k === "vllm_bench") return "Inference - vLLM";
    if (k === "pd_bench") return "Inference - PD";
    if (k === "llmd_bench") return "Inference - LLM-D";
    return _kindLbl(k);
  }

  function runKindChipClass(run) {
    const k = run?.kind || "mlperf";
    const suite = run?.suite || "";
    if (k === "mlperf_k8s" || (k === "mlperf" && suite === "training")) return "kind-training";
    if ((k === "mlperf" && suite === "inference") || k === "mlperf_inference") return "kind-infer-mlperf";
    if (k === "vllm_bench") return "kind-vllm";
    if (k === "pd_bench") return "kind-pd";
    if (k === "llmd_bench") return "kind-llmd";
    return "kind-default";
  }

  function runSettingsLabel(run) {
    const k = run?.kind || "mlperf";
    const suite = run?.suite || "";
    const p = run?.params || {};
    const env = normalizeDashboardEnv(p.runtime_env || (k === "mlperf_k8s" ? "k8s" : "bare"));
    const envLabel = dashValueLabel("env", env || "bare");
    const version = run?.version || "—";
    const model = run?.benchmark || p.model || "—";
    if (k === "vllm_bench" || k === "pd_bench" || k === "llmd_bench") {
      const mode = normalizeDashboardMode(p.mode || "", k);
      return `${model} · ${envLabel}${mode ? " · " + dashValueLabel("mode", mode) : ""}`;
    }
    return `${version} · ${model} · ${envLabel}`;
  }

  function normalizeRunErrorMessages(run, results) {
    const items = [];
    const push = (v) => {
      if (v == null) return;
      const text = String(v).trim();
      if (text) items.push(text);
    };
    const rows = Array.isArray(results?.rows) ? results.rows : [];
    rows.forEach((row) => {
      if (Array.isArray(row?.error_messages)) row.error_messages.forEach(push);
      push(row?.result_error);
      if (String(row?.status || row?.ui_status || "").toLowerCase() === "failed") {
        push(row?.summary?.error || row?.metrics?.error || row?.metrics?.message);
      }
    });
    Object.values(run?.host_states || {}).forEach((hs) => {
      push(hs?.result_error);
      push(hs?.phase && String(hs.phase).toLowerCase().includes("error") ? hs.phase : "");
    });
    const logs = Array.from(run?.log_buffer || []);
    logs.slice(-200).forEach((l) => {
      const line = String(l?.line || "").trim();
      const level = String(l?.level || "").toLowerCase();
      if (level === "error" || level === "fatal" || /^\[(ERROR|FATAL)\]/i.test(line)) push(line);
    });
    return Array.from(new Set(items)).slice(0, 8);
  }

  function runFailed(run) {
    return ["failed", "error", "partial"].includes(String(run?.status || "").toLowerCase());
  }

  function ErrorMessageBox({ messages, compact = false }) {
    const clean = Array.from(new Set((messages || []).map((m) => String(m || "").trim()).filter(Boolean)));
    if (!clean.length) return <div className="mini-history-empty">error 메시지를 찾지 못했습니다. 로그 확인 구역을 확인해주세요.</div>;
    return (
      <div className={"run-error-box " + (compact ? "compact" : "") }>
        <div className="run-error-title">error message</div>
        <div className="run-error-lines">
          {clean.map((msg, idx) => <div key={idx} className="run-error-line">{msg}</div>)}
        </div>
      </div>
    );
  }

  function _dashCategoryOfKind(k) {
    if (k === "mlperf_k8s") return "training";
    if (k === "mlperf_inference" || k === "llmd_bench" || k === "vllm_bench" || k === "pd_bench") return "inference";
    if (k === "mlperf") return "training";
    return "inference";
  }

  function dashboardPinCategory(p) {
    const suite = String(p?.suite || p?.dims?.suite || p?.params?.suite || "").toLowerCase();
    if (suite === "training") return "training";
    if (suite === "inference") return "inference";
    const k = String(p?.kind || p?.dims?.kind || "");
    const model = String(p?.model || p?.benchmark || p?.dims?.model || "").toLowerCase();
    // Legacy pins from early v6.x sometimes stored MLPerf Inference as kind="mlperf"
    // without suite. The inference model name has no LoRA suffix, so keep those visible
    // under Inference 테스트 instead of losing them under Training filters.
    if (k === "mlperf" && model.includes("llama2_70b") && !model.includes("lora")) return "inference";
    return _dashCategoryOfKind(k);
  }

  function dashboardTestKindOfPin(p) {
    const k = String(p?.kind || p?.dims?.kind || "");
    const explicit = String(p?.test_kind || p?.dims?.test_kind || "").toLowerCase();
    if (explicit === "mlperf" || explicit === "vllm") return explicit;
    const cat = dashboardPinCategory(p);
    if (cat === "training") return "mlperf";
    if (k === "mlperf_inference" || k === "mlperf") return "mlperf";
    if (k === "vllm_bench" || k === "pd_bench" || k === "llmd_bench") return "vllm";
    return "vllm";
  }

  function dashboardTestKindLabel(category, value) {
    if (category === "training") return "MLPerf";
    if (value === "mlperf") return "MLPerf";
    if (value === "vllm") return "vLLM";
    return value || "—";
  }

  function dashboardScopeLabel(category, testKind) {
    const cat = category === "training" ? "Training" : "Inference";
    return `${cat} - ${dashboardTestKindLabel(category, testKind)}`;
  }

  const DASHBOARD_TEST_CATALOG = {
    training: {
      mlperf: {
        versions: ["v4.1", "v5.1"],
        modelsByVersion: {
          "v4.1": ["llama2_70b_lora"],
          "v5.1": ["llama2_70b_lora", "llama31_8b"],
        },
        envs: ["bare", "k8s"],
        modes: [],
      },
    },
    inference: {
      mlperf: {
        versions: ["v5.1", "v6.0"],
        modelsByVersion: {
          "v5.1": ["llama2_70b"],
          "v6.0": ["llama2_70b"],
        },
        envs: ["bare", "k8s"],
        modes: [],
      },
      vllm: {
        versions: [],
        models: ["Qwen3-32B"],
        envs: ["bare", "k8s"],
        modes: ["single", "pd"],
      },
    },
  };

  const uniqueSorted = (items) => Array.from(new Set((items || []).filter((v) => v !== undefined && v !== null && String(v).trim() !== "").map(String))).sort();

  const catalogForDashboard = (category, testKind) => (DASHBOARD_TEST_CATALOG?.[category]?.[testKind]) || {};

  function normalizeDashboardEnv(v) {
    const s = String(v || "").trim();
    const low = s.toLowerCase();
    if (!s) return "";
    if (low === "bare" || low.includes("bare metal")) return "bare";
    if (low === "k8s" || low.includes("kubernetes")) return "k8s";
    return s;
  }

  function normalizeDashboardMode(v, kind) {
    const s = String(v || "").trim();
    const low = s.toLowerCase();
    if (kind === "pd_bench") return "pd";
    if (!s) return "";
    if (low === "pd" || low.includes("pd") || low.includes("disaggregation")) return "pd";
    if (low === "single" || low.includes("single")) return "single";
    if (low === "serve") return "single";
    return s;
  }

  function dashboardModelCatalog(category, testKind, version) {
    const cat = catalogForDashboard(category, testKind);
    if (cat.modelsByVersion) {
      if (version && version !== "__all__") return cat.modelsByVersion[version] || [];
      return uniqueSorted(Object.values(cat.modelsByVersion).flat());
    }
    return cat.models || [];
  }

  function dashboardPinVersion(p) {
    const raw = String(p?.version || p?.dims?.version || p?.metadata?.version || "").trim();
    if (!raw) return "";
    return /^\d/.test(raw) ? `v${raw}` : raw;
  }

  function dashboardPinEnv(p) {
    const explicit = normalizeDashboardEnv(p?.env || p?.runtime_env || p?.dims?.env || p?.dims?.runtime_env || "");
    if (explicit) return explicit;
    // Older pinned records did not store runtime_env. All pre-v6.18 history was
    // produced from Bare Metal runs, so keep those records visible under Bare Metal.
    const k = String(p?.kind || p?.dims?.kind || "");
    if (k === "mlperf_k8s") return "k8s";
    return "bare";
  }

  function dashboardPinMode(p) {
    const k = String(p?.kind || p?.dims?.kind || "");
    const explicit = normalizeDashboardMode(p?.mode || p?.dims?.mode || "", k);
    if (explicit) return explicit;
    if (k === "pd_bench") return "pd";
    if (k === "vllm_bench" || k === "llmd_bench") return "single";
    return "";
  }

  function normalizeDashboardPinRecord(p) {
    if (!p || typeof p !== "object") return null;
    const kind = String(p.kind || p.dims?.kind || "mlperf");
    const category = dashboardPinCategory(p);
    const testKind = dashboardTestKindOfPin(p);
    const suite = p.suite || p.dims?.suite || (category === "training" ? "training" : "inference");
    const version = dashboardPinVersion(p);
    const env = dashboardPinEnv(p);
    const mode = dashboardPinMode(p);
    const model = String(p.model || p.dims?.model || p.benchmark || "").trim();
    return {
      ...p,
      kind,
      suite,
      test_kind: testKind,
      version,
      env,
      mode,
      model: model || p.model || "—",
      dims: {
        ...(p.dims || {}),
        suite,
        test_kind: testKind,
        ...(version ? { version } : {}),
        ...(env ? { env } : {}),
        ...(mode ? { mode } : {}),
      },
    };
  }

  function dashValueLabel(kind, v) {
    const s = String(v || "").trim();
    if (!s) return "Unknown";
    if (kind === "env") {
      if (s === "bare") return "Bare Metal";
      if (s === "k8s") return "K8s";
    }
    if (kind === "mode") {
      if (s === "single") return "Single Instance";
      if (s === "pd") return "PD Disaggregation";
    }
    return s;
  }

  // Tiny SVG icons for the chart-type chips.
  function ChartIcon({ kind, className = "" }) {
    if (kind === "bar") {
      return (
        <svg viewBox="0 0 16 16" className={className} fill="currentColor">
          <rect x="2"  y="8"  width="2.5" height="6" />
          <rect x="6"  y="4"  width="2.5" height="10" />
          <rect x="10" y="6"  width="2.5" height="8" />
        </svg>
      );
    }
    if (kind === "scatter") {
      return (
        <svg viewBox="0 0 16 16" className={className} fill="currentColor">
          <circle cx="3"  cy="12" r="1.4" />
          <circle cx="6"  cy="6"  r="1.4" />
          <circle cx="9"  cy="9"  r="1.4" />
          <circle cx="12" cy="4"  r="1.4" />
          <circle cx="13" cy="11" r="1.4" />
        </svg>
      );
    }
    if (kind === "line") {
      return (
        <svg viewBox="0 0 16 16" className={className} fill="none"
             stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"
             strokeLinejoin="round">
          <path d="M2 12 L5 7 L8 9 L11 4 L14 7" />
        </svg>
      );
    }
    return null;
  }

  // Compact label for any field key. UI labels use sentence case: first letter upper, rest lower.
  function fieldLabel(k) {
    if (!k) return "";
    const explicit = {
      gpu_type: "Gpu type",
      version: "Version",
      model: "Model",
      env: "Environment",
      mode: "Mode",
      MAX_STEPS: "Max steps",
      GLOBAL_BATCH_SIZE: "Global batch size",
      MBS: "Micro batch size",
      precision: "Precision",
      fp8_hybrid: "FP8 hybrid",
      SAMPLES_COUNT: "Samples count",
      EVAL_SAMPLES: "Eval samples",
      TENSOR_PARALLEL: "Tensor parallel",
      PIPELINE_PARALLEL: "Pipeline parallel",
      CONTEXT_PARALLEL: "Context parallel",
      train_loss: "Train loss",
      train_step_time: "Train step time",
      eval_accuracy: "Validation accuracy",
      validation_time: "Validation time",
      duration_sec: "Duration sec",
    };
    if (explicit[k]) return explicit[k];
    const text = String(k).replace(/_/g, " ").toLowerCase();
    return text ? text.charAt(0).toUpperCase() + text.slice(1) : "";
  }

  // -------- field-tray draggable card --------
  function FieldCard({ fieldKey, kind /* "metric" | "dim" */, onDragStart }) {
    const tone =
      kind === "metric"
        ? "bg-volt/10 border-volt/30 text-volt"
        : "bg-sky-400/10 border-sky-400/30 text-sky-300";
    return (
      <div
        draggable
        onDragStart={(e) => {
          e.dataTransfer.setData("text/x-field-key", fieldKey);
          e.dataTransfer.setData("text/x-field-kind", kind);
          e.dataTransfer.setData("text/plain", `${kind}:${fieldKey}`);
          e.dataTransfer.effectAllowed = "copyMove";
          if (onDragStart) onDragStart(fieldKey, kind);
        }}
        className={
          "group inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md " +
          "border text-[11px] font-mono cursor-grab active:cursor-grabbing select-none " +
          tone
        }
        title={fieldKey}
      >
        <svg viewBox="0 0 12 12" className="w-2.5 h-2.5 opacity-60" fill="currentColor">
          <circle cx="3" cy="3" r="1" /><circle cx="9" cy="3" r="1" />
          <circle cx="3" cy="6" r="1" /><circle cx="9" cy="6" r="1" />
          <circle cx="3" cy="9" r="1" /><circle cx="9" cy="9" r="1" />
        </svg>
        <span>{fieldLabel(fieldKey)}</span>
      </div>
    );
  }

  // -------- drop-zone wrapper --------
  function DropZone({ accept, value, onDrop, onClear, label, hint, locked }) {
    const [over, setOver] = useState(false);
    const filled = !!value;
    return (
      <div
        onDragOver={(e) => {
          if (locked) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "copy";
          setOver(true);
        }}
        onDragLeave={() => setOver(false)}
        onDrop={(e) => {
          if (locked) return;
          e.preventDefault();
          setOver(false);
          let k = e.dataTransfer.getData("text/x-field-key");
          let kk = e.dataTransfer.getData("text/x-field-kind");
          if (!k) {
            const plain = e.dataTransfer.getData("text/plain") || "";
            const m = plain.match(/^(metric|dim):(.+)$/);
            if (m) { kk = m[1]; k = m[2]; }
          }
          if (!k) return;
          if (accept && !accept(k, kk)) return;
          onDrop(k, kk);
        }}
        className={
          "dash-drop-zone rounded-lg border px-3 py-2 min-h-[58px] flex flex-col gap-1 " +
          (locked
            ? "border-line/60 bg-ink-900/40 opacity-80"
            : over
              ? "border-volt/60 bg-volt/5"
              : filled
                ? "border-line bg-ink-850/60"
                : "border-dashed border-line/70 bg-ink-900/40")
        }
      >
        <div className="flex items-center justify-between">
          <span className="text-[10px] font-mono uppercase tracking-[0.16em] text-fog-500">
            {label}
          </span>
          {filled && !locked && (
            <button
              onClick={onClear}
              className="btn text-[10px] font-mono text-fog-500 hover:text-err"
              title="clear"
            >
              ×
            </button>
          )}
        </div>
        {filled ? (
          <span className="text-sm font-mono text-fog-100 truncate">
            {fieldLabel(value)}
          </span>
        ) : (
          <span className="text-[11px] font-mono italic text-fog-600">
            {locked ? "locked" : (hint || "drop a field")}
          </span>
        )}
      </div>
    );
  }

  // Tooltip rendered for any chart point. Shows full dims + metrics.
  function PointTooltip({ active, payload, preferredId }) {
    if (!active || !payload || !payload.length) return null;
    const chosen = preferredId ? payload.find((p) => String(p?.payload?.id || "") === String(preferredId)) : null;
    const d = (chosen || payload[0]).payload;
    if (!d) return null;
    return (
      <div className="rounded-md border border-line bg-ink-900/95 px-3 py-2 text-[11px] font-mono shadow-panel">
        <div className="text-volt mb-1">
          {d.gpu_type} · {d.model || "—"}
        </div>
        {d._x != null && (
          <div>x · {fieldLabel(d._xKey)} = <span className="text-fog-100">{_fmt(d._x)}</span></div>
        )}
        {d._y != null && (
          <div>y · {fieldLabel(d._yKey)} = <span className="text-fog-100">{_fmt(d._y)}</span></div>
        )}
        {d._groupKey && (
          <div className="mt-1 pt-1 border-t border-line/60">
            <span className="text-fog-500">group · </span>
            <span className="text-fog-200">{d._groupKey}</span>
          </div>
        )}
        {d.run_id && (
          <div className="mt-1 text-fog-500">run · {d.run_id} @ {d.host}</div>
        )}
      </div>
    );
  }
  function _fmt(v) {
    if (typeof v === "number") {
      const a = Math.abs(v);
      if (!Number.isFinite(v)) return String(v);
      if (a >= 1000)        return v.toFixed(1);
      if (a >= 1)           return v.toFixed(3);
      if (a > 0)            return v.toFixed(5);
      return "0";
    }
    return String(v);
  }

  function _trimNumberLabel(v, digits = 3) {
    if (typeof v !== "number" || !Number.isFinite(v)) return String(v);
    if (Number.isInteger(v)) return String(v);
    return v.toFixed(digits).replace(/\.?0+$/, "");
  }

  function _fmtAxis(v) {
    if (typeof v !== "number" || !Number.isFinite(v)) return String(v);
    if (Number.isInteger(v)) return String(v);
    const a = Math.abs(v);
    if (a >= 1000) return _trimNumberLabel(v, 0);
    if (a >= 100)  return _trimNumberLabel(v, 1);
    if (a >= 1)    return _trimNumberLabel(v, 3);
    if (a >= 0.01) return _trimNumberLabel(v, 4);
    if (a > 0)     return v.toExponential(2);
    return "0";
  }

  function asFiniteNumber(v) {
    if (typeof v === "number" && Number.isFinite(v)) return v;
    if (typeof v === "string" && v.trim() !== "") {
      const n = Number(v.trim());
      if (Number.isFinite(n)) return n;
    }
    return null;
  }

  function addDashboardHyperparameter(out, key, value) {
    if (!out || !key) return;
    if (value === undefined || value === null) return;
    const text = String(value).trim();
    if (!text) return;
    out[String(key)] = text;
  }

  function addDashboardHyperparameterObject(out, obj, prefix = "") {
    if (!obj || typeof obj !== "object") return;
    Object.entries(obj).forEach(([k, v]) => {
      const key = prefix ? `${prefix}.${k}` : k;
      if (v && typeof v === "object" && !Array.isArray(v)) {
        addDashboardHyperparameterObject(out, v, key);
      } else {
        addDashboardHyperparameter(out, key, Array.isArray(v) ? v.join(",") : v);
      }
    });
  }

  function dashboardHyperparameterEntries(pin) {
    const hp = pin?.hyperparameters && typeof pin.hyperparameters === "object" ? pin.hyperparameters : null;
    const out = {};
    if (hp) addDashboardHyperparameterObject(out, hp);
    if (!Object.keys(out).length) {
      // Backward-compatible fallback for pins created before hyperparameter snapshots were stored.
      addDashboardHyperparameter(out, "version", pin?.version || pin?.dims?.version);
      addDashboardHyperparameter(out, "model", pin?.model || pin?.dims?.model);
      addDashboardHyperparameter(out, "env", dashValueLabel("env", dashboardPinEnv(pin)));
      addDashboardHyperparameter(out, "mode", dashValueLabel("mode", dashboardPinMode(pin)));
      [
        "MAX_STEPS", "MBS", "GLOBAL_BATCH_SIZE", "TENSOR_PARALLEL", "PIPELINE_PARALLEL", "CONTEXT_PARALLEL",
        "fp8", "fp8_hybrid", "prompt_tokens", "output_tokens", "max_seconds", "tp", "pp",
      ].forEach((k) => addDashboardHyperparameter(out, k, pin?.dims?.[k] ?? pin?.metrics?.[k]));
    }
    return Object.entries(out).sort((a, b) => a[0].localeCompare(b[0]));
  }


  function getPinRunParams(pin) {
    const run = pin?._run && typeof pin._run === "object" ? pin._run : null;
    const p = run?.params || pin?.request_params || pin?.params || {};
    return p && typeof p === "object" ? p : {};
  }

  function getPinHostArgs(pin) {
    const params = getPinRunParams(pin);
    const base = params.args && typeof params.args === "object" ? params.args : {};
    const byHost = params.args_by_host && typeof params.args_by_host === "object" ? params.args_by_host : {};
    const hostSpecific = pin?.host && byHost[pin.host] && typeof byHost[pin.host] === "object" ? byHost[pin.host] : {};
    return { ...base, ...hostSpecific };
  }

  function _cleanSettingValue(v) {
    if (v === undefined || v === null) return "";
    if (typeof v === "boolean") return v ? "True" : "False";
    if (Array.isArray(v)) return v.join(", ");
    if (typeof v === "object") {
      try { return JSON.stringify(v); } catch (_) { return String(v); }
    }
    return String(v);
  }

  function dashboardExperimentSettingEntries(pin) {
    if (!pin) return [];
    const explicit = Array.isArray(pin.experiment_settings) ? pin.experiment_settings : null;
    if (explicit && explicit.length) {
      return explicit
        .map((r) => [r.label || r.key || "", _cleanSettingValue(r.value)])
        .filter(([k, v]) => k && v !== "");
    }

    const entries = [];
    const seen = new Set();
    const add = (label, value) => {
      const key = String(label || "").trim();
      const val = _cleanSettingValue(value).trim();
      if (!key || !val || seen.has(key)) return;
      seen.add(key);
      entries.push([key, val]);
    };
    const firstPresent = (...vals) => vals.find((v) => v !== undefined && v !== null && String(v).trim() !== "");

    const run = pin?._run && typeof pin._run === "object" ? pin._run : {};
    const params = getPinRunParams(pin);
    const args = getPinHostArgs(pin);
    const hp = pin?.hyperparameters && typeof pin.hyperparameters === "object" ? pin.hyperparameters : {};
    const dims = pin?.dims || {};
    const host = pin?.host || (Array.isArray(run?.hosts) ? run.hosts[0] : "");
    const selected = params.selected_gpus_by_host && typeof params.selected_gpus_by_host === "object" ? params.selected_gpus_by_host : {};
    const selectedFromHp = host ? (hp[`CUDA_VISIBLE_DEVICES.${host}`] || hp[`CUDA_VISIBLE_DEVICES · ${host}`]) : "";
    const selectedValue = (host && selected[host]) || selectedFromHp || "";
    const selectedCount = selectedValue ? String(selectedValue).split(",").map((x) => x.trim()).filter(Boolean).length : null;

    add("version", pin.version || dims.version || run.version);
    add("model", pin.model || dims.model || run.benchmark);
    add("환경", dashValueLabel("env", dashboardPinEnv(pin)));
    add("mode", dashValueLabel("mode", dashboardPinMode(pin)));

    const category = dashboardPinCategory(pin);
    const testKind = dashboardTestKindOfPin(pin);

    if (category === "training" && testKind === "mlperf") {
      const nodeMode = firstPresent(params.node_mode, args.MLPERF_NODE_MODE, hp.MLPERF_NODE_MODE);
      if (nodeMode) add("node mode", dashValueLabel("mode", nodeMode));
      const mapping = [
        ["NUM_GPUS", [args.NUM_GPUS, hp.NUM_GPUS, params.gpus_per_node, selectedCount]],
        ["TP", [args.TP, args.TENSOR_PARALLEL, hp.TP, hp.TENSOR_PARALLEL]],
        ["PP", [args.PP, args.PIPELINE_PARALLEL, hp.PP, hp.PIPELINE_PARALLEL]],
        ["CP", [args.CP, args.CONTEXT_PARALLEL, hp.CP, hp.CONTEXT_PARALLEL]],
        ["MBS (Micro Batch Size)", [args.MBS, args.MICRO_BATCH_SIZE, hp.MBS]],
        ["GBS (Global Batch Size)", [args.GBS, args.GLOBAL_BATCH_SIZE, hp.GLOBAL_BATCH_SIZE]],
        ["MAX_SEQLEN", [args.MAX_SEQLEN, hp.MAX_SEQLEN]],
        ["Precision", [dims.precision, trainingPrecisionLabelFromArgs({ ...hp, ...args })]],
        ["FP8_HYBRID", [args.FP8_HYBRID, hp.FP8_HYBRID, dims.fp8_hybrid]],
        ["NCCL_DEBUG", [args.NCCL_DEBUG, hp.NCCL_DEBUG]],
        ["MAX_STEPS", [args.MLPERF_MAX_STEPS, args.MAX_STEPS, hp.MLPERF_MAX_STEPS, hp.MAX_STEPS]],
        ["VAL_CHECK_INTERVAL", [args.MLPERF_VAL_CHECK_INTERVAL, args.VAL_CHECK_INTERVAL, hp.MLPERF_VAL_CHECK_INTERVAL]],
        ["LIMIT_VAL_BATCHES", [args.MLPERF_LIMIT_VAL_BATCHES, args.LIMIT_VAL_BATCHES, hp.MLPERF_LIMIT_VAL_BATCHES]],
      ];
      mapping.forEach(([label, values]) => add(label, firstPresent(...(values || []))));
      if (host && selectedValue) add(`CUDA_VISIBLE_DEVICES · ${host}${selectedCount ? ` · ${selectedCount} GPU` : ""}`, selectedValue);

      const consumed = new Set([
        "NUM_GPUS", "TP", "TENSOR_PARALLEL", "PP", "PIPELINE_PARALLEL", "CP", "CONTEXT_PARALLEL",
        "MBS", "MICRO_BATCH_SIZE", "MINIBS", "GBS", "GLOBAL_BATCH_SIZE", "MAX_SEQLEN",
        "FP8", "FP8_HYBRID", "TRAINER_PRECISION", "MLPERF_TRAINER_PRECISION", "NCCL_DEBUG",
        "MLPERF_MAX_STEPS", "MAX_STEPS", "MLPERF_VAL_CHECK_INTERVAL", "VAL_CHECK_INTERVAL", "MLPERF_LIMIT_VAL_BATCHES", "LIMIT_VAL_BATCHES",
        "MLPERF_NODE_MODE", "MLPERF_TRAIN_NNODES", "MLPERF_NODE_RANK", "MLPERF_WORLD_SIZE", "WORLD_SIZE_GPUS",
        "MASTER_ADDR", "MASTER_PORT", "MLPERF_CUDA_VISIBLE_DEVICES",
      ]);
      const extra = Object.entries(args)
        .filter(([k, v]) => !consumed.has(k) && v !== undefined && v !== null && String(v).trim() !== "")
        .map(([k, v]) => `${k}=${_cleanSettingValue(v)}`);
      if (extra.length) add("extra env", extra.join("\n"));
    } else {
      add("host", host);
      add("runtime", testKind === "mlperf" ? "MLPerf" : "vLLM");
      Object.entries(args).forEach(([k, v]) => add(k, v));
      ["gpu_count", "gpus_per_node", "model_path", "mode", "engine", "profile", "bench_data", "prompt_tokens", "output_tokens", "max_seconds", "tp", "pp", "prefill_tp", "decode_tp", "prefill_num_instances", "decode_num_instances"].forEach((k) => add(k, params[k]));
      if (host && selectedValue) add(`CUDA_VISIBLE_DEVICES · ${host}${selectedCount ? ` · ${selectedCount} GPU` : ""}`, selectedValue);
    }

    if (entries.length <= 4) {
      // Legacy pins created before request_params were stored: show only known UI-level fields, without dumping every derived metric/dim.
      [
        ["NUM_GPUS", hp.NUM_GPUS], ["TP", hp.TP || hp.TENSOR_PARALLEL], ["PP", hp.PP || hp.PIPELINE_PARALLEL], ["CP", hp.CP || hp.CONTEXT_PARALLEL],
        ["MBS (Micro Batch Size)", hp.MBS], ["GBS (Global Batch Size)", hp.GLOBAL_BATCH_SIZE || hp.GBS], ["MAX_SEQLEN", hp.MAX_SEQLEN],
        ["FP8", hp.FP8 || hp.fp8], ["NCCL_DEBUG", hp.NCCL_DEBUG], ["MAX_STEPS", hp.MLPERF_MAX_STEPS || hp.MAX_STEPS],
        ["VAL_CHECK_INTERVAL", hp.MLPERF_VAL_CHECK_INTERVAL], ["LIMIT_VAL_BATCHES", hp.MLPERF_LIMIT_VAL_BATCHES],
      ].forEach(([k, v]) => add(k, v));
      if (host && selectedFromHp) add(`CUDA_VISIBLE_DEVICES · ${host}`, selectedFromHp);
    }
    return entries;
  }

  const DASHBOARD_RESULT_KEY_ALLOW = new Set([
    "train_loss", "train_step_time", "eval_accuracy", "validation_time", "val_loss", "samples_count", "eval_samples", "step",
    "tokens_per_sec", "requests_per_second", "request_throughput", "output_throughput", "total_token_throughput", "input_token_throughput",
    "ttft_ms", "tpot_ms", "latency_ms", "mean_latency_ms", "p50_latency_ms", "p90_latency_ms", "p95_latency_ms", "p99_latency_ms",
    "accuracy", "qps", "duration_sec", "completed", "failed", "throughput", "gpu_util_avg", "power_avg",
  ]);
  const DASHBOARD_SETTING_KEY_BLOCK = new Set([
    "NUM_GPUS", "TP", "PP", "CP", "MBS", "GBS", "GLOBAL_BATCH_SIZE", "TENSOR_PARALLEL", "PIPELINE_PARALLEL", "CONTEXT_PARALLEL",
    "MAX_STEPS", "MLPERF_MAX_STEPS", "VAL_CHECK_INTERVAL", "MLPERF_VAL_CHECK_INTERVAL", "LIMIT_VAL_BATCHES", "MLPERF_LIMIT_VAL_BATCHES",
    "MAX_SEQLEN", "FP8", "FP8_HYBRID", "TRAINER_PRECISION", "MLPERF_TRAINER_PRECISION", "precision", "fp8_hybrid", "NCCL_DEBUG", "LR", "WARMUP_STEPS", "TARGET_LOG_PPL",
    "version", "model", "env", "mode", "gpu_type", "num_gpus", "host", "kind", "suite", "test_kind",
  ]);

  function dashboardResultMetricEntries(pin) {
    if (!pin) return [];
    const raw = { ...(pin.metrics || {}) };
    const order = [
      "train_loss", "train_step_time", "eval_accuracy", "validation_time", "val_loss", "samples_count", "eval_samples", "step",
      "tokens_per_sec", "requests_per_second", "request_throughput", "output_throughput", "total_token_throughput",
      "ttft_ms", "tpot_ms", "latency_ms", "accuracy", "qps", "duration_sec",
    ];
    const seen = new Set();
    const out = [];
    const add = (k, v) => {
      if (!k || seen.has(k)) return;
      if (DASHBOARD_SETTING_KEY_BLOCK.has(k)) return;
      if (!DASHBOARD_RESULT_KEY_ALLOW.has(k) && !isImportantMetricKey(k)) return;
      if (v === undefined || v === null || String(v).trim?.() === "") return;
      seen.add(k);
      out.push([k, typeof v === "number" ? _fmt(v) : String(v)]);
    };
    order.forEach((k) => add(k, raw[k]));
    Object.entries(raw).sort((a, b) => a[0].localeCompare(b[0])).forEach(([k, v]) => add(k, v));
    return out;
  }

  function buildDashboardPinEntryFromRun(run, row) {
    if (!run || !row) throw new Error("run 또는 result row가 없습니다.");
    if (String(run.status || "").toLowerCase() !== "success") {
      throw new Error("대시보드 반영은 run status가 success일 때만 가능합니다.");
    }
    const rowStatus = String(row.status || row.actual_status || row.summary?.status || "").toLowerCase();
    if (rowStatus && !["success", "ok"].includes(rowStatus)) {
      throw new Error("대시보드 반영은 host result status가 success일 때만 가능합니다.");
    }
    const gpu = (run.node_gpu_map && run.node_gpu_map[row.host]) || run.gpu_type;
    if (!gpu || gpu === "MIXED" || gpu === "—") {
      throw new Error("이 host의 GPU type을 식별할 수 없어 대시보드에 반영하지 못했습니다.");
    }
    const rawKind = run.kind || "mlperf";
    const kind = rawKind === "mlperf_k8s"
      ? "mlperf"
      : (rawKind === "mlperf" && run.suite === "inference" ? "mlperf_inference" : rawKind);
    const p = run.params || {};
    const baseEnvArgs = p.args || {};
    const hostEnvArgs = (p.args_by_host && row.host && p.args_by_host[row.host]) || {};
    const envArgs = { ...baseEnvArgs, ...hostEnvArgs };
    const cleanArgKey = (k) => String(k).replace(/^MLPERF_/, "");
    const parsed = flattenMetrics(row.metrics || row);
    const mlperfParsedMetrics = [
      "train_loss", "train_step_time", "eval_accuracy", "validation_time",
    ];
    const mlperfArgMetricMap = {
      MLPERF_MAX_STEPS: "MAX_STEPS", MAX_STEPS: "MAX_STEPS",
      TP: "TENSOR_PARALLEL", TENSOR_MODEL_PARALLEL: "TENSOR_PARALLEL",
      PP: "PIPELINE_PARALLEL", PIPELINE_MODEL_PARALLEL: "PIPELINE_PARALLEL",
      CP: "CONTEXT_PARALLEL", CONTEXT_PARALLEL: "CONTEXT_PARALLEL",
      MBS: "MBS", MICRO_BATCH_SIZE: "MBS",
      GBS: "GLOBAL_BATCH_SIZE", GLOBAL_BATCH_SIZE: "GLOBAL_BATCH_SIZE",
    };
    const flat = {};
    if (kind === "mlperf") {
      Object.entries(mlperfArgMetricMap).forEach(([src, dst]) => {
        const n = asFiniteNumber(envArgs[src]);
        if (n != null && flat[dst] == null) flat[dst] = n;
      });
      mlperfParsedMetrics.forEach((k) => {
        const n = asFiniteNumber(parsed[k]);
        if (n != null) flat[k] = n;
      });
    } else {
      Object.entries(parsed).forEach(([k, v]) => {
        const n = asFiniteNumber(v);
        if (n != null && isImportantMetricKey(k)) flat[k] = n;
      });
    }
    if (Object.keys(flat).length === 0) throw new Error("아직 parsing된 metric이 없습니다.");
    const model = kind === "mlperf" ? (run.benchmark || "—") : (p.model || run.benchmark || "—");
    const runtimeEnv = normalizeDashboardEnv(p.runtime_env || envArgs.runtime_env || (rawKind === "mlperf_k8s" ? "k8s" : "bare"));
    const runMode = normalizeDashboardMode(p.mode || envArgs.mode || "", kind);
    const precisionLabel = kind === "mlperf" ? trainingPrecisionLabelFromArgs(envArgs) : "";
    const dims = kind === "mlperf"
      ? {
          gpu_type: gpu,
          version: run.version || "",
          env: runtimeEnv,
          ...(precisionLabel ? { precision: precisionLabel } : {}),
          ...(envArgs.MBS != null && String(envArgs.MBS) !== "" ? { MBS: String(envArgs.MBS) } : {}),
          ...(envArgs.FP8_HYBRID != null && String(envArgs.FP8_HYBRID) !== "" ? { fp8_hybrid: String(envArgs.FP8_HYBRID) } : {}),
        }
      : {
          kind, gpu_type: gpu, model, version: run.version || "", env: runtimeEnv, engine: p.engine, mode: runMode || p.mode, endpoint_mode: p.endpoint_mode,
          profile: p.profile, bench_data: p.bench_data,
          ...(p.prompt_tokens != null ? { prompt_tokens: String(p.prompt_tokens) } : {}),
          ...(p.output_tokens != null ? { output_tokens: String(p.output_tokens) } : {}),
          ...(p.max_seconds != null ? { max_seconds: String(p.max_seconds) } : {}),
          ...(p.gpu_count != null ? { gpu_count: String(p.gpu_count) } : {}),
          ...(p.deploy_node ? { deploy_node: String(p.deploy_node) } : {}),
          ...(p.nics ? { nics: String(p.nics) } : {}),
          ...(p.num_prompts != null ? { num_prompts: String(p.num_prompts) } : {}),
          ...(p.request_rate != null ? { request_rate: String(p.request_rate) } : {}),
          ...(p.max_model_len != null ? { max_model_len: String(p.max_model_len) } : {}),
          ...(p.tp != null ? { tp: String(p.tp) } : {}),
          ...(p.pp != null ? { pp: String(p.pp) } : {}),
          ...(p.prefill_tp != null ? { prefill_tp: String(p.prefill_tp) } : {}),
          ...(p.decode_tp != null ? { decode_tp: String(p.decode_tp) } : {}),
          ...(p.bmt_host ? { bmt_host: String(p.bmt_host) } : {}),
          ...Object.fromEntries(Object.entries(envArgs).map(([k, v]) => [cleanArgKey(k), v == null ? "" : String(v)])),
        };
    const hyperparameters = {};
    addDashboardHyperparameter(hyperparameters, "version", run.version || "");
    addDashboardHyperparameter(hyperparameters, "model", model);
    addDashboardHyperparameter(hyperparameters, "env", dashValueLabel("env", runtimeEnv));
    addDashboardHyperparameter(hyperparameters, "mode", runMode ? dashValueLabel("mode", runMode) : "");
    addDashboardHyperparameterObject(hyperparameters, envArgs);
    addDashboardHyperparameterObject(hyperparameters, p.guidellm, "guidellm");
    addDashboardHyperparameterObject(hyperparameters, p.vllm, "vllm");
    addDashboardHyperparameterObject(hyperparameters, p.prefill, "prefill");
    addDashboardHyperparameterObject(hyperparameters, p.decode, "decode");
    addDashboardHyperparameterObject(hyperparameters, p.llmd, "llmd");
    addDashboardHyperparameterObject(hyperparameters, p.common_params, "common");
    addDashboardHyperparameterObject(hyperparameters, p.prefill_params, "prefill");
    addDashboardHyperparameterObject(hyperparameters, p.decode_params, "decode");
    if (p.selected_gpus_by_host && row.host) {
      addDashboardHyperparameter(hyperparameters, `CUDA_VISIBLE_DEVICES.${row.host}`, p.selected_gpus_by_host[row.host]);
    }

    Object.keys(dims).forEach((k) => { if (dims[k] === "" || dims[k] == null) delete dims[k]; });
    return normalizeDashboardPinRecord({
      id: `pin_${safeDashboardIdPart(run.run_id)}_${safeDashboardIdPart(row.host || "all")}`,
      kind, suite: run.suite || (kind === "mlperf" ? "training" : "inference"),
      test_kind: kind === "mlperf" || kind === "mlperf_inference" ? "mlperf" : "vllm",
      gpu_type: gpu, model, host: row.host, run_id: run.run_id,
      version: run.version || "", env: runtimeEnv, mode: runMode || p.mode || "",
      log_dir: row.log_dir || row.log_path || row.summary?.log_dir || "",
      request_params: p,
      hyperparameters,
      dims, metrics: flat, pinned_at: Date.now() / 1000,
    });
  }

  // Build self-contained HTML for chart download (chart SVG + data table).
  function buildDashboardReport({ category, model, chartType,
                                  xField, yField, groupFields, filters,
                                  data, gpus, groupKeys, monitorByRun }) {
    const title = `Dashboard · ${_kindLbl(category)}`
                + (model && model !== "__all__" ? ` · ${model}` : "");
    const chartEl = document.querySelector("[data-dashboard-chart] svg");
    const chartSvg = chartEl ? chartEl.outerHTML : "<p>(차트가 렌더링되지 않았습니다)</p>";

    const filterTxt = Object.entries(filters || {})
      .filter(([, v]) => v && v !== "__any__")
      .map(([k, v]) => `${k}=${v}`)
      .join(", ") || "—";

    const allDimKeys = (() => {
      const s = new Set();
      data.forEach((r) => Object.keys(r._dims || {}).forEach((k) => s.add(k)));
      return Array.from(s).sort();
    })();
    const allMetKeys = (() => {
      const s = new Set();
      data.forEach((r) => Object.keys(r._metrics || {}).forEach((k) => s.add(k)));
      return Array.from(s).sort();
    })();

    const escape = (s) => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    const rowsHtml = data.map((r) => `
      <tr>
        <td>${escape(r.gpu_type)}</td>
        <td>${escape(r.model || "—")}</td>
        ${allDimKeys.map((k) => `<td>${escape(r._dims?.[k] || "")}</td>`).join("")}
        ${allMetKeys.map((k) => {
          const v = r._metrics?.[k];
          return `<td class="num">${v == null ? "" : _fmt(v)}</td>`;
        }).join("")}
      </tr>
    `).join("");

    const selectedRunIds = Array.from(new Set(data.map((r) => r.run_id).filter(Boolean)));
    const monitorRowsForRun = (rid, payload) => {
      const rows = [];
      const byHost = payload?.by_host || {};
      const started = Number(payload?.started_at || 0);
      Object.entries(byHost).forEach(([host, samples]) => {
        let lastBucket = null;
        (Array.isArray(samples) ? samples : []).forEach((sample) => {
          const ts = Number(sample?.ts || 0);
          if (!ts) return;
          const bucket = Math.floor(Math.max(0, ts - started) / 10);
          if (bucket === lastBucket) return;
          lastBucket = bucket;
          const elapsed = Math.max(0, Math.round(ts - started));
          const gpuRows = (sample.per_gpu && sample.per_gpu.length) ? sample.per_gpu : [{
            index: "avg",
            util: sample.util_avg,
            power_w: sample.power_avg_w,
            mem_used_gb: sample.mem_used_gb,
            mem_total_gb: sample.mem_total_gb,
          }];
          gpuRows.forEach((g) => {
            const gpuLabel = String(g.index || "") === "avg" ? "GPU avg" : `GPU${g.index}`;
            rows.push(`
              <tr>
                <td>${escape(rid)}</td>
                <td>${escape(new Date(ts * 1000).toLocaleString())}</td>
                <td>+${elapsed}s</td>
                <td>${escape(host)}</td>
                <td>${escape(gpuLabel)}</td>
                <td class="num">${g.util == null ? "—" : Number(g.util).toFixed(1) + "%"}</td>
                <td class="num">${g.power_w == null ? "—" : Number(g.power_w).toFixed(1) + " W"}</td>
                <td class="num">${g.mem_used_gb == null || g.mem_total_gb == null ? "—" : Number(g.mem_used_gb).toFixed(1) + "/" + Number(g.mem_total_gb).toFixed(1) + " GB"}</td>
              </tr>`);
          });
        });
      });
      return rows;
    };
    const monitorRows = selectedRunIds.flatMap((rid) => monitorRowsForRun(rid, monitorByRun?.[rid]));
    const monitorHtml = monitorRows.length ? `
      <details open><summary>show table: GPU Utilization / Power timeline (${monitorRows.length} rows, 10s interval, used GPUs only)</summary>
        <div class="table-scroll"><table>
          <thead><tr><th>run id</th><th>time</th><th>elapsed</th><th>host</th><th>gpu</th><th class="num">util</th><th class="num">power</th><th class="num">memory</th></tr></thead>
          <tbody>${monitorRows.join("")}</tbody>
        </table></div>
      </details>` : `<p class="muted">no GPU Utilization / Power timeline samples</p>`;

    return `<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<title>${escape(title)}</title>
<style>
  body { background:#0b0d12; color:#e2e6ed; font-family: ui-sans-serif, system-ui, sans-serif; padding:24px; }
  h1 { font-size:18px; letter-spacing:0.02em; margin:0 0 6px; }
  .meta { font-family: ui-monospace, monospace; font-size:11px; color:#9aa3b2; margin-bottom:18px; }
  .meta b { color:#BB86FC; }
  .chart { background:#10131a; border:1px solid #2c2a39; border-radius:10px; padding:14px; margin-bottom:18px; }
  .chart svg { width:100%; height:auto; }
  table { border-collapse:collapse; width:100%; font-size:11px; font-family: ui-monospace, monospace; }
  th, td { padding:6px 9px; border-bottom:1px solid #2c2a39; text-align:left; }
  th { color:#9aa3b2; text-transform:uppercase; letter-spacing:0.12em; font-weight:500; }
  td.num { text-align:right; }
  tr:hover td { background:#13171f; }
  .table-scroll { max-height:620px; overflow:auto; border:1px solid #2c2a39; border-radius:10px; margin:10px 0 18px; }
  summary { cursor:pointer; color:#9aa3b2; font-family: ui-monospace, monospace; font-size:12px; margin-bottom:8px; }
  .muted { color:#9aa3b2; font-family: ui-monospace, monospace; font-size:12px; }
</style>
</head>
<body>
<h1>${escape(title)}</h1>
<div class="meta">
  chart: <b>${escape(chartType)}</b> ·
  x: <b>${escape(xField || "—")}</b> ·
  y: <b>${escape(yField || "—")}</b> ·
  groups: <b>${escape((groupFields || []).join(", ") || "—")}</b><br/>
  filters: <b>${escape(filterTxt)}</b> ·
  pins: <b>${data.length}</b> ·
  gpus: <b>${escape(Array.from(gpus).join(", "))}</b> ·
  group_keys: <b>${escape(Array.from(groupKeys).join(" / "))}</b>
</div>
<div class="chart" data-chart>${chartSvg}</div>
<h2>GPU Utilization / Power timeline</h2>
${monitorHtml}
<h2>Dashboard data</h2>
<table>
  <thead><tr>
    <th>gpu</th><th>model</th>
    ${allDimKeys.map((k) => `<th>${escape(k)}</th>`).join("")}
    ${allMetKeys.map((k) => `<th class="num">${escape(k)}</th>`).join("")}
  </tr></thead>
  <tbody>${rowsHtml}</tbody>
</table>
</body>
</html>`;
  }

  // ---------------------- Recent Runs (training + inference) ----------------------
  // Small inline SVG sparkline so a row can render util/power/nic series without
  // pulling recharts per-row (cheaper for long lists).
  function Sparkline({ data, color = "#BB86FC", max, height = 36, fmt }) {
    if (!data || !data.length) return <div className="text-[10px] text-fog-500">no data</div>;
    const N = data.length;
    const m = max ?? Math.max(1, ...data);
    const w = 120;
    const step = w / Math.max(1, N - 1);
    const pts = data.map((v, i) => `${(i * step).toFixed(1)},${(height - (v / m) * (height - 4) - 2).toFixed(1)}`).join(" ");
    const last = data[N - 1] || 0;
    return (
      <div className="flex items-center gap-2">
        <svg width={w} height={height} className="block">
          <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" />
        </svg>
        <span className="font-mono text-[11px]" style={{ color }}>{fmt ? fmt(last) : last.toFixed(1)}</span>
      </div>
    );
  }

  function RecentRunsPanel({ pinned, setPinned, onDeleteRun }) {
    const [runs, setRuns] = useState([]);
    const [openId, setOpenId] = useState(null);
    const [detail, setDetail] = useState({});   // {run_id: { samples, results }}
    const [loadingId, setLoadingId] = useState("");
    const [filter, setFilter] = useState("all"); // all | training | inference
    const [pinStatusByRun, setPinStatusByRun] = useState({});
    const [bulkPinStatus, setBulkPinStatus] = useState("");
    const [pendingDeleteRun, setPendingDeleteRun] = useState(null);
    const [deleteBusy, setDeleteBusy] = useState(false);
    const pinnedRunIds = useMemo(() => new Set((Array.isArray(pinned) ? pinned : []).map((p) => p.run_id).filter(Boolean)), [pinned]);

    const load = useCallback(async () => {
      try {
        const all = await api.listRuns();
        const keep = all.filter((r) => ["mlperf", "mlperf_k8s", "mlperf_inference", "llmd_bench", "vllm_bench", "pd_bench"].includes(r.kind));
        setRuns(keep.sort((a, b) => (b.created_at || 0) - (a.created_at || 0)));
      } catch (_) {}
    }, []);
    useEffect(() => { load(); const id = setInterval(load, 10000); return () => clearInterval(id); }, [load]);

    const isTraining = (r) => r.kind === "mlperf_k8s" || (r.kind === "mlperf" && r.suite === "training");
    const filtered = runs.filter((r) =>
      filter === "all" ? true : (filter === "training" ? isTraining(r) : !isTraining(r)));

    const fetchDetail = async (rid) => {
      if (detail[rid]) return detail[rid];
      setLoadingId(rid);
      try {
        const [samples, results] = await Promise.all([
          fetch(`/api/runs/${rid}/gpu_samples`).then((r) => r.ok ? r.json() : null).catch(() => null),
          api.getResults(rid).catch(() => null),
        ]);
        const next = { samples, results };
        setDetail((d) => ({ ...d, [rid]: next }));
        return next;
      } finally { setLoadingId(""); }
    };

    const toggle = (rid) => {
      if (openId === rid) { setOpenId(null); return; }
      setOpenId(rid); fetchDetail(rid);
    };

    const fmtDate = (sec) => sec ? new Date(sec * 1000).toLocaleString() : "—";
    const pinRunToDashboard = async (run) => {
      if (!run || String(run.status || "").toLowerCase() !== "success") return;
      setPinStatusByRun((prev) => ({ ...prev, [run.run_id]: "pending" }));
      try {
        const data = await fetchDetail(run.run_id);
        const row = data?.results?.rows?.[0];
        if (!row) throw new Error("parsed metric이 없습니다.");
        const entry = buildDashboardPinEntryFromRun(run, row);
        setPinned((prev) => mergeDashboardPins(prev, [entry]));
        setPinStatusByRun((prev) => ({ ...prev, [run.run_id]: "done" }));
      } catch (e) {
        setPinStatusByRun((prev) => ({ ...prev, [run.run_id]: "" }));
        alert(String(e.message || e));
      }
    };

    const pinAllVisibleRunsToDashboard = async () => {
      if (!setPinned || bulkPinStatus === "pending") return;
      const currentPinned = Array.isArray(pinned) ? pinned : [];
      const currentPinnedRunIds = new Set(currentPinned.map((p) => p.run_id).filter(Boolean));
      const targets = filtered.filter((r) =>
        String(r.status || "").toLowerCase() === "success" &&
        !currentPinnedRunIds.has(r.run_id)
      );
      if (!targets.length) {
        setBulkPinStatus("done");
        window.setTimeout(() => setBulkPinStatus(""), 1800);
        return;
      }
      setBulkPinStatus("pending");
      const entries = [];
      const failed = [];
      for (const run of targets) {
        setPinStatusByRun((prev) => ({ ...prev, [run.run_id]: "pending" }));
        try {
          const data = await fetchDetail(run.run_id);
          const row = data?.results?.rows?.[0];
          if (!row) throw new Error("parsed metric이 없습니다.");
          entries.push(buildDashboardPinEntryFromRun(run, row));
          setPinStatusByRun((prev) => ({ ...prev, [run.run_id]: "done" }));
        } catch (e) {
          failed.push(`${run.run_id}: ${String(e.message || e)}`);
          setPinStatusByRun((prev) => ({ ...prev, [run.run_id]: "" }));
        }
      }
      if (entries.length) {
        setPinned((prev) => mergeDashboardPins(prev, entries));
      }
      setBulkPinStatus("done");
      window.setTimeout(() => setBulkPinStatus(""), 2200);
      if (failed.length) alert(`일부 history는 반영하지 못했습니다.\n${failed.slice(0, 6).join("\n")}${failed.length > 6 ? "\n..." : ""}`);
    };

    const askDeleteRunFromRecent = (run) => {
      if (!onDeleteRun || !run?.run_id) return;
      setPendingDeleteRun(run);
    };
    const confirmDeleteRunFromRecent = async () => {
      const runId = pendingDeleteRun?.run_id;
      if (!onDeleteRun || !runId) return;
      setDeleteBusy(true);
      try {
        await onDeleteRun(runId);
        setRuns((prev) => (prev || []).filter((r) => r.run_id !== runId));
        setDetail((prev) => { const next = { ...(prev || {}) }; delete next[runId]; return next; });
        if (openId === runId) setOpenId(null);
        setPendingDeleteRun(null);
      } finally {
        setDeleteBusy(false);
      }
    };

    return (
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">최근 실행 (Training · Inference)</div>
          </div>
          <div className="flex items-center gap-2">
            <div className="seg">
              {[["all","전체"],["training","Training"],["inference","Inference"]].map(([v,l]) => (
                <button key={v} className={"seg-btn" + (filter === v ? " active" : "")} onClick={() => setFilter(v)}>{l}</button>
              ))}
            </div>
            <button className="dashboard-bulk-pin" disabled={bulkPinStatus === "pending"} onClick={pinAllVisibleRunsToDashboard}>
              {bulkPinStatus === "pending" ? "대시보드 전체 반영 중" : "대시보드 전체 반영"}
            </button>
            {bulkPinStatus === "done" && <span className="dashboard-pin-feedback bulk">반영 완료</span>}
            <button className="btn-ghost flex items-center gap-1.5" onClick={load}>
              <Icon name="refresh" className="w-3.5 h-3.5" /> 새로고침
            </button>
          </div>
        </div>
        <div className="card-pad">
          {filtered.length === 0
            ? <div className="text-[12.5px] text-fog-500 py-6 text-center">아직 실행이 없습니다.</div>
            : (
              <div className="overflow-x-auto rounded-xl border border-line">
                <table className="dt recent-runs-table">
                  <thead><tr>
                    <th>RUN ID</th><th>KIND</th><th>테스트 설정</th><th>STATUS</th><th>HOSTS</th><th>NUM_GPUS</th><th>START_TIME</th><th>END_TIME</th><th className="text-right">ACTION</th><th className="text-right">DELETE</th>
                  </tr></thead>
                  <tbody>
                    {filtered.map((r) => {
                      const open = openId === r.run_id;
                      const alloc = summarizeGpuAllocation(r);
                      const canPin = String(r.status || "").toLowerCase() === "success" && !!setPinned;
                      const pinState = pinStatusByRun[r.run_id] || (pinnedRunIds.has(r.run_id) ? "done" : "");
                      return (
                        <React.Fragment key={r.run_id}>
                          <tr>
                            <td className="font-mono text-fog-100 font-semibold">
                              <button className="recent-run-id" onClick={() => toggle(r.run_id)} title="GPU/Power 상세 보기">
                                <span>{open ? "▾" : "▸"}</span>{r.run_id}
                              </button>
                            </td>
                            <td><span className={"chip kind-chip " + runKindChipClass(r)}>{runKindLabel(r)}</span></td>
                            <td className="font-mono text-[11px] text-fog-300 max-w-[320px] truncate" title={runSettingsLabel(r)}>{runSettingsLabel(r)}</td>
                            <td><StatusBadge status={r.status || "idle"} /></td>
                            <td className="font-mono text-[12px] text-fog-300 max-w-[260px] truncate" title={(r.hosts || []).join(", ")}>{(r.hosts || []).join(", ") || "—"}</td>
                            <td className="font-mono text-[12px] text-fog-200">{alloc.total || "—"}</td>
                            <td className="text-[11px] text-fog-500 whitespace-nowrap">{fmtDate(r.started_at || r.created_at)}</td>
                            <td className="text-[11px] text-fog-500 whitespace-nowrap">{fmtDate(r.finished_at || r.ended_at)}</td>
                            <td className="text-right">
                              <div className="recent-run-actions">
                                <a className="btn-soft" href={`/api/runs/${r.run_id}/report`} target="_blank" rel="noreferrer" download={`${r.run_id}_report.html`}>Report 다운</a>
                                <button className={"dashboard-row-pin " + (canPin ? "" : "disabled")} disabled={!canPin || pinState === "pending"} onClick={() => pinRunToDashboard(r)}>{pinState === "pending" ? "대시보드 반영 중" : "대시보드 반영"}</button>
                              </div>
                              {pinState === "done" && <div className="dashboard-pin-feedback">반영 완료</div>}
                              {pinState === "pending" && <div className="dashboard-pin-feedback pending">대시보드 반영 중</div>}
                            </td>
                            <td className="text-right">
                              <button className="history-delete-btn" onClick={() => askDeleteRunFromRecent(r)}>삭제</button>
                            </td>
                          </tr>
                          {open && (
                            <tr>
                              <td colSpan="10" style={{ background: "rgba(255,255,255,0.015)" }}>
                                <RunDetail run={r} data={detail[r.run_id]} loading={loadingId === r.run_id} pinned={pinned} setPinned={setPinned} />
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
        </div>
        <RunDeleteConfirmDialog
          run={pendingDeleteRun}
          busy={deleteBusy}
          onCancel={() => !deleteBusy && setPendingDeleteRun(null)}
          onConfirm={confirmDeleteRunFromRecent}
        />
      </div>
    );
  }

  function RunDetail({ run, data, loading, pinned, setPinned }) {
    if (loading || !data) return <div className="p-4 text-[12px] text-fog-500">로딩 중…</div>;
    const rawByHost = (data.samples && data.samples.by_host) || {};
    const byHost = filterGpuSamplesByRun(rawByHost, run);
    const results = data.results;
    const rows = (results && results.rows) || [];
    const firstRow = rows[0] || null;
    const utilAvg = averageFromSamples(byHost, "util_avg");
    const powerAvg = averageFromSamples(byHost, "power_avg_w");
    const metrics = firstRow ? resultRowMetrics(firstRow).slice(0, 5) : [];
    const isFailedRun = runFailed(run);
    const errorMessages = normalizeRunErrorMessages(run, results);

    return (
      <div className="recent-run-detail compact-detail">
        <div className="recent-run-detail-row">
          <div className="recent-detail-chart-card">
            <MiniHistoryChart title={`GPU UT · avg ${utilAvg == null ? "—" : utilAvg.toFixed(1) + "%"}`} series={byHost} field="util_avg" max={100} suffix="%" run={run} />
          </div>
          <div className="recent-detail-chart-card">
            <MiniHistoryChart title={`Power · avg ${powerAvg == null ? "—" : powerAvg.toFixed(1) + " W"}`} series={byHost} field="power_avg_w" max="auto" suffix="W" run={run} />
          </div>
          <div className="recent-detail-metric-card">
            {isFailedRun ? (
              <ErrorMessageBox messages={errorMessages} compact />
            ) : (
              <>
                <div className="recent-detail-metric-title">parsed metric</div>
                {!firstRow ? (
                  <div className="mini-history-empty">파싱된 결과가 아직 없습니다.</div>
                ) : (
                  <>
                    <div className="run-history-metric-chips recent-detail-metrics">
                      {metrics.length
                        ? metrics.map(([k, v]) => <span key={k}><b>{prettyMetricName(k)}</b>{typeof v === "number" ? fmtNum(v, 3) : String(v)}</span>)
                        : <span>parsed metric —</span>}
                    </div>
                  </>
                )}
              </>
            )}
          </div>
        </div>
      </div>
    );
  }

  function DashboardTab({ pinned, setPinned, onDeleteRun }) {
    const rawAll = Array.isArray(pinned) ? pinned : [];
    const [dashboardRuns, setDashboardRuns] = useState([]);

    useEffect(() => {
      let dead = false;
      const loadDashboardRuns = async () => {
        try {
          const rows = await api.listRuns();
          if (!dead) setDashboardRuns(Array.isArray(rows) ? rows : []);
        } catch (_) {}
      };
      loadDashboardRuns();
      const id = setInterval(loadDashboardRuns, 10000);
      return () => { dead = true; clearInterval(id); };
    }, []);

    const all = useMemo(() => {
      const byRun = new Map((dashboardRuns || []).map((r) => [String(r.run_id || ''), r]));
      return rawAll.map((p) => {
        const r = byRun.get(String(p?.run_id || ''));
        if (!r) return p;
        const pDims = p?.dims || {};
        const params = r.params || {};
        const env = p.env || p.runtime_env || pDims.env || pDims.runtime_env || params.runtime_env || (r.kind === 'mlperf_k8s' ? 'k8s' : 'bare');
        const mode = p.mode || pDims.mode || params.mode || (r.kind === 'pd_bench' ? 'pd' : '');
        const version = p.version || pDims.version || r.version || '';
        const model = p.model || pDims.model || r.benchmark || '';
        return {
          ...p,
          _run: r,
          request_params: p.request_params || r.params || {},
          suite: p.suite || pDims.suite || r.suite || '',
          version,
          env,
          mode,
          model,
          dims: { ...pDims, ...(version ? { version } : {}), ...(env ? { env } : {}), ...(mode ? { mode } : {}) },
        };
      });
    }, [rawAll, dashboardRuns]);

    // ============ STATE ============
    const [category, setCategory]   = useState("training");
    const [testKind, setTestKind]   = useState("mlperf");
    const [versionFilter, setVersionFilter] = useState("__all__");
    const [model, setModel]         = useState("__all__");
    const [envFilter, setEnvFilter] = useState("__all__");
    const [modeFilter, setModeFilter] = useState("__all__");
    const [chartType, setChartType] = useState("line");
    const [xField, setXField]       = useState(null);
    const [yField, setYField]       = useState(null);
    const [groupFields, setGroupFields] = useState([]);
    const [filters, setFilters]     = useState({});
    const [gpuTypeFilters, setGpuTypeFilters] = useState([]);
    const [showRaw, setShowRaw]     = useState(false);
    const [hpPreviewPin, setHpPreviewPin] = useState(null);
    const [resultPreviewPin, setResultPreviewPin] = useState(null);
    const [selectedPinId, setSelectedPinId] = useState(null);
    const [hoveredPinId, setHoveredPinId] = useState(null);
    const [chartPinIds, setChartPinIds] = useState(null);
    const prevCandidatePinIdsRef = useRef([]);
    const selectionCacheRef = useRef({});

    const dashboardScopeOptions = useMemo(() => [
      { value: "training::mlperf", category: "training", testKind: "mlperf", label: "Training - MLPerf" },
      { value: "inference::mlperf", category: "inference", testKind: "mlperf", label: "Inference - MLPerf" },
      { value: "inference::vllm", category: "inference", testKind: "vllm", label: "Inference - vLLM" },
    ], []);

    const selectedDashboardScope = `${category}::${testKind}`;

    const categoryTestKindOptions = useMemo(() => {
      if (category === "training") return [{ value: "mlperf", label: "MLPerf" }];
      return [
        { value: "mlperf", label: "MLPerf" },
        { value: "vllm", label: "vLLM" },
      ];
    }, [category]);

    // ============ DERIVED ============
    const categoryPins = useMemo(
      () => all.map(normalizeDashboardPinRecord).filter((p) => p && dashboardPinCategory(p) === category),
      [all, category]
    );

    const kindPins = useMemo(
      () => categoryPins.filter((p) => dashboardTestKindOfPin(p) === testKind),
      [categoryPins, testKind]
    );

    const optionFrom = (items, getter) => {
      const s = new Set();
      items.forEach((p) => { const v = String(getter(p) || "").trim(); if (v) s.add(v); });
      return Array.from(s).sort();
    };

    const dashboardCatalog = useMemo(() => catalogForDashboard(category, testKind), [category, testKind]);

    const versionOptions = useMemo(() => {
      const catalogVersions = dashboardCatalog.versions || [];
      return catalogVersions.length ? catalogVersions : optionFrom(kindPins, dashboardPinVersion);
    }, [kindPins, dashboardCatalog]);
    const versionPins = useMemo(() => {
      if (versionFilter === "__all__") return kindPins;
      return kindPins.filter((p) => dashboardPinVersion(p) === versionFilter);
    }, [kindPins, versionFilter]);

    const modelOptions = useMemo(() => {
      const catalogModels = dashboardModelCatalog(category, testKind, versionFilter);
      return catalogModels.length ? catalogModels : optionFrom(versionPins, (p) => p.model);
    }, [category, testKind, versionFilter, versionPins]);
    const selectedModelPins = useMemo(() => {
      if (model === "__all__") return versionPins;
      return versionPins.filter((p) => String(p.model || "") === model);
    }, [versionPins, model]);

    const envOptions = useMemo(() => {
      const catalogEnvs = dashboardCatalog.envs || [];
      return catalogEnvs.length ? catalogEnvs : optionFrom(selectedModelPins, dashboardPinEnv);
    }, [dashboardCatalog, selectedModelPins]);
    const envPins = useMemo(() => {
      if (envFilter === "__all__") return selectedModelPins;
      return selectedModelPins.filter((p) => dashboardPinEnv(p) === envFilter);
    }, [selectedModelPins, envFilter]);

    const modeOptions = useMemo(() => {
      const catalogModes = dashboardCatalog.modes || [];
      return catalogModes.length ? catalogModes : optionFrom(envPins, dashboardPinMode);
    }, [dashboardCatalog, envPins]);
    const modelPins = useMemo(() => {
      if (category !== "inference" || testKind !== "vllm" || modeFilter === "__all__") return envPins;
      return envPins.filter((p) => dashboardPinMode(p) === modeFilter);
    }, [category, testKind, envPins, modeFilter]);

    const selectionKey = `${category}::${testKind}::${versionFilter}::${model}::${envFilter}::${modeFilter}`;

    const gpuTypeOptions = useMemo(() => {
      const s = new Map();
      modelPins.forEach((p) => {
        const g = String(p.gpu_type || p.dims?.gpu_type || "").trim();
        if (!g) return;
        s.set(g, (s.get(g) || 0) + 1);
      });
      return Array.from(s.entries()).sort((a, b) => a[0].localeCompare(b[0]));
    }, [modelPins]);

    const gpuTypeChecked = (g) => gpuTypeFilters.includes(g);
    const toggleGpuType = (g) => {
      const options = gpuTypeOptions.map(([x]) => x);
      const cur = gpuTypeFilters.filter((x) => options.includes(x));
      const next = cur.includes(g) ? cur.filter((x) => x !== g) : [...cur, g];
      setGpuTypeFilters(next);
    };

    const MLPERF_TEST_ARG_FIELDS = ["gpu_type", "MAX_STEPS", "GLOBAL_BATCH_SIZE", "MBS", "precision"];
    const MLPERF_PARALLEL_FIELDS = ["TENSOR_PARALLEL", "PIPELINE_PARALLEL", "CONTEXT_PARALLEL"];
    const MLPERF_RESULT_FIELDS = ["train_loss", "train_step_time", "eval_accuracy", "validation_time"];
    const MLPERF_DASHBOARD_METRICS = [
      ...MLPERF_TEST_ARG_FIELDS.filter((k) => k !== "gpu_type"),
      ...MLPERF_PARALLEL_FIELDS,
      ...MLPERF_RESULT_FIELDS,
    ];
    const MLPERF_DASHBOARD_DIMS = ["gpu_type", "precision", "MBS", "fp8_hybrid"];

    const allMetricKeys = useMemo(() => {
      if (category === "training") {
        const present = new Set();
        modelPins.forEach((p) => Object.keys(p.metrics || {}).forEach((k) => present.add(k)));
        return MLPERF_DASHBOARD_METRICS.filter((k) => present.has(k));
      }
      const s = new Set();
      modelPins.forEach((p) =>
        Object.keys(p.metrics || {}).forEach((k) => s.add(k))
      );
      return Array.from(s).sort();
    }, [modelPins, category]);

    const allDimKeys = useMemo(() => {
      if (category === "training") {
        const present = new Set();
        modelPins.forEach((p) => Object.keys(p.dims || {}).forEach((k) => present.add(k)));
        return MLPERF_DASHBOARD_DIMS.filter((k) => present.has(k));
      }
      const s = new Set();
      modelPins.forEach((p) =>
        Object.keys(p.dims || {}).forEach((k) => {
          if (k === "gpu_type" || k === "model" || k === "kind") return;
          s.add(k);
        })
      );
      return Array.from(s).sort();
    }, [modelPins, category]);

    // unique values per dim
    const dimValues = useMemo(() => {
      const keys = Array.from(new Set(["gpu_type", "model", ...allDimKeys]));
      const m = {};
      keys.forEach((k) => (m[k] = new Set()));
      modelPins.forEach((p) => {
        keys.forEach((k) => {
          const v = p.dims?.[k] ?? (k === "gpu_type" ? p.gpu_type : (k === "model" ? p.model : undefined));
          if (v != null) m[k].add(v);
        });
      });
      return Object.fromEntries(
        Object.entries(m).map(([k, s]) => [k, Array.from(s).sort()])
      );
    }, [modelPins, allDimKeys]);

    // ============ DEFAULTS / RESETS ============
    // Keep dashboard filter selections valid as the chosen category/test kind narrows the data.
    useEffect(() => {
      if (!categoryTestKindOptions.some((o) => o.value === testKind)) setTestKind("mlperf");
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [category, categoryTestKindOptions.map((o) => o.value).join("|")]);

    useEffect(() => {
      if (versionFilter !== "__all__" && !versionOptions.includes(versionFilter)) setVersionFilter("__all__");
      if (model !== "__all__" && !modelOptions.includes(model)) setModel("__all__");
      if (envFilter !== "__all__" && !envOptions.includes(envFilter)) setEnvFilter("__all__");
      if (modeFilter !== "__all__" && !modeOptions.includes(modeFilter)) setModeFilter("__all__");
    }, [versionOptions.join("|"), modelOptions.join("|"), envOptions.join("|"), modeOptions.join("|")]);

    const availableFieldKeys = useMemo(() => {
      const base = category === "training" ? ["gpu_type"] : ["gpu_type", "model"];
      return new Set([...base, ...allDimKeys, ...allMetricKeys]);
    }, [category, allDimKeys, allMetricKeys]);

    // X axis and Groups are dimensions / test args only.
    // Result metrics belong only to the Y axis, so do not expose them here.
    const axisFieldKeys = useMemo(() => {
      if (category === "training") {
        return new Set([
          ...MLPERF_TEST_ARG_FIELDS.filter((k) => availableFieldKeys.has(k)),
          ...MLPERF_PARALLEL_FIELDS.filter((k) => availableFieldKeys.has(k)),
        ]);
      }
      return new Set(Array.from(new Set(["gpu_type", "model", ...allDimKeys])).filter((k) => availableFieldKeys.has(k)));
    }, [category, allDimKeys, availableFieldKeys]);

    const trayDimKeys = useMemo(() => {
      const base = category === "training" ? ["gpu_type"] : ["gpu_type", "model"];
      return Array.from(new Set([...base, ...allDimKeys]));
    }, [category, allDimKeys]);

    useEffect(() => {
      const options = gpuTypeOptions.map(([g]) => g);
      setGpuTypeFilters((prev) => {
        const kept = prev.filter((g) => options.includes(g));
        return kept.length ? kept : options;
      });
    }, [gpuTypeOptions.map(([g]) => g).join("|")]);

    // Keep axis/group selections stable. Changing chart type must never reset x/y/groups.
    // Cache selections per category+model so toggling chart types or moving between
    // categories restores the user's most recent choices when those fields still exist.
    useEffect(() => {
      selectionCacheRef.current[selectionKey] = { xField, yField, groupFields };
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [selectionKey, xField, yField, groupFields.join("|")]);

    useEffect(() => {
      const yMetricKeys = category === "training"
        ? MLPERF_RESULT_FIELDS.filter((k) => allMetricKeys.includes(k))
        : allMetricKeys;
      const axisOptions = Array.from(axisFieldKeys);
      const preferredX = category === "training"
        ? (axisFieldKeys.has("MAX_STEPS") ? "MAX_STEPS" : (axisOptions[0] || "gpu_type"))
        : (axisOptions[0] || "gpu_type");
