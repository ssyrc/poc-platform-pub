  async function allocateBareMetalGpus(nodes) {
    const list = (Array.isArray(nodes) ? nodes : [])
      .map((n) => ({ host: String(n.host || "").trim(), gpus: Math.max(1, Number(n.gpus || 1)) }))
      .filter((n) => n.host && n.gpus > 0);
    const out = {};
    for (const n of list) {
      const raw = await api.freeGpus(n.host, n.gpus);
      if (raw?.error) throw new Error(`${n.host}: GPU 자동 선택 실패 - ${raw.error}`);
      const picked = Array.isArray(raw?.gpus) ? raw.gpus : [];
      if (picked.length < n.gpus) {
        const all = Array.isArray(raw?.all) ? raw.all : [];
        const freeCount = all.filter((g) => g && g.free).length;
        throw new Error(`${n.host}: 요청 ${n.gpus}GPU, 사용 가능 ${freeCount}GPU`);
      }
      out[n.host] = picked.join(",");
    }
    return out;
  }

  const normalizeGpuSelectionText = (value) => {
    const nums = String(value ?? "")
      .split(/[,\s]+/)
      .map((v) => v.trim())
      .filter(Boolean)
      .map((v) => Number(v));
    if (!nums.length) return "";
    const valid = nums.filter((n) => Number.isInteger(n) && n >= 0);
    return valid.length === nums.length ? valid.join(",") : String(value ?? "").trim();
  };

  const gpuSelectionList = (value) => {
    const txt = normalizeGpuSelectionText(value);
    if (!txt) return [];
    return txt.split(",").map((v) => Number(v)).filter((n) => Number.isInteger(n) && n >= 0);
  };

  const cleanGpuSelectionMap = (map, hosts) => {
    const allow = new Set((hosts || []).map((h) => String(h || "").trim()).filter(Boolean));
    const out = {};
    Object.entries(map || {}).forEach(([host, value]) => {
      const h = String(host || "").trim();
      const v = normalizeGpuSelectionText(value);
      if (h && v && (!allow.size || allow.has(h))) out[h] = v;
    });
    return out;
  };

  const validateGpuSelection = (node, value) => {
    const host = String(node?.host || "").trim();
    const required = Math.max(1, Number(node?.gpus || 1));
    const raw = String(value ?? "").trim();
    if (!raw) return "";
    const pieces = raw.split(/[,\s]+/).map((v) => v.trim()).filter(Boolean);
    if (!pieces.length) return "";
    if (!pieces.every((v) => /^\d+$/.test(v))) return `${host}: CUDA_VISIBLE_DEVICES는 0 이상의 GPU ID만 입력할 수 있습니다.`;
    const ids = pieces.map((v) => Number(v));
    if (ids.length !== required) return `${host}: GPU ${required}개를 요청했지만 CUDA_VISIBLE_DEVICES=${ids.join(",")} 는 ${ids.length}개입니다.`;
    if (new Set(ids).size !== ids.length) return `${host}: CUDA_VISIBLE_DEVICES에 중복 GPU ID가 있습니다.`;
    return "";
  };

  async function prefillBareMetalGpuMap(nodes, currentMap = {}) {
    const list = (Array.isArray(nodes) ? nodes : [])
      .map((n) => ({ host: String(n.host || "").trim(), gpus: Math.max(1, Number(n.gpus || 1)) }))
      .filter((n) => n.host && n.gpus > 0);
    const out = {};
    for (const n of list) {
      const existing = normalizeGpuSelectionText(currentMap?.[n.host]);
      if (existing && !validateGpuSelection(n, existing)) {
        out[n.host] = existing;
        continue;
      }
      const raw = await api.freeGpus(n.host, n.gpus);
      if (raw?.error) throw new Error(`${n.host}: GPU 자동 선택 실패 - ${raw.error}`);
      const picked = Array.isArray(raw?.gpus) ? raw.gpus : [];
      if (picked.length < n.gpus) {
        const all = Array.isArray(raw?.all) ? raw.all : [];
        const freeCount = all.filter((g) => g && g.free).length;
        throw new Error(`${n.host}: 요청 ${n.gpus}GPU, 사용 가능 ${freeCount}GPU`);
      }
      out[n.host] = picked.join(",");
    }
    return out;
  }

  async function resolveBareMetalGpuMap(nodes, manualMap = {}) {
    const list = (Array.isArray(nodes) ? nodes : [])
      .map((n) => ({ host: String(n.host || "").trim(), gpus: Math.max(1, Number(n.gpus || 1)) }))
      .filter((n) => n.host && n.gpus > 0);
    const out = {};
    const missing = [];
    for (const n of list) {
      const selected = normalizeGpuSelectionText(manualMap?.[n.host]);
      if (selected) {
        const err = validateGpuSelection(n, selected);
        if (err) throw new Error(err);
        out[n.host] = selected;
      } else {
        missing.push(n);
      }
    }
    if (missing.length) {
      Object.assign(out, await allocateBareMetalGpus(missing));
    }
    return out;
  }

  function GpuSelectionFields({ nodes, value, onChange, title = "CUDA_VISIBLE_DEVICES" }) {
    const list = (Array.isArray(nodes) ? nodes : [])
      .map((n) => ({ host: String(n.host || "").trim(), gpus: Math.max(1, Number(n.gpus || 1)) }))
      .filter((n) => n.host && n.gpus > 0);
    if (!list.length) return null;
    const patch = (host, raw) => onChange({ ...(value || {}), [host]: String(raw ?? "") });
    const normalizeHost = (host, raw) => onChange({ ...(value || {}), [host]: normalizeGpuSelectionText(raw) });
    return (
      <>
        {list.map((n) => {
          const current = value?.[n.host] || "";
          const err = validateGpuSelection(n, current);
          return (
            <BenchField key={n.host} label="CUDA_VISIBLE_DEVICES">
              <input
                className={"inp font-mono " + (err ? "border-err/70" : "")}
                value={current}
                inputMode="text"
                onChange={(e) => patch(n.host, e.target.value)}
                onBlur={(e) => normalizeHost(n.host, e.target.value)}

                spellCheck={false}
              />
              {err && <div className="mt-1 text-[10px] text-err font-mono">{err}</div>}
            </BenchField>
          );
        })}
      </>
    );
  }


  function NodeAdder({ title, hint, nodes, setNodes, defaultGpus = 1, showClusterStatus = true }) {
    const list = Array.isArray(nodes) ? nodes : [];
    const [hostText, setHostText] = useState("");
    const [gpus, setGpus] = useState(defaultGpus);
    const [nodeStatus, setNodeStatus] = useState({});
    const [gpuProbe, setGpuProbe] = useState({ loading: false, rows: [], error: "" });
    const [addedGpuProbe, setAddedGpuProbe] = useState({});
    const parseHosts = (raw) => Array.from(new Set(String(raw || "").split(/[,\s]+/).map((x) => x.trim()).filter(Boolean)));
    const normalizedGpu = Math.max(1, Number(gpus || 1));
    const bumpGpu = (delta) => setGpus(Math.max(1, Number(gpus || 1) + delta));
    const replaceNodeAt = (idx, patch) => setNodes((prev) => (prev || []).map((n, i) => i === idx ? { ...n, ...patch } : n));
    const bumpNodeGpu = (idx, delta) => setNodes((prev) => (prev || []).map((n, i) => {
      if (i !== idx) return n;
      return { ...n, gpus: Math.max(1, Number(n.gpus || 1) + delta) };
    }));
    const add = () => {
      const hosts = parseHosts(hostText);
      const n = Number(gpus || 0);
      if (!hosts.length || n < 1) return;
      setNodes((prev) => {
        const map = new Map((prev || []).map((x) => [x.host, x]));
        hosts.forEach((h) => map.set(h, { host: h, gpus: n }));
        return Array.from(map.values()).sort((a, b) => a.host.localeCompare(b.host));
      });
      setHostText("");
      setGpus(defaultGpus);
      setGpuProbe({ loading: false, rows: [], error: "" });
    };
    const remove = (idx) => setNodes((prev) => (prev || []).filter((_, i) => i !== idx));
    const totalGpus = list.reduce((acc, n) => acc + Number(n.gpus || 0), 0);

    useEffect(() => {
      const hosts = parseHosts(hostText);
      if (!hosts.length) { setGpuProbe({ loading: false, rows: [], error: "" }); return; }
      let dead = false;
      const timer = setTimeout(async () => {
        setGpuProbe((prev) => ({ ...prev, loading: true, error: "" }));
        try {
          const rows = await Promise.all(hosts.slice(0, 8).map(async (h) => {
            try {
              const raw = await api.freeGpus(h, 32);
              const all = Array.isArray(raw?.all) ? raw.all : [];
              const free = all.filter((g) => g && g.free).map((g) => g.index);
              return { host: h, total: all.length, free: free.length, freeIndices: free, error: raw?.error || "" };
            } catch (e) {
              return { host: h, total: 0, free: 0, freeIndices: [], error: String(e.message || e) };
            }
          }));
          if (!dead) setGpuProbe({ loading: false, rows, error: "" });
        } catch (e) {
          if (!dead) setGpuProbe({ loading: false, rows: [], error: String(e.message || e) });
        }
      }, 450);
      return () => { dead = true; clearTimeout(timer); };
    }, [hostText]);

    useEffect(() => {
      const hosts = Array.from(new Set(list.map((n) => String(n.host || "").trim()).filter(Boolean)));
      if (!hosts.length) { setAddedGpuProbe({}); return; }
      let dead = false;
      setAddedGpuProbe((prev) => {
        const next = {};
        hosts.forEach((h) => { next[h] = prev[h] || { loading: true, total: 0, free: 0, error: "" }; });
        return next;
      });
      const timer = setTimeout(async () => {
        const pairs = await Promise.all(hosts.slice(0, 32).map(async (h) => {
          try {
            const raw = await api.freeGpus(h, 32);
            const all = Array.isArray(raw?.all) ? raw.all : [];
            const free = all.filter((g) => g && g.free).length;
            return [h, { loading: false, total: all.length, free, error: raw?.error || "" }];
          } catch (e) {
            return [h, { loading: false, total: 0, free: 0, error: String(e.message || e) }];
          }
        }));
        if (!dead) setAddedGpuProbe(Object.fromEntries(pairs));
      }, 450);
      return () => { dead = true; clearTimeout(timer); };
    }, [list.map((n) => String(n.host || "").trim()).sort().join("|")]);

    useEffect(() => {
      if (!showClusterStatus) { setNodeStatus({}); return; }
      const hosts = Array.from(new Set(list.map((n) => String(n.host || "").trim()).filter(Boolean)));
      if (!hosts.length) { setNodeStatus({}); return; }
      let dead = false;
      const normalizeWwNodes = (payload) => {
        if (Array.isArray(payload)) return payload;
        if (payload && Array.isArray(payload.nodes)) return payload.nodes;
        if (payload && typeof payload === "object" && !payload.error) {
          return Object.entries(payload).map(([id, v]) => (v && typeof v === "object") ? { id, ...v } : { id, value: v });
        }
        return [];
      };
      const wwName = (n) => String(n.id || n.node_id || n.name || n.hostname || "").trim();
      const load = async () => {
        const ww = new Set();
        const k8s = new Map();
        try {
          const raw = await api.wwNodes();
          normalizeWwNodes(raw).forEach((n) => { const name = wwName(n); if (name) ww.add(name); });
        } catch (_) {}
        try {
          const raw = await api.k8sNodes();
          (raw?.nodes || []).forEach((n) => {
            if (n?.name) k8s.set(String(n.name), { ready: n.status === "Ready", status: n.status || "Unknown", role: n.role || "worker" });
          });
        } catch (_) {}
        const next = {};
        hosts.forEach((h) => next[h] = { ww: ww.has(h), k8s: k8s.get(h) || null });
        if (!dead) setNodeStatus(next);
      };
      load();
      return () => { dead = true; };
    }, [showClusterStatus, list.map((n) => n.host).sort().join("|")]);

    const StatusPill = ({ ok, warn, children, title }) => (
      <span title={title || ""} className={"node-status-pill " + (ok ? "ok" : (warn ? "warn" : "need"))}>{children}</span>
    );

    return (
      <div className="compact-node-adder">
        <div className="flex items-center justify-between gap-3">
          <div className="label-mono flex items-center gap-2">{title}</div>
          <span className="chip chip-cool">{list.length} node · {totalGpus} gpu</span>
        </div>

        {list.length > 0 ? (
          <div className="node-card-list node-card-wrap">
            {list.map((n, idx) => {
              const st = nodeStatus[n.host] || {};
              const wwReady = !!st.ww;
              const k8sSeen = !!st.k8s;
              const k8sReady = !!st.k8s?.ready;
              const usable = showClusterStatus ? (wwReady && k8sReady) : true;
              const k8sLabel = k8sSeen ? (st.k8s.status || "worker") : "not found";
              return (
                <div key={`node_${idx}`} className={"node-card-row node-card-chip " + (usable ? "usable" : "blocked") + (!showClusterStatus ? " bare" : "")} title={`${n.host} ${n.gpus}GPU`}>
                  <div className="node-card-edit-main">
                    <span className={"node-state-dot " + (usable ? "usable" : "blocked")}></span>
                    <input
                      className="node-edit-host"
                      value={n.host || ""}
                      onChange={(e) => replaceNodeAt(idx, { host: e.target.value })}
                      spellCheck={false}
                      title="hostname 수정"
                    />
                    <div className="node-card-stepper" title="GPU 수량 수정">
                      <button type="button" onClick={() => bumpNodeGpu(idx, -1)}>-</button>
                      <input type="text" inputMode="numeric" value={n.gpus || ""} onChange={(e) => replaceNodeAt(idx, { gpus: e.target.value.replace(/[^0-9]/g, "") })} />
                      <button type="button" onClick={() => bumpNodeGpu(idx, 1)}>+</button>
                    </div>
                    {(() => {
                      const cap = addedGpuProbe[n.host];
                      const requested = Math.max(1, Number(n.gpus || 1));
                      const bad = !cap || cap.loading || cap.error || cap.free < requested;
                      const label = !cap || cap.loading ? "GPU 확인" : cap.error ? "GPU 확인 실패" : `${cap.free}/${cap.total} free`;
                      return <span className={"node-inline-gpu-probe " + (bad ? "warn" : "ok")} title="nvidia-smi 기준 free/total GPU">{label}</span>;
                    })()}
                  </div>
                  {showClusterStatus && (
                    <div className="node-status-set">
                      <StatusPill ok={wwReady} title={wwReady ? "Warewulf node exists" : "Warewulf node is required"}>wwf</StatusPill>
                      <StatusPill ok={k8sReady} warn={k8sSeen && !k8sReady} title={k8sSeen ? `K8s node status: ${k8sLabel}` : "K8s worker node is required"}>k8s</StatusPill>
                    </div>
                  )}
                  <button className="node-card-remove" onClick={() => remove(idx)} title="삭제">×</button>
                </div>
              );
            })}
          </div>
        ) : (
          <div className="rounded-xl border border-dashed border-line px-3 py-4 text-center text-[12px] text-fog-500">node 없음</div>
        )}

        <div className="node-bottom-controls">
          <div className="node-input-grid">
            <BenchField label="hostname">
              <textarea
                className="inp node-host-input font-mono resize-y"
                rows="1"
                value={hostText}
                onChange={(e) => setHostText(e.target.value)}
                spellCheck={false}
                placeholder="gpu-node03 gpu-node04"
                onKeyDown={(e) => {
                  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") add();
                }}
              />
            </BenchField>
            <BenchField label="GPU 수량">
              <div className="gpu-qty-with-probe">
                <div className="gpu-stepper">
                  <button type="button" onClick={() => bumpGpu(-1)}>-</button>
                  <input type="text" inputMode="numeric" value={normalizedGpu} onChange={(e) => setGpus(e.target.value.replace(/[^0-9]/g, ""))} />
                  <button type="button" onClick={() => bumpGpu(1)}>+</button>
                </div>
                <div className="gpu-probe-panel" title="nvidia-smi 기준 여유 GPU 수">
                  {!hostText.trim() ? <span className="muted">0/0 free</span> : gpuProbe.loading ? <span className="checking">확인 중</span> : gpuProbe.rows.length ? gpuProbe.rows.map((r) => (
                    <span key={r.host} className={"gpu-probe-chip " + (r.error || r.free < normalizedGpu ? "warn" : "ok")}>{r.host}: {r.error ? "확인 실패" : `${r.free}/${r.total} free`}</span>
                  )) : <span className="muted">확인 대기</span>}
                </div>
              </div>
            </BenchField>
          </div>
          <button className="btn-param node-add-button" onClick={add}>+ 노드 추가</button>
        </div>
      </div>
    );
  }



  function LlmdConfig({ onStart, busy, setInferenceSub }) {
    const KEY = "platform_llmd_simple_state_v612";
    const persisted = (() => { try { return JSON.parse(window.localStorage.getItem(KEY) || "{}"); } catch (_) { return {}; } })();
    const hpDefault = {
      guidellm: {
        profile: "sweep", max_seconds: "60", prompt_tokens: "256", output_tokens: "128",
        num_prompts: "200", rate: "inf", max_concurrency: ""
      },
      vllm: { tp: "", vllm_port: "9001", gpu_memory_utilization: "0.95", max_model_len: "4096", extra_args: "", extra_docker_args: "" },
      prefill: { tp: "", pp: "", num_instances: "1", gpu_memory_utilization: "0.95", max_model_len: "4096", extra_args: "", extra_docker_args: "" },
      decode: { tp: "", pp: "", num_instances: "1", gpu_memory_utilization: "0.95", max_model_len: "4096", extra_args: "", extra_docker_args: "" },
      llmd: { namespace: "default", endpoint_mode: "", target: "", proxy_url: "", deploy_image: "", tp: "", max_model_len: "4096", extra_args: "" },
    };
    const normalizeHp = (x) => {
      x = x || {};
      const oldCommon = x.common || {};
      const oldServe = x.serve || {};
      return {
        guidellm: { ...hpDefault.guidellm, ...oldCommon, ...(x.guidellm || {}) },
        vllm: { ...hpDefault.vllm, ...oldServe, ...(x.vllm || {}) },
        prefill: { ...hpDefault.prefill, ...(x.prefill || {}) },
        decode: { ...hpDefault.decode, ...(x.decode || {}) },
        llmd: { ...hpDefault.llmd, ...(x.llmd || {}) },
      };
    };
    const [envMode, setEnvMode] = useState(persisted.envMode || "bare");
    const [pdEnabled, setPdEnabled] = useState(!!persisted.pdEnabled);
    const [serveNodeMode, setServeNodeMode] = useState(persisted.serveNodeMode || "single");
    const [modelPath, setModelPath] = useState(persisted.modelPath || "/models/Qwen3-32B");
    const [serveNodes, setServeNodes] = useState(persisted.serveNodes || [{ host: "gpu-node05", gpus: 4 }]);
    const [prefillNodes, setPrefillNodes] = useState(persisted.prefillNodes || [{ host: "gpu-node05", gpus: 4 }]);
    const [decodeNodes, setDecodeNodes] = useState(persisted.decodeNodes || [{ host: "gpu-node06", gpus: 4 }]);
    const [hp, setHp] = useState(normalizeHp(persisted.hp));
    const [hpDraft, setHpDraft] = useState(hp);
    const [showHp, setShowHp] = useState(false);
    const [gpuSelection, setGpuSelection] = useState(persisted.gpuSelection || {});
    const [gpuSelectionDraft, setGpuSelectionDraft] = useState(gpuSelection);
    const [pdPrefillInstances, setPdPrefillInstances] = useState(persisted.pdPrefillInstances || []);
    const [pdDecodeInstances, setPdDecodeInstances] = useState(persisted.pdDecodeInstances || []);
    const [pdPrefillInstancesDraft, setPdPrefillInstancesDraft] = useState(pdPrefillInstances);
    const [pdDecodeInstancesDraft, setPdDecodeInstancesDraft] = useState(pdDecodeInstances);
    const [pdProxyPort, setPdProxyPort] = useState(persisted.pdProxyPort || "8192");
    const [pdProxyPortDraft, setPdProxyPortDraft] = useState(pdProxyPort);
    const [hostArgs, setHostArgs] = useState(persisted.hostArgs || {});
    const [hostArgsDraft, setHostArgsDraft] = useState(hostArgs);
    const [error, setError] = useState("");
    const Field = BenchField;

    useEffect(() => {
      const snap = { envMode, pdEnabled, serveNodeMode, modelPath, serveNodes, prefillNodes, decodeNodes, hp, gpuSelection, pdPrefillInstances, pdDecodeInstances, pdProxyPort };
      try { window.localStorage.setItem(KEY, JSON.stringify(snap)); } catch (_) {}
    }, [envMode, pdEnabled, serveNodeMode, modelPath, serveNodes, prefillNodes, decodeNodes, hp, gpuSelection, pdPrefillInstances, pdDecodeInstances, pdProxyPort]);

    const cleanNodes = (arr) => (arr || [])
      .map((n) => {
        if (typeof n === "string") return { host: n.trim(), gpus: 0 };
        return { host: String(n?.host || "").trim(), gpus: Number(n?.gpus || 0) };
      })
      .filter((n) => n.host && !/^\d+$/.test(n.host) && n.gpus > 0);
    const ensurePdInstances = (role, nodes, count, current, basePort, opts = {}) => {
      const ns = cleanNodes(nodes);
      const c = Math.max(1, Number(count || 1));
      const prev = Array.isArray(current) ? current : [];
      const forceNodeDefaults = !!opts.forceNodeDefaults;
      const out = [];
      for (let i = 0; i < c; i++) {
        const prevItem = prev[i] || {};
        const host = prevItem.host || ns[i % Math.max(1, ns.length)]?.host || "";
        const cap = Number(ns.find((n) => n.host === host)?.gpus || ns[0]?.gpus || 1);
        const defaultNum = String(Math.max(1, Math.floor(cap / Math.max(1, c / Math.max(1, ns.length)))) || 1);
        const prevNum = String(prevItem.num_gpus || "").trim();
        const prevNumValue = Number(prevNum);
        const prevTp = String(prevItem.tp || "").trim();
        const prevCuda = normalizeGpuSelectionText(prevItem.cuda_visible_devices || "");
        const prevCudaCount = gpuSelectionList(prevCuda).length;
        const preservePrevNum = prevNum && Number.isFinite(prevNumValue) && prevNumValue > 0 && prevNumValue <= cap;
        const numGpus = forceNodeDefaults ? defaultNum : (preservePrevNum ? prevNum : defaultNum);
        const normalizedNum = Math.max(1, Number(numGpus || defaultNum));
        out.push({
          host,
          num_gpus: String(normalizedNum),
          tp: forceNodeDefaults ? String(normalizedNum) : (prevTp || String(normalizedNum)),
          cuda_visible_devices: (!forceNodeDefaults && prevCuda && prevCudaCount === normalizedNum) ? prevCuda : cudaListForGpuCount(normalizedNum),
          gpu_memory_utilization: String(prevItem.gpu_memory_utilization || "0.95"),
          max_model_len: String(prevItem.max_model_len || "16384"),
          port: String(prevItem.port || (basePort + i)),
        });
      }
      return out;
    };
    const serializePdSpecs = (items, common = {}) => (items || [])
      .map((x) => [
        x.host,
        x.num_gpus,
        x.tp,
        normalizeGpuSelectionText(x.cuda_visible_devices || ""),
        common.gpu_memory_utilization || x.gpu_memory_utilization || "0.95",
        common.max_model_len || x.max_model_len || "16384",
        x.port,
      ].map((v) => String(v ?? "").replace(/[|^]/g, "").trim()).join("^"))
      .join("|");
    const validatePdInstanceSpecs = (label, specs, nodes) => {
      const caps = Object.fromEntries(cleanNodes(nodes).map((n) => [n.host, Number(n.gpus || 0)]));
      const used = {};
      for (const [idx, spec] of (specs || []).entries()) {
        if (!spec.host || !caps[spec.host]) return `${label} instance #${idx + 1}: hostname을 선택하세요.`;
        const ng = Math.max(1, Number(spec.num_gpus || 1));
        used[spec.host] = (used[spec.host] || 0) + ng;
        const ids = gpuSelectionList(spec.cuda_visible_devices);
        if (spec.cuda_visible_devices && ids.length !== ng) return `${label} instance #${idx + 1}: NUM_GPUS=${ng}이지만 CUDA_VISIBLE_DEVICES는 ${ids.length}개입니다.`;
      }
      for (const [h, n] of Object.entries(used)) {
        if (n > caps[h]) return `${label}: ${h}에서 요청한 instance GPU 합(${n})이 GPU 노드 설정(${caps[h]})을 초과합니다.`;
      }
      return "";
    };

    const modelNameFromPath = (path) => {
      const parts = String(path || "").split("/").filter(Boolean);
      return parts[parts.length - 1] || String(path || "model");
    };
    const num = (v, fallback) => {
      const n = Number(v);
      return Number.isFinite(n) && String(v).trim() !== "" ? n : fallback;
    };
    const text = (v) => String(v ?? "").trim();
    const nodesForMode = () => pdEnabled ? [...cleanNodes(prefillNodes), ...cleanNodes(decodeNodes)] : cleanNodes(serveNodes);
    const totalGpusForMode = () => nodesForMode().reduce((acc, n) => acc + Number(n.gpus || 0), 0);
    const firstGpuCount = (arr) => Number((arr && arr[0]?.gpus) || 1);
    const maxGpuCount = (arr) => Math.max(1, ...(arr || []).map((n) => Number(n.gpus || 0)).filter((n) => n > 0));
    const cudaListForGpuCount = (count) => Array.from({ length: Math.max(1, Number(count || 1)) }, (_, i) => i).join(",");
    const reconcileCudaMapForNodes = (current, nodes) => {
      const out = {};
      cleanNodes(nodes).forEach((n) => {
        const cur = normalizeGpuSelectionText(current?.[n.host]);
        const curIds = gpuSelectionList(cur);
        out[n.host] = cur && curIds.length === Number(n.gpus || 1) ? cur : cudaListForGpuCount(n.gpus);
      });
      return out;
    };
    const derivedSingleTp = () => String(num(hp.vllm?.tp, Math.max(1, serveNodeMode === "single" ? maxGpuCount(cleanNodes(serveNodes)) : totalGpusForMode() || firstGpuCount(cleanNodes(serveNodes)))));
    const derivedPrefillTp = () => String(num(hp.prefill?.tp, Math.max(1, maxGpuCount(cleanNodes(prefillNodes)))));
    const derivedDecodeTp = () => String(num(hp.decode?.tp, Math.max(1, maxGpuCount(cleanNodes(decodeNodes)))));
    const derivedLlmdTp = () => String(num(hp.llmd?.tp, Math.max(1, totalGpusForMode() || 1)));
    const applyDerivedDefaults = (base) => {
      const n = normalizeHp(base);
      if (!text(n.vllm.tp)) n.vllm.tp = String(Math.max(1, totalGpusForMode() || firstGpuCount(cleanNodes(serveNodes))));
      if (!text(n.vllm.vllm_port)) n.vllm.vllm_port = "9001";
      if (!text(n.prefill.tp)) n.prefill.tp = String(Math.max(1, maxGpuCount(cleanNodes(prefillNodes))));
      if (!text(n.decode.tp)) n.decode.tp = String(Math.max(1, maxGpuCount(cleanNodes(decodeNodes))));
      if (!text(n.llmd.tp)) n.llmd.tp = String(Math.max(1, totalGpusForMode() || 1));
      return n;
    };

    const replaceNodeState = (setter, updater, after) => {
      setter((prev) => {
        const prevList = Array.isArray(prev) ? prev : [];
        const nextList = typeof updater === "function" ? updater(prevList) : updater;
        const cleanNext = Array.isArray(nextList) ? nextList : [];
        if (after) after(prevList, cleanNext);
        return cleanNext;
      });
    };

    const updateSingleServeNodes = (updater) => {
      replaceNodeState(setServeNodes, updater, (oldNodes, newNodes) => {
        const oldDefault = String(Math.max(1, serveNodeMode === "single" ? maxGpuCount(cleanNodes(oldNodes)) : cleanNodes(oldNodes).reduce((acc, n) => acc + Number(n.gpus || 0), 0) || firstGpuCount(cleanNodes(oldNodes))));
        const newDefault = String(Math.max(1, serveNodeMode === "single" ? maxGpuCount(cleanNodes(newNodes)) : cleanNodes(newNodes).reduce((acc, n) => acc + Number(n.gpus || 0), 0) || firstGpuCount(cleanNodes(newNodes))));
        setHp((prev) => {
          const cur = normalizeHp(prev);
          const oldTp = text(cur.vllm?.tp);
          if (!oldTp || oldTp === oldDefault) cur.vllm.tp = newDefault;
          return cur;
        });
        setHpDraft((prev) => {
          const cur = normalizeHp(prev);
          const oldTp = text(cur.vllm?.tp);
          if (!oldTp || oldTp === oldDefault) cur.vllm.tp = newDefault;
          return cur;
        });
        setGpuSelection((prev) => reconcileCudaMapForNodes(prev, newNodes));
        setGpuSelectionDraft((prev) => reconcileCudaMapForNodes(prev, newNodes));
      });
    };

    const updatePdRoleNodes = (role, setter, updater, instanceSetter, draftSetter, basePort) => {
      replaceNodeState(setter, updater, (oldNodes, newNodes) => {
        const oldDefault = String(Math.max(1, maxGpuCount(cleanNodes(oldNodes))));
        const newDefault = String(Math.max(1, maxGpuCount(cleanNodes(newNodes))));
        setHp((prev) => {
          const cur = normalizeHp(prev);
          const oldTp = text(cur[role]?.tp);
          if (!oldTp || oldTp === oldDefault) cur[role].tp = newDefault;
          return cur;
        });
        setHpDraft((prev) => {
          const cur = normalizeHp(prev);
          const oldTp = text(cur[role]?.tp);
          if (!oldTp || oldTp === oldDefault) cur[role].tp = newDefault;
          return cur;
        });
        instanceSetter((prev) => ensurePdInstances(role, newNodes, (role === "prefill" ? hp.prefill?.num_instances : hp.decode?.num_instances) || 1, prev, basePort, { forceNodeDefaults: true }));
        draftSetter((prev) => ensurePdInstances(role, newNodes, (role === "prefill" ? hpDraft.prefill?.num_instances : hpDraft.decode?.num_instances) || 1, prev, basePort, { forceNodeDefaults: true }));
      });
    };
    const openHpModal = async () => {
      const nextHp = applyDerivedDefaults(hp);
      setHpDraft(nextHp);
      setPdPrefillInstancesDraft(ensurePdInstances("prefill", prefillNodes, nextHp.prefill?.num_instances || 1, pdPrefillInstances, 8100));
      setPdDecodeInstancesDraft(ensurePdInstances("decode", decodeNodes, nextHp.decode?.num_instances || 1, pdDecodeInstances, 8200));
      setPdProxyPortDraft(pdProxyPort || "8192");
      try {
        setGpuSelectionDraft(envMode === "bare" ? await prefillBareMetalGpuMap(nodesForMode(), gpuSelection) : {});
        setShowHp(true);
      } catch (e) { setError(String(e.message || e)); }
    };

    const submit = async () => {
      setError("");
      const path = text(modelPath);
      if (!path) { setError("model path를 입력하세요."); return; }
      const model = modelNameFromPath(path);
      const mode = pdEnabled ? "pd" : "serve";
      const pNodes = cleanNodes(prefillNodes);
      const dNodes = cleanNodes(decodeNodes);
      const sNodes = cleanNodes(serveNodes);
      if (!pdEnabled && !sNodes.length) { setError("Single Instance 노드를 1개 이상 추가하세요."); return; }
      if (pdEnabled && (!pNodes.length || !dNodes.length)) { setError("Prefill/Decode 노드를 각각 1개 이상 추가하세요."); return; }
      let activePrefillSpecs = pdPrefillInstances;
      let activeDecodeSpecs = pdDecodeInstances;
      if (pdEnabled) {
        activePrefillSpecs = ensurePdInstances("prefill", pNodes, hp.prefill?.num_instances || 1, pdPrefillInstances, 8100);
        activeDecodeSpecs = ensurePdInstances("decode", dNodes, hp.decode?.num_instances || 1, pdDecodeInstances, 8200);
        const pfErr = validatePdInstanceSpecs("Prefill", activePrefillSpecs, pNodes);
        const dcErr = validatePdInstanceSpecs("Decode", activeDecodeSpecs, dNodes);
        if (pfErr || dcErr) { setError(pfErr || dcErr); return; }
      }
      const hosts = pdEnabled
        ? Array.from(new Set([...pNodes.map((n) => n.host), ...dNodes.map((n) => n.host)]))
        : Array.from(new Set(sNodes.map((n) => n.host)));
      const node_gpu_map = Object.fromEntries(hosts.map((h) => [h, "H100"]));
      const firstServe = sNodes[0] || dNodes[0] || pNodes[0];
      const g = hp.guidellm || {};
      const v = hp.vllm || {};
      const pf = hp.prefill || {};
      const dc = hp.decode || {};
      const ld = hp.llmd || {};
      const guide = {
        ...(envMode === "k8s" ? { profile: text(g.profile) || "sweep" } : {}),
        max_seconds: num(g.max_seconds, 60),
        prompt_tokens: num(g.prompt_tokens, 256),
        output_tokens: num(g.output_tokens, 128),
        num_prompts: num(g.num_prompts, 200),
        request_rate: text(g.rate) || "inf",
        ...(text(g.rate) && text(g.rate) !== "inf" ? { rate: text(g.rate) } : {}),
        ...(text(g.max_concurrency) ? { max_concurrency: num(g.max_concurrency, undefined) } : {}),
      };

      let kind = "llmd_bench";
      let params = {
        mode,
        model,
        processor: path,
        model_path: path,
        namespace: text(ld.namespace) || "default",
        endpoint_mode: text(ld.endpoint_mode) || (pdEnabled ? "service" : "deploy"),
        ...(text(ld.target) ? { target: text(ld.target) } : {}),
        ...(text(ld.proxy_url) ? { proxy_url: text(ld.proxy_url) } : {}),
        ...(text(ld.deploy_image) ? { deploy_image: text(ld.deploy_image) } : {}),
        ...(text(ld.extra_args) ? { extra_args: text(ld.extra_args) } : {}),
        ...guide,
        ...(pdEnabled ? {} : { deploy_node: firstServe.host, gpu_count: Number(firstServe.gpus || 1) }),
        tp: num(ld.tp, Math.max(1, totalGpusForMode() || 1)),
        max_model_len: num(ld.max_model_len, 4096),
        serve_nodes: sNodes,
        prefill_hosts: pNodes.map((n) => n.host),
        decode_hosts: dNodes.map((n) => n.host),
        prefill_gpu_counts: Object.fromEntries(pNodes.map((n) => [n.host, n.gpus])),
        decode_gpu_counts: Object.fromEntries(dNodes.map((n) => [n.host, n.gpus])),
        prefill_params: pf,
        decode_params: dc,
        common_params: g,
        llmd_params: ld,
        runtime_env: envMode,
        args: {},
      };
      if (envMode === "bare") {
        kind = pdEnabled ? "pd_bench" : "vllm_bench";
        params = {
          ...params,
          engine: "vllm",
          bench_data: "random",
          model,
          model_path: path,
          mode: pdEnabled ? "pd" : serveNodeMode,
          node_mode: pdEnabled ? "pd" : serveNodeMode,
          bmt_host: firstServe?.host,
          num_prompts: num(g.num_prompts, 200),
          request_rate: text(g.rate) || "inf",
          input_len: num(g.prompt_tokens, 256),
          output_len: num(g.output_tokens, 128),
          max_model_len: pdEnabled ? num(dc.max_model_len || pf.max_model_len, 4096) : num(v.max_model_len, 4096),
          ...(text(g.max_concurrency) ? { max_concurrency: num(g.max_concurrency, undefined) } : {}),
          ...(pdEnabled ? {
            prefill_tp: text(pf.tp) ? num(pf.tp, maxGpuCount(pNodes)) : undefined,
            decode_tp: text(dc.tp) ? num(dc.tp, maxGpuCount(dNodes)) : undefined,
            prefill_instances: activePrefillSpecs.length,
            decode_instances: activeDecodeSpecs.length,
            prefill_instance_specs: serializePdSpecs(activePrefillSpecs, pf),
            decode_instance_specs: serializePdSpecs(activeDecodeSpecs, dc),
            proxy_port: num(pdProxyPort, 8192),
            prefill_extra_args: text(pf.extra_args),
            decode_extra_args: text(dc.extra_args),
            prefill_extra_docker_args: text(pf.extra_docker_args),
            decode_extra_docker_args: text(dc.extra_docker_args),
          } : {
            ...(text(v.tp) ? { tp: num(v.tp, Math.max(1, totalGpusForMode() || 1)) } : {}),
            vllm_port: num(v.vllm_port, 9001),
            gpu_memory_utilization: text(v.gpu_memory_utilization) || undefined,
            extra_args: text(v.extra_args),
            extra_docker_args: text(v.extra_docker_args),
          }),
        };
        // Bare Metal vLLM/PD scripts do not accept llm-d-only common extra-arg bucket.
        delete params.common_extra_args;
      }
      try {
        if (envMode === "bare") {
          params.selected_gpus_by_host = await resolveBareMetalGpuMap(pdEnabled ? [...pNodes, ...dNodes] : sNodes, gpuSelection);
        }
        await onStart({ kind, suite: "inference", version: envMode === "bare" ? "vllm_bare" : "guidellm_llmd", gpu_type: "H100", hosts, node_gpu_map, dry_run: false, params });
      } catch (e) { setError(String(e.message || e)); }
    };

    const activeNodes = nodesForMode();
    const totalGpus = activeNodes.reduce((acc, n) => acc + Number(n.gpus || 0), 0);
    const entries = (obj, keys) => (keys || Object.keys(obj || {}))
      .map((k) => [k, obj?.[k]])
      .filter(([k, v]) => v !== undefined && v !== null && String(v).trim() !== "");
    const pretty = (items, dict = {}) => items.map(([k, v]) => [dict[k] || k, v]);
    const guideLabel = {
      profile: "Profile", max_seconds: "Max seconds", prompt_tokens: "Prompt tokens",
      output_tokens: "Output tokens", num_prompts: "Num prompts", rate: "Request rate",
      max_concurrency: "Max concurrency"
    };
    const vllmLabel = {
      tp: "Tensor parallel", vllm_port: "Port", gpu_memory_utilization: "GPU memory util", max_model_len: "Max model len", extra_args: "Extra args", extra_docker_args: "Extra docker args",
      pp: "Pipeline parallel", num_instances: "Num instances"
    };
    const llmdLabel = {
      namespace: "Namespace", endpoint_mode: "Endpoint mode", target: "Target URL", proxy_url: "Proxy URL",
      deploy_image: "Deploy image", tp: "Tensor parallel", max_model_len: "Max model len", extra_args: "Extra args"
    };
    const hpGroups = () => {
      const g = hp.guidellm || {};
      const guideKeys = envMode === "k8s"
        ? ["profile", "max_seconds", "prompt_tokens", "output_tokens", "num_prompts", "rate", "max_concurrency"]
        : ["max_seconds", "prompt_tokens", "output_tokens", "num_prompts", "rate", "max_concurrency"];
      if (envMode === "k8s") {
        const ld = { ...(hp.llmd || {}), tp: text(hp.llmd?.tp) || derivedLlmdTp() };
        return [
          { title: "llm-d", items: pretty(entries(ld, ["namespace", "endpoint_mode", "target", "proxy_url", "deploy_image", "tp", "max_model_len", "extra_args"]), llmdLabel) },
          { title: "GuideLLM", items: pretty(entries(g, guideKeys), guideLabel) },
        ];
      }
      const gpuItems = envMode === "bare"
        ? Object.entries(cleanGpuSelectionMap(gpuSelection, nodesForMode().map((n) => n.host))).map(([host, v]) => [`CUDA_VISIBLE_DEVICES · ${host}`, v])
        : [];
      if (!pdEnabled) {
        const v = { ...(hp.vllm || {}), tp: text(hp.vllm?.tp) || derivedSingleTp(), vllm_port: text(hp.vllm?.vllm_port) || "9001" };
        return [
          { title: "vLLM Serve", items: pretty(entries(v, ["tp", "vllm_port", "gpu_memory_utilization", "max_model_len", "extra_args", "extra_docker_args"]), vllmLabel) },
          ...(gpuItems.length ? [{ title: "GPU Binding", items: gpuItems }] : []),
          { title: "GuideLLM", items: pretty(entries(g, guideKeys), guideLabel) },
        ];
      }
      const pf = { ...(hp.prefill || {}), tp: text(hp.prefill?.tp) || derivedPrefillTp() };
      const dc = { ...(hp.decode || {}), tp: text(hp.decode?.tp) || derivedDecodeTp() };
      return [
        { title: "Prefill Common", items: pretty(entries(pf, ["num_instances", "gpu_memory_utilization", "max_model_len", "extra_args", "extra_docker_args"]), vllmLabel) },
        { title: "Decode Common", items: pretty(entries(dc, ["num_instances", "gpu_memory_utilization", "max_model_len", "extra_args", "extra_docker_args"]), vllmLabel) },
        ...(gpuItems.length ? [{ title: "GPU Binding", items: gpuItems }] : []),
        { title: "GuideLLM", items: pretty(entries(g, guideKeys), guideLabel) },
      ];
    };

    const GuideFields = ({ value, onChange, includeProfile = false }) => (
      <div className="rounded-xl border border-line bg-ink-950/30 p-3 space-y-3">
        <div className="label-mono">GuideLLM</div>
        <div className="grid grid-cols-2 gap-3">
          {includeProfile && <Field label="Profile"><select className="inp" value={value.profile || "sweep"} onChange={(e) => onChange({ ...value, profile: e.target.value })}>{["sweep", "synchronous", "throughput", "concurrent", "constant", "poisson"].map((v) => <option key={v} value={v}>{v}</option>)}</select></Field>}
          <Field label="Max seconds"><NumberStepperInput min={1} value={value.max_seconds || ""} onChange={(v) => onChange({ ...value, max_seconds: v })} /></Field>
          <Field label="Prompt tokens"><NumberStepperInput min={1} value={value.prompt_tokens || ""} onChange={(v) => onChange({ ...value, prompt_tokens: v })} /></Field>
          <Field label="Output tokens"><NumberStepperInput min={1} value={value.output_tokens || ""} onChange={(v) => onChange({ ...value, output_tokens: v })} /></Field>
          <Field label="Num prompts"><NumberStepperInput min={1} value={value.num_prompts || ""} onChange={(v) => onChange({ ...value, num_prompts: v })} /></Field>
          <Field label="Request rate"><input className="inp" value={value.rate || ""} onChange={(e) => onChange({ ...value, rate: e.target.value })} placeholder="inf" /></Field>
          <Field label="Max concurrency"><NumberStepperInput min={1} value={value.max_concurrency || ""} onChange={(v) => onChange({ ...value, max_concurrency: v })} placeholder="optional" /></Field>
        </div>
      </div>
    );
    const renderVllmServeFields = (value, onChange, children) => (
      <div className="rounded-xl border border-line bg-ink-950/30 p-3 space-y-3">
        <div className="label-mono">vLLM Serve</div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Tensor parallel"><NumberStepperInput min={1} value={value.tp || ""} onChange={(v) => onChange({ ...value, tp: v })} /></Field>
          <Field label="Port"><NumberStepperInput min={1} value={value.vllm_port || "9001"} onChange={(v) => onChange({ ...value, vllm_port: v })} /></Field>
          <Field label="gpu-memory-utilization"><input className="inp" value={value.gpu_memory_utilization || "0.95"} onChange={(e) => onChange({ ...value, gpu_memory_utilization: e.target.value })} /></Field>
          <Field label="max-model-len"><NumberStepperInput min={64} value={value.max_model_len || ""} onChange={(v) => onChange({ ...value, max_model_len: v })} /></Field>
          <Field label="Extra args"><input className="inp" value={value.extra_args || ""} onChange={(e) => onChange({ ...value, extra_args: e.target.value })} placeholder="vllm serve args" /></Field>
          <Field label="Extra docker args"><input className="inp" value={value.extra_docker_args || ""} onChange={(e) => onChange({ ...value, extra_docker_args: e.target.value })} placeholder="-v /path:/path:ro -e KEY=value" /></Field>
        </div>
        {children}
      </div>
    );
    const renderPdCommonFields = (title, value, onChange) => (
      <div className="rounded-xl border border-line bg-ink-950/30 p-3 space-y-3">
        <div className="label-mono">{title}</div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="gpu-memory-utilization"><input className="inp" value={value.gpu_memory_utilization || "0.95"} onChange={(e) => onChange({ ...value, gpu_memory_utilization: e.target.value })} /></Field>
          <Field label="max-model-len"><NumberStepperInput min={64} value={value.max_model_len || "16384"} onChange={(v) => onChange({ ...value, max_model_len: v })} /></Field>
          <Field label="Extra args"><input className="inp" value={value.extra_args || ""} onChange={(e) => onChange({ ...value, extra_args: e.target.value })} placeholder="vllm serve args" /></Field>
          <Field label="Extra docker args"><input className="inp" value={value.extra_docker_args || ""} onChange={(e) => onChange({ ...value, extra_docker_args: e.target.value })} placeholder="-v /path:/path:ro -e KEY=value" /></Field>
        </div>
      </div>
    );
    const renderPdInstanceFields = (role, nodes, value, onChange, basePort) => {
      const list = Array.isArray(value) ? value : [];
      const nodeList = cleanNodes(nodes);
      const patch = (idx, patchObj) => onChange(list.map((x, i) => i === idx ? { ...x, ...patchObj } : x));
      return (
        <div className="rounded-xl border border-line bg-ink-950/30 p-3 space-y-3">
          <div className="label-mono">{role} instances</div>
          <div className="space-y-3">
            {list.map((inst, idx) => (
              <div key={`${role}_${idx}`} className="rounded-lg border border-line/70 bg-ink-900/40 p-3">
                <div className="text-[11px] font-mono text-fog-300 mb-2">{role} instance #{idx + 1}</div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                  <Field label="hostname"><select className="inp" value={inst.host || ""} onChange={(e) => patch(idx, { host: e.target.value })}>{nodeList.map((n) => <option key={n.host} value={n.host}>{n.host}</option>)}</select></Field>
                  <Field label="NUM_GPUS"><NumberStepperInput min={1} value={inst.num_gpus || "1"} onChange={(v) => patch(idx, { num_gpus: v })} /></Field>
                  <Field label="TP"><NumberStepperInput min={1} value={inst.tp || inst.num_gpus || "1"} onChange={(v) => patch(idx, { tp: v })} /></Field>
                  <Field label="CUDA_VISIBLE_DEVICES"><input className="inp font-mono" value={inst.cuda_visible_devices || ""} onChange={(e) => patch(idx, { cuda_visible_devices: e.target.value })} onBlur={(e) => patch(idx, { cuda_visible_devices: normalizeGpuSelectionText(e.target.value) })} placeholder="예: 4,5" /></Field>
                  <Field label="Port"><NumberStepperInput min={1} value={inst.port || String(basePort + idx)} onChange={(v) => patch(idx, { port: v })} /></Field>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };
    
    const LlmdFields = ({ value, onChange }) => (
      <div className="rounded-xl border border-line bg-ink-950/30 p-3 space-y-3">
        <div className="label-mono">llm-d</div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Namespace"><input className="inp" value={value.namespace || ""} onChange={(e) => onChange({ ...value, namespace: e.target.value })} placeholder="default" /></Field>
          <Field label="Endpoint mode"><select className="inp" value={value.endpoint_mode || ""} onChange={(e) => onChange({ ...value, endpoint_mode: e.target.value })}>{["", "deploy", "service", "pod", "proxy", "manual"].map((v) => <option key={v} value={v}>{v || (pdEnabled ? "auto: service" : "auto: deploy")}</option>)}</select></Field>
          <Field label="Tensor parallel"><NumberStepperInput min={1} value={value.tp || ""} onChange={(v) => onChange({ ...value, tp: v })} /></Field>
          <Field label="Max model len"><NumberStepperInput min={64} value={value.max_model_len || ""} onChange={(v) => onChange({ ...value, max_model_len: v })} /></Field>
          <Field label="Target URL"><input className="inp" value={value.target || ""} onChange={(e) => onChange({ ...value, target: e.target.value })} placeholder="manual mode only" /></Field>
          <Field label="Proxy URL"><input className="inp" value={value.proxy_url || ""} onChange={(e) => onChange({ ...value, proxy_url: e.target.value })} placeholder="proxy mode only" /></Field>
          <Field label="Deploy image"><input className="inp" value={value.deploy_image || ""} onChange={(e) => onChange({ ...value, deploy_image: e.target.value })} placeholder="optional" /></Field>
          <Field label="Extra args"><input className="inp" value={value.extra_args || ""} onChange={(e) => onChange({ ...value, extra_args: e.target.value })} placeholder="optional" /></Field>
        </div>
      </div>
    );

    return (
      <div className="space-y-4">
        <div className="config-stage-head config-stage-head-run">
          <ConfigStageTitle />
          <div className="basic-settings-inline basic-settings-inference run-inline test-kind-selector">
            <BenchField label="model">
              <input className="inp font-mono" value={modelPath} onChange={(e) => setModelPath(e.target.value)} spellCheck={false} placeholder="/models/Qwen3-32B" />
            </BenchField>
            <EnvSelector value={envMode} onChange={setEnvMode} />
            <BenchField label="mode">
              <div className="mode-switch mode-switch-inline">
                <button type="button" className={!pdEnabled ? "active" : ""} onClick={() => setPdEnabled(false)}>Single Instance</button>
                <button type="button" className={pdEnabled ? "active" : ""} onClick={() => setPdEnabled(true)}>PD Disaggregation</button>
              </div>
            </BenchField>
            <button className="btn-neon run-main-button" onClick={submit} disabled={busy}>
              {!busy && <Icon name="play" className="w-4 h-4" />}{busy ? "시작 중…" : "Run Inference"}
            </button>
          </div>
        </div>

        <div className="config-main-grid">
          <div className="control-card node-zone">
            <div className="control-title with-mode"><span><span className="sec-ico"><Icon name="nodes" /></span>GPU 노드 설정{envMode === "k8s" && <InfoTip text="테스트 클러스터 관리 탭에서 Warewulf 클러스터에 추가되었는지, K8s worker node로 추가되었는지 확인하세요." />}</span>{!pdEnabled && envMode === "bare" && <div className="node-mode-switch"><button className={serveNodeMode === "single" ? "active" : ""} onClick={() => setServeNodeMode("single")}>Single-node</button><button className={serveNodeMode === "multi" ? "active" : ""} onClick={() => setServeNodeMode("multi")}>Multi-node</button></div>}</div>
            {!pdEnabled ? (
              <NodeAdder title="Inference nodes" nodes={serveNodes} setNodes={updateSingleServeNodes} defaultGpus={4} showClusterStatus={envMode === "k8s"} />
            ) : (
              <div className="pd-node-grid">
                <div className="pd-node-section pd-prefill">
                  <NodeAdder title="Prefill nodes" nodes={prefillNodes} setNodes={(updater) => updatePdRoleNodes("prefill", setPrefillNodes, updater, setPdPrefillInstances, setPdPrefillInstancesDraft, 8100)} defaultGpus={4} showClusterStatus={envMode === "k8s"} />
                </div>
                <div className="pd-node-section pd-decode">
                  <NodeAdder title="Decode nodes" nodes={decodeNodes} setNodes={(updater) => updatePdRoleNodes("decode", setDecodeNodes, updater, setPdDecodeInstances, setPdDecodeInstancesDraft, 8200)} defaultGpus={4} showClusterStatus={envMode === "k8s"} />
                </div>
              </div>
            )}
          </div>

          <div className="control-card is-hp hp-zone">
            <div className="control-title"><span className="sec-ico"><Icon name="settings" /></span>Hyperparameters 설정</div>
            <div className="flex-1 min-h-0 overflow-auto pr-1 hp-group-stack">
              {hpGroups().map((g) => (
                <div key={g.title} className="hp-group-block">
                  <div className="hp-group-title">{g.title}</div>
                  <HpKeyValueGrid items={g.items} />
                </div>
              ))}
            </div>
            <button className="btn-param mt-auto" onClick={openHpModal}>
              <Icon name="settings" className="w-4 h-4" /> 세부 파라미터 수정
            </button>
          </div>
        </div>

        {error && <div className="text-[12.5px] px-3 py-2 rounded-lg border border-err/30 bg-err/10 text-err">{error}</div>}

        {showHp && (
          <ModalShell title="Inference 세부 파라미터"
            onClose={() => setShowHp(false)}
            onClear={() => { setHpDraft(applyDerivedDefaults(hpDefault)); setGpuSelectionDraft({}); }}
            onSave={() => { setHp(normalizeHp(hpDraft)); setGpuSelection(cleanGpuSelectionMap(gpuSelectionDraft, nodesForMode().map((n) => n.host))); setPdPrefillInstances(pdPrefillInstancesDraft); setPdDecodeInstances(pdDecodeInstancesDraft); setPdProxyPort(pdProxyPortDraft || "8192"); setShowHp(false); }}>
            <div className="space-y-4">
              {envMode === "k8s" ? (
                <>
                  <LlmdFields value={hpDraft.llmd || {}} onChange={(v) => setHpDraft({ ...hpDraft, llmd: v })} />
                  <GuideFields value={hpDraft.guidellm || {}} includeProfile onChange={(v) => setHpDraft({ ...hpDraft, guidellm: v })} />
                </>
              ) : !pdEnabled ? (
                <>
                  {renderVllmServeFields(hpDraft.vllm || {}, (v) => setHpDraft({ ...hpDraft, vllm: v }),
                    <GpuSelectionFields nodes={nodesForMode()} value={gpuSelectionDraft} onChange={setGpuSelectionDraft} />
                  )}
                  <GuideFields value={hpDraft.guidellm || {}} onChange={(v) => setHpDraft({ ...hpDraft, guidellm: v })} />
                </>
              ) : (
                <>
                  <div className="rounded-xl border border-line bg-ink-950/30 p-3 space-y-3">
                    <div className="label-mono">PD instance 수</div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <Field label="Prefill instance 수"><NumberStepperInput min={1} value={hpDraft.prefill?.num_instances || "1"} onChange={(v) => { const prefill = { ...(hpDraft.prefill || {}), num_instances: v }; setHpDraft({ ...hpDraft, prefill }); setPdPrefillInstancesDraft(ensurePdInstances("prefill", prefillNodes, v || 1, pdPrefillInstancesDraft, 8100, { forceNodeDefaults: true })); }} /></Field>

  // ---------------------- Training 테스트 (MLPerf on k8s) ----------------------

  function TrainingK8sConfig({ onStart, busy }) {
    const KEY = "platform_training_mlperf_state_v623";
    const persisted = (() => { try { return JSON.parse(window.localStorage.getItem(KEY) || "{}"); } catch (_) { return {}; } })();
    const BENCH = {
      "v4.1": ["llama2_70b_lora"],
      "v5.1": ["llama2_70b_lora", "llama31_8b"],
    };
    const initialVersion = BENCH[persisted.version] ? persisted.version : "v5.1";
    const initialBenchmark = BENCH[initialVersion].includes(persisted.benchmark) ? persisted.benchmark : BENCH[initialVersion][0];
    const [envMode, setEnvMode] = useState(persisted.envMode || "bare");
    const [version, setVersion] = useState(initialVersion);
    const [benchmark, setBenchmark] = useState(initialBenchmark);
    const [nodes, setNodes] = useState(persisted.nodes || [{ host: "gpu-node03", gpus: 8 }]);
    const [nodeMode, setNodeMode] = useState(persisted.nodeMode || "single"); // bare only: single | multi
    const trainingHpDefaults = (gpuCount = 8) => ({
      GPUS_PER_NODE: String(gpuCount), TP: String(gpuCount), PP: "1", CP: "1", MBS: "1", GBS: "128", MAX_SEQLEN: "8192",
      FP8: "False", FP8_HYBRID: "False", TRAINER_PRECISION: "bf16-mixed", MLPERF_MAX_STEPS: "10",
      MLPERF_LIMIT_VAL_BATCHES: "1", MLPERF_VAL_CHECK_INTERVAL: "10", NCCL_DEBUG: ""
    });
    const cleanTrainingHp = (x = {}) => {
      const out = applyTrainingPrecisionSelection({ ...(x || {}) }, trainingPrecisionUiValue(x || {}));
      delete out.NUM_GPUS;
      delete out.MLPERF_NUM_GPUS;
      delete out.MLPERF_TRAINER_PRECISION;
      return out;
    };
    const [hp, setHp] = useState(cleanTrainingHp({ ...trainingHpDefaults(8), ...(persisted.hp || {}) }));
    const [hpDraft, setHpDraft] = useState(hp);
    const [showHp, setShowHp] = useState(false);
    const [extraText, setExtraText] = useState(persisted.extraText || "LR=4e-4");
    const [extraDraft, setExtraDraft] = useState(extraText);
    const [gpuSelection, setGpuSelection] = useState(persisted.gpuSelection || {});
    const [gpuSelectionDraft, setGpuSelectionDraft] = useState(gpuSelection);
    const [hostArgs, setHostArgs] = useState(persisted.hostArgs || {});
    const [hostArgsDraft, setHostArgsDraft] = useState(hostArgs);
    const [error, setError] = useState("");
    const Field = BenchField;

    useEffect(() => {
      const snap = { envMode, version, benchmark, nodes, hp, extraText, gpuSelection, nodeMode, hostArgs };
      try { window.localStorage.setItem(KEY, JSON.stringify(snap)); } catch (_) {}
    }, [envMode, version, benchmark, nodes, hp, extraText, gpuSelection, nodeMode, hostArgs]);

    const cleanNodes = () => (nodes || [])
      .map((n) => ({ host: String(n.host || "").trim(), gpus: Number(n.gpus || 0) }))
      .filter((n) => n.host && n.gpus > 0);

    const totalTrainingGpus = () => Math.max(1, cleanNodes().reduce((acc, n) => acc + Number(n.gpus || 0), 0) || 1);
    const trainingIsMultiNode = () => envMode === "bare" && nodeMode === "multi" && cleanNodes().length > 1;
    const trainingSingleMany = () => envMode === "bare" && nodeMode === "single" && cleanNodes().length > 1;
    const trainingSingleOne = () => envMode !== "bare" || cleanNodes().length <= 1 || nodeMode !== "single";
    const firstNodeGpuCount = () => Math.max(1, Number(cleanNodes()[0]?.gpus || 1));
    const normalizeHostTrainingArgs = (src = hostArgs, gpuMap = gpuSelection) => {
      const out = {};
      cleanNodes().forEach((n) => {
        const cur = src?.[n.host] || {};
        const gpn = String(cur.GPUS_PER_NODE || cur.NUM_GPUS || n.gpus || 1);
        out[n.host] = {
          GPUS_PER_NODE: gpn,
          NUM_GPUS: gpn,
          MLPERF_NUM_GPUS: gpn,
          TP: String(cur.TP || n.gpus || 1),
          PP: String(cur.PP || hp.PP || "1"),
          CP: String(cur.CP || hp.CP || "1"),
        };
        const selected = normalizeGpuSelectionText(gpuMap?.[n.host]);
        if (selected) out[n.host].MLPERF_CUDA_VISIBLE_DEVICES = selected;
      });
      return out;
    };
    const args = () => {
      const out = { ...hp, ...kvTextToObj(extraText) };
      out.PP = String(out.PP || "1");
      out.CP = String(out.CP || "1");
      if (trainingIsMultiNode()) {
        const gpn = Number(out.GPUS_PER_NODE || firstNodeGpuCount());
        const world = Number(out.WORLD_SIZE || totalTrainingGpus());
        out.GPUS_PER_NODE = String(gpn);
        out.WORLD_SIZE = String(world);
        delete out.NUM_GPUS;
        delete out.MLPERF_NUM_GPUS;
        out.TP = String(world);
        out.MLPERF_WORLD_SIZE = String(world);
      } else if (trainingSingleMany()) {
        delete out.NUM_GPUS;
        delete out.MLPERF_NUM_GPUS;
        delete out.TP;
        delete out.CP;
        delete out.PP;
      } else {
        const gpn = String(out.GPUS_PER_NODE || firstNodeGpuCount());
        out.GPUS_PER_NODE = gpn;
        out.NUM_GPUS = gpn;
        out.MLPERF_NUM_GPUS = gpn;
        out.TP = String(out.TP || gpn);
      }
      Object.keys(out).forEach((k) => {
        if (out[k] === undefined || out[k] === null || String(out[k]).trim() === "") delete out[k];
      });
      return out;
    };
    const displayTrainingArgs = () => {
      const labels = {
        MLPERF_MAX_STEPS: "MAX_STEPS",
        MLPERF_VAL_CHECK_INTERVAL: "VAL_CHECK_INTERVAL",
        MLPERF_LIMIT_VAL_BATCHES: "LIMIT_VAL_BATCHES",
        MBS: "MBS (Micro Batch Size)",
        GBS: "GBS (Global Batch Size)",
      };
      const hidden = new Set(["NUM_GPUS", "MLPERF_NUM_GPUS", "FP8", "FP8_HYBRID", "MLPERF_WORLD_SIZE", ...(trainingSingleMany() ? ["GPUS_PER_NODE", "TP", "PP", "CP"] : [])]);
      const runArgs = args();
      const items = Object.entries(runArgs)
        .filter(([k]) => !hidden.has(k))
        .map(([k, v]) => [labels[k] || (k === "TRAINER_PRECISION" ? "Precision" : k), k === "TRAINER_PRECISION" ? trainingPrecisionLabelFromArgs(runArgs) : v]);
      if (envMode === "bare") {
        if (trainingSingleMany()) {
          Object.entries(normalizeHostTrainingArgs()).forEach(([host, hv]) => {
            items.push([`GPUS_PER_NODE · ${host}`, hv.GPUS_PER_NODE || hv.NUM_GPUS]);
            items.push([`TP · ${host}`, hv.TP]);
            items.push([`PP · ${host}`, hv.PP]);
            items.push([`CP · ${host}`, hv.CP]);
            if (hv.MLPERF_CUDA_VISIBLE_DEVICES) items.push([`CUDA_VISIBLE_DEVICES · ${host}`, hv.MLPERF_CUDA_VISIBLE_DEVICES]);
          });
        } else if (trainingIsMultiNode()) {
          items.push(["node mode", "Multi-node"]);
          Object.entries(cleanGpuSelectionMap(gpuSelection, cleanNodes().map((n) => n.host))).forEach(([host, v]) => {
            items.push([`CUDA_VISIBLE_DEVICES · ${host}`, v]);
          });
        } else {
          Object.entries(cleanGpuSelectionMap(gpuSelection, cleanNodes().map((n) => n.host))).forEach(([host, v]) => {
            items.push([`CUDA_VISIBLE_DEVICES · ${host}`, v]);
          });
        }
      }
      return items;
    };
    const openHpModal = async () => {
      const total = totalTrainingGpus();
      const nextHpDraft = cleanTrainingHp({ ...hp, GPUS_PER_NODE: String(hp.GPUS_PER_NODE || firstNodeGpuCount()), WORLD_SIZE: String(total), TP: trainingIsMultiNode() ? String(total) : String(hp.TP || firstNodeGpuCount()), PP: String(hp.PP || "1"), CP: String(hp.CP || "1"), TRAINER_PRECISION: hp.TRAINER_PRECISION || "bf16-mixed", MLPERF_LIMIT_VAL_BATCHES: hp.MLPERF_LIMIT_VAL_BATCHES || "1", MLPERF_MAX_STEPS: hp.MLPERF_MAX_STEPS || "10", MLPERF_VAL_CHECK_INTERVAL: hp.MLPERF_VAL_CHECK_INTERVAL || "10" });
      delete nextHpDraft.NUM_GPUS; delete nextHpDraft.MLPERF_NUM_GPUS;
      setHpDraft(nextHpDraft);
      setHostArgsDraft(normalizeHostTrainingArgs(hostArgs, gpuSelection));
      setExtraDraft(extraText);
      try {
        setGpuSelectionDraft(envMode === "bare" ? await prefillBareMetalGpuMap(cleanNodes(), gpuSelection) : {});
        setShowHp(true);

    const submit = async () => {
      setError("");

      const uniqueHosts = Array.from(new Set(ns.map((n) => n.host)));
      if (uniqueHosts.length !== ns.length) { setError("중복된 GPU 노드가 있습니다."); return; }
      const gpuCounts = Array.from(new Set(ns.map((n) => Number(n.gpus))));
      if ((envMode === "k8s" || trainingIsMultiNode()) && gpuCounts.length !== 1) {
        setError((envMode === "k8s" ? "K8s Training Job" : "Bare Metal Multi-node Training") + "은 모든 노드의 GPU 수량이 같아야 합니다.");

      }
      const hosts = ns.map((n) => n.host);
      const node_gpu_map = Object.fromEntries(hosts.map((h) => [h, "H100"]));
      const base = {
        suite: "training", version, benchmark,
        gpu_type: "H100", hosts, node_gpu_map, dry_run: false,

      try {
        if (envMode === "k8s") {
          await onStart({ ...base, kind: "mlperf_k8s", params: { runtime_env: envMode, gpus_per_node: gpuCounts[0], args: args() } });
        } else {
          const selected = await resolveBareMetalGpuMap(ns, gpuSelection);
          await onStart({ ...base, kind: "mlperf", params: {
            runtime_env: envMode,
            node_mode: trainingIsMultiNode() ? "multi" : "single",
            gpu_counts_by_host: Object.fromEntries(ns.map((n) => [n.host, n.gpus])),
            args: args(),
            args_by_host: normalizeHostTrainingArgs(hostArgs, selected),
            selected_gpus_by_host: selected,
          } });
        }
      } catch (e) { setError(String(e.message || e)); }
    };

    return (
      <div className="space-y-4">
        <div className="config-stage-head config-stage-head-run">
          <ConfigStageTitle />
          <div className="basic-settings-inline basic-settings-training run-inline test-kind-selector">

              <select className="inp" value={version} onChange={(e) => {
                const nextVersion = e.target.value;
                setVersion(nextVersion);
                setBenchmark(BENCH[nextVersion][0]);
              }}>
                {Object.keys(BENCH).map((v) => <option key={v} value={v}>{v}</option>)}
              </select>
            </Field>
            <Field label="model">
              <select className="inp" value={benchmark} onChange={(e) => setBenchmark(e.target.value)}>
                {(BENCH[version] || []).map((b) => <option key={b} value={b}>{b}</option>)}
              </select>
            </Field>
            <EnvSelector value={envMode} onChange={setEnvMode} />
            <button className="btn-neon run-main-button" onClick={submit} disabled={busy}>
              {!busy && <Icon name="play" className="w-4 h-4" />}{busy ? "시작 중…" : "Run Training"}
            </button>
          </div>
        </div>

        <div className="config-main-grid">
          <div className="control-card node-zone">
            <div className="control-title with-mode"><span><span className="sec-ico"><Icon name="nodes" /></span>GPU 노드 설정{envMode === "k8s" && <InfoTip text="테스트 클러스터 관리 탭에서 Warewulf 클러스터에 추가되었는지, K8s worker node로 추가되었는지 확인하세요." />}</span>{envMode === "bare" && <div className="node-mode-switch"><button className={nodeMode === "single" ? "active" : ""} onClick={() => setNodeMode("single")}>Single-node</button><button className={nodeMode === "multi" ? "active" : ""} onClick={() => setNodeMode("multi")}>Multi-node</button></div>}</div>
            <NodeAdder title="Training nodes" nodes={nodes} setNodes={setNodes} defaultGpus={8} showClusterStatus={envMode === "k8s"} />
          </div>

          <div className="control-card is-hp hp-zone">
            <div className="control-title"><span className="sec-ico"><Icon name="settings" /></span>Hyperparameters 설정</div>
            <div className="flex-1 min-h-0 overflow-auto pr-1">
              <HpKeyValueGrid items={displayTrainingArgs()} />
            </div>
            <button className="btn-param mt-auto" onClick={openHpModal}>
              <Icon name="settings" className="w-4 h-4" /> 세부 파라미터 수정
            </button>
          </div>
        </div>

        {error && <div className="text-[12.5px] px-3 py-2 rounded-lg border border-err/30 bg-err/10 text-err">{error}</div>}

        {showHp && (
          <ModalShell title="Training 세부 파라미터"
            onClose={() => setShowHp(false)}
            onClear={() => { const total = totalTrainingGpus(); setHpDraft(cleanTrainingHp(trainingHpDefaults(total))); setExtraDraft("LR=4e-4"); setGpuSelectionDraft({}); }}
            onSave={() => { setHp(cleanTrainingHp(hpDraft)); setExtraText(extraDraft); setHostArgs(normalizeHostTrainingArgs(hostArgsDraft, gpuSelectionDraft)); setGpuSelection(cleanGpuSelectionMap(gpuSelectionDraft, cleanNodes().map((n) => n.host))); setShowHp(false); }}>
            {envMode === "bare" && trainingSingleMany() && (
              <div className="mb-4 rounded-xl border border-line bg-ink-950/30 p-3 space-y-3">
                <div className="label-mono">노드별 파라미터 지정</div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {cleanNodes().map((n) => {
                    const cur = hostArgsDraft?.[n.host] || { GPUS_PER_NODE: String(n.gpus), TP: String(n.gpus), PP: "1", CP: "1" };
                    const selected = gpuSelectionDraft?.[n.host] || cur.MLPERF_CUDA_VISIBLE_DEVICES || "";
                    const patchHost = (patch) => setHostArgsDraft({ ...(hostArgsDraft || {}), [n.host]: { ...cur, ...patch } });
                    const patchGpu = (v) => {
                      setGpuSelectionDraft({ ...(gpuSelectionDraft || {}), [n.host]: v });
                      patchHost({ MLPERF_CUDA_VISIBLE_DEVICES: v });
                    };
                    return <div key={n.host} className="rounded-lg border border-line/70 p-3 bg-ink-900/40">
                      <div className="text-[11px] font-mono text-fog-300 mb-2">{n.host}</div>
                      <div className="grid grid-cols-2 gap-2">
                        <Field label="GPUS_PER_NODE"><NumberStepperInput min={1} value={cur.GPUS_PER_NODE || cur.NUM_GPUS || String(n.gpus)} onChange={(v) => patchHost({ GPUS_PER_NODE: v })} /></Field>
                        <Field label="TP"><NumberStepperInput min={1} value={cur.TP || String(n.gpus)} onChange={(v) => patchHost({ TP: v })} /></Field>
                        <Field label="PP"><NumberStepperInput min={1} value={cur.PP || "1"} onChange={(v) => patchHost({ PP: v })} /></Field>
                        <Field label="CP"><NumberStepperInput min={1} value={cur.CP || "1"} onChange={(v) => patchHost({ CP: v })} /></Field>
                      </div>
                      <div className="mt-2">
                        <GpuSelectionFields nodes={[{ host: n.host, gpus: Number(cur.GPUS_PER_NODE || cur.NUM_GPUS || n.gpus || 1) }]} value={{ [n.host]: selected }} onChange={(m) => patchGpu(m[n.host] || "")} />
                      </div>
                    </div>;
                  })}
                </div>
              </div>
            )}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              {trainingIsMultiNode() ? (
                <>
                  <Field label="GPUS_PER_NODE"><NumberStepperInput min={1} value={hpDraft.GPUS_PER_NODE || String(firstNodeGpuCount())} onChange={(v) => { const next = cleanTrainingHp({ ...hpDraft, GPUS_PER_NODE: v }); delete next.NUM_GPUS; delete next.MLPERF_NUM_GPUS; setHpDraft(next); }} /></Field>
                  <Field label="WORLD_SIZE"><NumberStepperInput min={1} value={hpDraft.WORLD_SIZE || String(totalTrainingGpus())} onChange={(v) => setHpDraft(cleanTrainingHp({ ...hpDraft, WORLD_SIZE: v, TP: v, MLPERF_WORLD_SIZE: v }))} /></Field>
                </>
              ) : !trainingSingleMany() ? (
                <>
                  <Field label="GPUS_PER_NODE"><NumberStepperInput min={1} value={hpDraft.GPUS_PER_NODE || String(firstNodeGpuCount())} onChange={(v) => setHpDraft(cleanTrainingHp({ ...hpDraft, GPUS_PER_NODE: v }))} /></Field>
                  <Field label="TP"><NumberStepperInput min={1} value={hpDraft.TP || String(firstNodeGpuCount())} onChange={(v) => setHpDraft({ ...hpDraft, TP: v })} /></Field>
                  <Field label="PP"><NumberStepperInput min={1} value={hpDraft.PP || "1"} onChange={(v) => setHpDraft({ ...hpDraft, PP: v })} /></Field>
                  <Field label="CP"><NumberStepperInput min={1} value={hpDraft.CP || "1"} onChange={(v) => setHpDraft({ ...hpDraft, CP: v })} /></Field>
                </>
              ) : null}
              <Field label="MBS (Micro Batch Size)"><NumberStepperInput min={1} value={hpDraft.MBS || ""} onChange={(v) => setHpDraft({ ...hpDraft, MBS: v })} /></Field>
              <Field label="GBS (Global Batch Size)"><NumberStepperInput min={1} value={hpDraft.GBS || ""} onChange={(v) => setHpDraft({ ...hpDraft, GBS: v })} /></Field>
              <Field label="MAX_SEQLEN"><NumberStepperInput min={1} value={hpDraft.MAX_SEQLEN || ""} onChange={(v) => setHpDraft({ ...hpDraft, MAX_SEQLEN: v })} /></Field>
              <Field label="Precision"><select className="inp" value={trainingPrecisionUiValue(hpDraft)} onChange={(e) => setHpDraft(applyTrainingPrecisionSelection(hpDraft, e.target.value))}>{TRAINER_PRECISION_OPTIONS.map((opt) => <option key={opt.value} value={opt.value}>{opt.label}</option>)}</select></Field>
              <Field label="NCCL_DEBUG"><select className="inp" value={hpDraft.NCCL_DEBUG || ""} onChange={(e) => setHpDraft({ ...hpDraft, NCCL_DEBUG: e.target.value })}>{["", "WARN", "INFO", "TRACE"].map((v) => <option key={v} value={v}>{v || "unset"}</option>)}</select></Field>
              <Field label="MAX_STEPS"><NumberStepperInput min={1} value={hpDraft.MLPERF_MAX_STEPS || "10"} onChange={(v) => setHpDraft({ ...hpDraft, MLPERF_MAX_STEPS: v })} placeholder="required" /></Field>
              <Field label="VAL_CHECK_INTERVAL"><NumberStepperInput min={1} value={hpDraft.MLPERF_VAL_CHECK_INTERVAL || ""} onChange={(v) => setHpDraft({ ...hpDraft, MLPERF_VAL_CHECK_INTERVAL: v })} placeholder="10" /></Field>
              <Field label="LIMIT_VAL_BATCHES"><NumberStepperInput min={1} value={hpDraft.MLPERF_LIMIT_VAL_BATCHES || ""} onChange={(v) => setHpDraft({ ...hpDraft, MLPERF_LIMIT_VAL_BATCHES: v })} placeholder="1" /></Field>
              {envMode === "bare" && !trainingSingleMany() && !trainingIsMultiNode() && <GpuSelectionFields nodes={cleanNodes()} value={gpuSelectionDraft} onChange={setGpuSelectionDraft} />}
            </div>
            {envMode === "bare" && trainingIsMultiNode() && (
              <div className="mt-4 rounded-xl border border-line bg-ink-950/30 p-3 space-y-3">
                <div className="label-mono">노드별 파라미터 지정</div>
                <GpuSelectionFields nodes={cleanNodes()} value={gpuSelectionDraft} onChange={setGpuSelectionDraft} />
              </div>
            )}
            <div className="mt-4">
              <Field label="extra env">
                <textarea className="inp font-mono text-[12px]" rows="4" value={extraDraft} onChange={(e) => setExtraDraft(e.target.value)} placeholder="LR=4e-4" />
              </Field>
            </div>
          </ModalShell>
        )}
      </div>

    );
  }

  const TrainingK8sConfigStable = React.memo(
    TrainingK8sConfig,
    (prev, next) => prev.busy === next.busy
  );

  function InferenceMlperfConfig({ onStart, busy, setInferenceSub }) {

    const DEFAULT_HP = {
      "v5.1": {

        MLPERF_INFER_MIN_DURATION_MS: "600000",

      "v6.0": {

        MLPERF_INFER_GPU_BATCH_SIZE: "1",
        MLPERF_INFER_OFFLINE_QPS: "1.0",
        MLPERF_INFER_MIN_DURATION_MS: "60000",
        MLPERF_INFER_MIN_QUERY_COUNT: "1",
        MLPERF_INFER_ACCURACY_TARGET: ".999",
        MLPERF_INFER_TEST_MODE: "AccuracyOnly",
