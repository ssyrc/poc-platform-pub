<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=6.63">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=6.63">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/favicon-192.png?v=6.63">
  <link rel="shortcut icon" href="/assets/favicon.ico?v=6.63">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server PoC Platform</title>

  <!-- Local frontend dependencies for air-gapped environments.
       Required files under frontend/vendor/:
         tailwindcss.js
         react.production.min.js
         react-dom.production.min.js
         prop-types.min.js
         Recharts.js
         babel.min.js
  -->
  <script src="/vendor/tailwindcss.js"></script>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/prop-types.min.js"></script>
  <script src="/vendor/Recharts.js"></script>
  <script src="/vendor/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:    { 950: "#0a0a0e", 900: "#0e0e13", 850: "#16151d", 800: "#1c1b25",
                      700: "#24222f", 600: "#2c2a39", 500: "#38354a" },
            line:   { DEFAULT: "#262433", strong: "#332f44" },
            fog:    { 100: "#eceaf2", 200: "#c9c5d6", 300: "#9c97ad", 400: "#6f6a82",
                      500: "#514d63" },
            volt:   "#BB86FC",   // primary  (Material dark purple 200)
            voltlo: "#7C4DFF",   // primary variant (saturated violet)
            grape:  "#3700B3",   // primary deep (Material 700)
            second: "#03DAC6",   // secondary (teal)
            accent: "#F2557D",   // pink accent
            ember:  "#FFB74D",   // power chart (warm amber)
            cool:   "#03DAC6",   // alias of secondary
            ok:     "#4ade80",
            warn:   "#FFB74D",
            err:    "#CF6679",   // Material dark error
          },
          fontFamily: {
            sans: ["ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "\"Segoe UI\"", "sans-serif"],
            mono: ["ui-monospace", "\"SFMono-Regular\"", "Consolas", "\"Liberation Mono\"", "monospace"],
          },
          boxShadow: {
            "panel": "0 1px 0 0 rgba(255,255,255,0.02) inset, 0 0 0 1px rgba(255,255,255,0.04)",
            "voltglow": "0 0 28px 0 rgba(187, 134, 252, 0.22)",
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --grid-color: rgba(255,255,255,0.025);
    }
    html, body, #root { height: 100%; }
    body {
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(187,134,252,0.06), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(3,218,198,0.045), transparent 60%),
        #0a0a0e;
      color: #eceaf2;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.005em;
    }
    /* faint grid background */
    .grid-bg {
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    /* tiny inline scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c2a39; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #332f44; }

    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

    /* status dots + pulse */
    .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 rgba(187,134,252,0.55); }
      70%  { box-shadow: 0 0 0 8px rgba(187,134,252,0); }
      100% { box-shadow: 0 0 0 0 rgba(187,134,252,0); }
    }
    .dot-pulse { animation: pulseDot 1.6s infinite; }

    /* subtle log text */
    .log-line { line-height: 1.45; word-break: break-word; }
    .log-host {
      display: inline-block; min-width: 84px;
      color: #c9c5d6; font-weight: 600;
    }
    .log-time { color: #6f6a82; }
    .log-info  { color: #c9c5d6; }
    .log-warn  { color: #f59e0b; }
    .log-error { color: #ef4444; }
    .log-phase { color: #BB86FC; }

    /* button presses */
    .btn { transition: transform 80ms ease, background-color 120ms ease, border-color 120ms ease; }
    .btn:active { transform: translateY(1px); }

    /* tab indicator slide */
    .tab-ind {
      transition: transform 220ms cubic-bezier(.2,.6,.2,1), width 220ms cubic-bezier(.2,.6,.2,1);
    }

    /* recharts text overrides */
    .recharts-cartesian-axis-tick-value { fill: #6f6a82; font-size: 11px; }
    .recharts-cartesian-grid line { stroke: #2c2a39; }
    .recharts-tooltip-wrapper .recharts-default-tooltip {
      background: #1c1b25 !important; border: 1px solid #262433 !important;
      border-radius: 8px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .recharts-tooltip-label { color: #c9c5d6 !important; font-weight: 600; }

    /* ---- v3.5 shell: left sidebar + content surface ---- */
    .app-shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
    @media (max-width: 1100px) { .app-shell { grid-template-columns: 76px 1fr; } }

    .sidebar {
      position: sticky; top: 0; align-self: start; height: 100vh;
      background: linear-gradient(180deg, #121118 0%, #0c0c11 100%);
      border-right: 1px solid #262433;
      display: flex; flex-direction: column;
    }
    /* brand */
    .brand-logo { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; flex:none;
      background:linear-gradient(135deg,#C79BFF 0%,#7C4DFF 60%,#5B33D6 100%); box-shadow:0 8px 22px -8px rgba(124,77,255,.85); }
    .brand-logo svg { width:21px; height:21px; }
    .brand-name { font-size:15px; font-weight:750; color:#f3f1f8; letter-spacing:-0.02em; line-height:1.15; }
    .brand-sub  { font-size:11px; color:#9c97ad; letter-spacing:0.01em; }
    .nav-item {
      position:relative; display: flex; align-items: center; gap: 10px;
      padding: 8px 11px; border-radius: 11px; margin: 2px 0;
      color: #b6b1c4; font-size: 13.5px; font-weight: 550;
      border: 1px solid transparent; cursor: pointer; width: 100%;
      transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .nav-item:hover { background: rgba(255,255,255,0.045); color: #eceaf2; }
    .nav-item.active {
      background: linear-gradient(90deg, rgba(187,134,252,0.16), rgba(187,134,252,0.05));
      color: #ead9ff; border-color: rgba(187,134,252,0.28); font-weight: 650;
    }
    .nav-item.active::before {
      content:""; position:absolute; left:-1px; top:50%; transform:translateY(-50%);
      width:3px; height:20px; border-radius:3px; background:linear-gradient(180deg,#C79BFF,#7C4DFF);
    }
    .nav-ico-wrap { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none;
      background:rgba(255,255,255,.045); border:1px solid #262433; transition:all 130ms ease; }
    .nav-item:hover .nav-ico-wrap { background:rgba(255,255,255,.08); }
    .nav-item.active .nav-ico-wrap {
      background:linear-gradient(135deg,#C79BFF,#7C4DFF); border-color:transparent;
      box-shadow:0 5px 16px -5px rgba(124,77,255,.8);
    }
    .nav-item.active .nav-ico { color:#fff; }
    .nav-ico { width: 17px; height: 17px; flex: none; color: #9c97ad; }
    .nav-sub {
      position:relative; display: flex; align-items: center; gap: 9px;
      padding: 7px 12px 7px 42px; border-radius: 9px; margin: 1px 0;
      color: #8a85a0; font-size: 12.5px; cursor: pointer; width: 100%;
      transition: background-color 120ms ease, color 120ms ease;
    }
    .nav-sub:hover { background: rgba(255,255,255,0.03); color: #c9c5d6; }
    .nav-sub.active { color: #d7c4ff; background: rgba(187,134,252,0.08); font-weight:600; }
    .nav-section-label {
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: #6f6a82; font-family: ui-monospace, monospace; padding: 0 12px; font-weight:600;
      margin: 16px 0 7px;
    }
    @media (max-width: 1100px) {
      .nav-item span.nav-label, .nav-sub, .nav-section-label, .sidebar-foot, .brand-text { display: none; }
      .nav-item { justify-content: center; padding: 9px 0; gap:0; }
      .nav-item.active::before { display:none; }
    }

    /* surface = lighter content background to separate from chrome */
    .surface { background:
      radial-gradient(1100px 480px at 6% -8%, rgba(187,134,252,0.045), transparent 55%),
      #0e0e13; }

    /* card: the primary content container */
    .card {
      background: #16151d; border: 1px solid #262433; border-radius: 14px;
      box-shadow: 0 1px 0 0 rgba(255,255,255,0.02) inset, 0 12px 40px -24px rgba(0,0,0,0.8);
    }
    .card-pad { padding: 18px 20px; }
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid #221f2e;
    }
    .card-title { font-size: 14px; font-weight: 600; color: #eceaf2; letter-spacing: -0.01em; }
    .card-sub { font-size: 11.5px; color: #6f6a82; margin-top: 1px; }

    .seg {
      display: inline-flex; padding: 3px; gap: 3px; border-radius: 10px;
      background: #1c1b25; border: 1px solid #262433;
    }
    .seg-btn {
      padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 500;
      color: #9c97ad; cursor: pointer; border: none; background: transparent;
      transition: background-color 120ms, color 120ms;
    }
    .seg-btn:hover { color: #eceaf2; }
    .seg-btn.active { background: rgba(187,134,252,0.12); color: #BB86FC; }

    /* data table */
    .dt { width: 100%; border-collapse: collapse; font-size: 13px; }
    .dt th {
      text-align: left; padding: 9px 12px; color: #6f6a82; font-weight: 600;
      font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      border-bottom: 1px solid #262433; white-space: nowrap;
    }
    .dt td { padding: 10px 12px; border-bottom: 1px solid #1d1b27; color: #c9c5d6; }
    .dt tr:hover td { background: rgba(255,255,255,0.015); }

    .chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
      border-radius: 999px; font-size: 11px; font-weight: 600;
      font-family: ui-monospace, monospace;
    }
    .chip-ok   { background: rgba(74,222,128,0.14);  color: #4ade80; }
    .chip-warn { background: rgba(245,158,11,0.12); color: #fbbf24; }
    .chip-err  { background: rgba(239,68,68,0.12);  color: #f87171; }
    .chip-mut  { background: rgba(110,117,133,0.12); color: #9c97ad; }
    .chip-cool { background: rgba(3,218,198,0.10); color: #5eead4; }

    .inp {
      width: 100%; background: #0e0e13; border: 1px solid #332f44; border-radius: 9px;
      padding: 9px 12px; color: #eceaf2; font-size: 13.5px; outline: none;
      transition: border-color 120ms, box-shadow 120ms;
    }
    .inp:focus { border-color: rgba(187,134,252,0.5); box-shadow: 0 0 0 3px rgba(187,134,252,0.08); }
    .inp::placeholder { color: #514d63; }

    .btn-primary {
      background: linear-gradient(135deg, #C79BFF, #A66BF8); color: #160a26; font-weight: 700; font-size: 13.5px;
      padding: 9px 16px; border-radius: 9px; border: none; cursor: pointer;
      transition: filter 120ms, transform 80ms;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ghost {
      background: #1c1b25; color: #c9c5d6; font-size: 12.5px; font-weight: 500;
      padding: 7px 13px; border-radius: 8px; border: 1px solid #332f44; cursor: pointer;
      transition: background-color 120ms, border-color 120ms;
    }
    .btn-ghost:hover { background: #24222f; border-color: #46415c; }
    .btn-ghost:disabled { opacity: 0.45; cursor: not-allowed; }
    .info-dot {
      display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px;
      border-radius:999px; border:1px solid rgba(187,134,252,.45); color:#BB86FC;
      font-size:11px; font-weight:700; font-family:ui-monospace,monospace; cursor:help;
      background:rgba(187,134,252,.08);
    }
    .label-mono {
      font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase;
      color: #9c97ad; font-family: ui-monospace, monospace; font-weight: 600;
    }
    /* zone header (replaces numbered step badges in tab layout) */
    .zone-head {
      display:flex; align-items:center; gap:13px;
      padding:12px 16px; border-radius:15px;
      border:1px solid #262433; background:rgba(255,255,255,.02);
    }
    .zone-head { flex-wrap:wrap; }
    .zone-head.zh-volt   { background:linear-gradient(90deg, rgba(187,134,252,.13), rgba(187,134,252,.015) 72%); border-color:rgba(187,134,252,.24); }
    .zone-head.zh-second { background:linear-gradient(90deg, rgba(3,218,198,.12),  rgba(3,218,198,.015) 72%);  border-color:rgba(3,218,198,.24); }
    .zone-head.zh-accent { background:linear-gradient(90deg, rgba(242,85,125,.12), rgba(242,85,125,.015) 72%); border-color:rgba(242,85,125,.24); }
    .zone-head.zh-mut    { background:rgba(255,255,255,.025); border-color:#262433; }
    .zone-ico { width:40px; height:40px; border-radius:13px; display:grid; place-items:center; flex:none; color:#fff; }
    .zone-ico svg { width:20px; height:20px; }
    .zone-ico-volt   { background:linear-gradient(135deg,#C79BFF,#7C4DFF); box-shadow:0 7px 20px -7px rgba(124,77,255,.75); }
    .zone-ico-second { background:linear-gradient(135deg,#7defdf,#03DAC6); color:#06302c; box-shadow:0 7px 20px -7px rgba(3,218,198,.6); }
    .zone-ico-accent { background:linear-gradient(135deg,#F87EA0,#E0407E); box-shadow:0 7px 20px -7px rgba(224,64,126,.6); }
    .zone-ico-mut    { background:linear-gradient(135deg,#3a3850,#26242f); color:#c9c5d6; border:1px solid #332f44; }
    .zone-title { font-size:16.5px; font-weight:700; color:#f3f1f8; letter-spacing:-0.012em; }
    .zone-sub   { font-size:12px; color:#9c97ad; margin-top:2px; }
    /* sub-section icon chip (inside config cards) */
    .sec-ico { width:26px; height:26px; border-radius:9px; display:grid; place-items:center; flex:none;
      background:rgba(187,134,252,.12); color:#BB86FC; border:1px solid rgba(187,134,252,.26); }
    .sec-ico svg { width:15px; height:15px; }
    /* compact horizontal settings layout */
    .cfg-grid { display:grid; gap:20px; align-items:start;
      grid-template-columns: minmax(210px,0.9fr) minmax(290px,1.5fr) minmax(200px,1fr) minmax(168px,0.7fr); }
    @media (max-width:1240px){ .cfg-grid { grid-template-columns:1fr 1fr; } }
    @media (max-width:700px){ .cfg-grid { grid-template-columns:1fr; } }
    .cfg-col { min-width:0; }
    .cfg-label { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; font-weight:700; color:#f3f1f8; letter-spacing:-0.01em; }
    .cfg-divider { width:1px; background:linear-gradient(180deg,transparent,#262433 18%,#262433 82%,transparent); }
    .run-mini { border:1px solid rgba(187,134,252,.24); border-radius:14px;
      background:linear-gradient(150deg, rgba(187,134,252,.12), rgba(22,21,29,.55) 60%); padding:13px;
      display:flex; flex-direction:column; gap:11px; }
    .section-card {
      border: 1px solid #332f44; border-radius: 16px; overflow: hidden;
      background: linear-gradient(180deg, rgba(28,27,37,0.92), rgba(22,21,29,0.92));
      box-shadow: 0 1px 0 0 rgba(255,255,255,0.025) inset;
    }
    .section-head {
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding: 13px 16px; border-bottom:1px solid #262433;
      background: linear-gradient(90deg, rgba(187,134,252,0.05), transparent 70%);
    }
    .section-title { display:flex; align-items:center; gap:10px; min-width:0; }
    .step-badge {
      display:inline-flex; align-items:center; justify-content:center;
      width:24px; height:24px; border-radius:999px;
      background:rgba(187,134,252,0.14); border:1px solid rgba(187,134,252,0.35);
      color:#BB86FC; font-size:12px; font-weight:500; font-family:ui-monospace,monospace;
      flex:none;
    }
    .section-name { font-size:14.5px; font-weight:700; color:#f3f1f8; letter-spacing:-0.01em; }
    .section-body { padding:16px; }
    .summary-box {
      border:1px solid #332f44; border-radius:12px; background:rgba(14,14,19,0.78);
      padding:10px 12px; color:#c9c5d6; font-size:11px; font-family:ui-monospace,monospace;
      line-height:1.55; word-break:break-word;
    }
    .run-card {
      border:1px solid rgba(187,134,252,0.22); border-radius:16px;
      background: linear-gradient(135deg, rgba(187,134,252,0.09), rgba(22,21,29,0.92) 42%);
      padding:16px;
    }
    .btn-primary-strong {
      background: linear-gradient(135deg, #BB86FC, #7C4DFF); color:#160a26; font-weight:500; font-size:13.5px;
      padding:10px 16px; border-radius:10px; border:1px solid rgba(187,134,252,0.55);
      cursor:pointer; box-shadow:0 0 24px rgba(124,77,255,0.20);
      transition:filter 120ms, transform 80ms, box-shadow 120ms;
    }
    .btn-primary-strong:hover { filter:brightness(1.07); box-shadow:0 0 32px rgba(124,77,255,0.30); }
    .btn-primary-strong:active { transform:translateY(1px); }
    .btn-primary-strong:disabled { opacity:0.45; cursor:not-allowed; }
    .node-card {
      border:1px solid #332f44; border-radius:13px; background:rgba(22,21,29,0.88);
      padding:12px;
    }
    .node-list-item {
      display:grid; grid-template-columns:minmax(0,1fr) 84px 70px; gap:8px; align-items:end;
      border:1px solid #262433; border-radius:12px; background:rgba(28,27,37,0.72); padding:10px;
    }
    @media (max-width: 720px) { .node-list-item { grid-template-columns:1fr; } }


    /* v3.5.14 visual refresh — compact neon control surfaces */
    .control-shell {
      display:grid; grid-template-columns:minmax(260px,.72fr) minmax(360px,1fr) minmax(300px,.82fr);
      gap:16px; align-items:start;
    }
    @media (max-width:1320px){ .control-shell{ grid-template-columns:1fr 1fr; } .control-summary{ grid-column:1 / -1; } }
    @media (max-width:820px){ .control-shell{ grid-template-columns:1fr; } }
    .control-card {
      border:1px solid rgba(255,255,255,.075); border-radius:18px;
      background:linear-gradient(180deg, rgba(28,27,37,.84), rgba(16,16,23,.92));
      box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 50px -34px rgba(0,0,0,.95);
      padding:14px;
    }
    .control-title { display:flex; align-items:center; gap:9px; margin-bottom:12px; color:#f3f1f8; font-size:13px; font-weight:760; letter-spacing:-.01em; }
    .control-title .sec-ico { width:24px; height:24px; border-radius:8px; }
    .compact-node-adder { border:1px solid #262433; border-radius:15px; background:rgba(14,14,19,.54); padding:10px; }
    .node-chip-row { display:flex; flex-wrap:wrap; gap:7px; max-height:112px; overflow:auto; padding-right:2px; }
    .node-chip {
      display:inline-flex; align-items:center; gap:7px; min-width:0; max-width:100%;
      padding:6px 7px 6px 9px; border-radius:999px; border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(135deg, rgba(187,134,252,.10), rgba(3,218,198,.04));
      color:#eceaf2; font-size:11.5px; font-family:ui-monospace,monospace;
    }
    .node-chip-host { max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .node-chip-gpu { color:#03DAC6; font-size:10px; }
    .node-chip-remove {
      width:18px; height:18px; display:grid; place-items:center; border-radius:999px;
      background:rgba(207,102,121,.12); color:#CF6679; border:1px solid rgba(207,102,121,.28);
    }
    .node-chip-remove:hover { background:rgba(207,102,121,.22); color:#ff9aae; }
    .mode-switch { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; border-radius:15px; background:#0e0e13; border:1px solid #262433; }
    .mode-switch button { border-radius:11px; padding:9px 10px; font-size:12.5px; font-weight:700; color:#9c97ad; border:1px solid transparent; }
    .mode-switch button.active { color:#0b1020; background:linear-gradient(135deg,#03DAC6,#6EE7F9); box-shadow:0 0 24px rgba(3,218,198,.20); }
    .mode-switch button:not(.active):hover { color:#eceaf2; background:rgba(255,255,255,.045); }
    .switch-row { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; }
    .ui-switch { position:relative; display:inline-flex; width:48px; height:26px; border-radius:999px; padding:3px; background:#38354a; border:1px solid #46415c; transition:all 140ms ease; }

<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">

  /*
    MLPerf Platform - single-page UI

    Sections in order:
      1) hooks: useEventSource, useInterval, helpers
      2) constants: SUPPORTED matrix, palette
      3) sub-components: Tabs, ConfigPanel, HostStatusCards, ChartsRow, LogStream,
                         ResultTable, RunHistory, ComingSoonTab
      4) App + bootstrap
  */
  const { useState, useEffect, useRef, useMemo, useCallback } = React;
  const RC = window.Recharts;
  const { LineChart, Line, ScatterChart, Scatter, BarChart, Bar, Cell,
          ResponsiveContainer, XAxis, YAxis, Tooltip,
          CartesianGrid, Legend, Brush } = RC;

  function ModalPortal({ children }) {
    if (typeof document === "undefined" || !document.body) return children;
    return ReactDOM.createPortal(children, document.body);
  }

  // ---------------------- helpers ----------------------

  const fmtTime = (sec) => {
    if (!sec) return "—";
    const d = new Date(sec * 1000);
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  const fmtDur = (s) => {
    if (s == null) return "—";
    const m = Math.floor(s / 60); const r = Math.round(s % 60);
    if (m === 0) return `${r}s`;
    if (m < 60) return `${m}m ${r}s`;
    const h = Math.floor(m / 60); const mm = m % 60;
    return `${h}h ${mm}m`;
  };
  const fmtNum = (v, digits = 2) => {
    if (v == null || Number.isNaN(v)) return "—";
    if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(digits) + "M";
    if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(digits) + "k";
    return Number(v).toFixed(digits);
  };

  const copyText = async (text) => {
    if (!text) return;
    try { await navigator.clipboard.writeText(String(text)); }
    catch (_) {
      const ta = document.createElement("textarea");
      ta.value = String(text);
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
  };

  // Stable color per host (deterministic hash → palette index).
  const HOST_COLORS = [
    "#BB86FC", "#03DAC6", "#f97316", "#ec4899", "#a78bfa",
    "#facc15", "#34d399", "#f43f5e", "#60a5fa", "#fb7185",
  ];
  const colorForHost = (host) => {
    let h = 0;
    for (let i = 0; i < host.length; i++) h = ((h << 5) - h + host.charCodeAt(i)) | 0;
    return HOST_COLORS[Math.abs(h) % HOST_COLORS.length];
  };

  // useEventSource: opens SSE, calls onMessage(parsed) per event with name=`evt`.
  // Reconnects with backoff on error.
  function useEventSource(url, evt, onMessage, deps = []) {
    useEffect(() => {
      if (!url) return;
      let es; let closed = false; let backoff = 1000;
      const open = () => {
        es = new EventSource(url);
        es.addEventListener(evt, (e) => {
          try { onMessage(JSON.parse(e.data)); } catch (_) {}
        });
        es.onerror = () => {
          if (closed) return;
          es.close();
          setTimeout(open, backoff);
          backoff = Math.min(backoff * 2, 8000);
        };
      };
      open();
      return () => { closed = true; if (es) es.close(); };
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, deps);
  }

  function useInterval(fn, ms, deps = []) {
    useEffect(() => {
      if (!ms) return;
      fn();
      const id = setInterval(fn, ms);
      return () => clearInterval(id);
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, deps);
  }

  async function fetchJsonOrThrow(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) {
      let payload = null;
      try { payload = await r.json(); } catch (_) {}
      const detail = payload?.detail || payload?.error || payload?.raw || `HTTP ${r.status}`;
      const err = new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      err.status = r.status;
      err.payload = payload;
      throw err;
    }
    return r.json();
  }

  const api = {
    async config() { return fetchJsonOrThrow("/api/config"); },
    async health() { return fetchJsonOrThrow("/api/health"); },
    async listRuns() { return fetchJsonOrThrow("/api/runs"); },
    async getRun(id) { return fetchJsonOrThrow(`/api/runs/${id}`); },
    async deleteRun(id) { return fetchJsonOrThrow(`/api/runs/${encodeURIComponent(id)}`, { method: "DELETE" }); },
    async getLogs(id, limit = 4000) { return fetchJsonOrThrow(`/api/runs/${encodeURIComponent(id)}/logs?limit=${limit}`); },
    async getResults(id) { return fetchJsonOrThrow(`/api/runs/${id}/results`); },
    async getRunGpuSamples(id) { return fetchJsonOrThrow(`/api/runs/${id}/gpu_samples`); },
    reportUrl(id) { return `/api/runs/${id}/report`; },
    async getDashboard() { return fetchJsonOrThrow("/api/dashboard"); },
    async saveDashboard(pins) {
      return fetchJsonOrThrow("/api/dashboard", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pins: pins || [] }),
      });
    },
    async getAcceleratorPerf() { return fetchJsonOrThrow("/api/accelerator-perf"); },
    async saveAcceleratorPerf(document) {
      return fetchJsonOrThrow("/api/accelerator-perf", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ document }),
      });
    },
    async getGpuTcoTable() { return fetchJsonOrThrow("/api/gpu-tco-table"); },
    async saveGpuTcoTable(document) {
      return fetchJsonOrThrow("/api/gpu-tco-table", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ document }),
      });
    },
    async startRun(body) {
      const r = await fetch("/api/runs", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error((await r.json()).detail || "start failed");
      return r.json();
    },
    async stopRun(id) {
      const r = await fetch(`/api/runs/${id}/stop`, { method: "POST" });
      return r.json();
    },
    async stopHost(id, host) {
      const r = await fetch(`/api/runs/${id}/stop/${encodeURIComponent(host)}`,
        { method: "POST" });
      return r.json();
    },

    // ---- cluster: OS provisioning (warewulf proxy) ----
    async wwMeta() { return fetchJsonOrThrow("/api/cluster/warewulf/meta"); },
    async wwNodes() { return fetchJsonOrThrow("/api/cluster/warewulf/nodes"); },
    async wwNode(id) { return fetchJsonOrThrow(`/api/cluster/warewulf/nodes/${encodeURIComponent(id)}`); },
    async wwAddNode(payload) {
      const body = (payload && typeof payload === "object") ? payload : { hostname: payload };
      const r = await fetch("/api/cluster/warewulf/nodes", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      return r.json();
    },
    async sshStatus(target, sshUser) {
      const qs = new URLSearchParams({ target });
      if (sshUser) qs.set("ssh_user", sshUser);
      return fetchJsonOrThrow(`/api/cluster/ssh_status?${qs.toString()}`);
    },
    async wwBoot(id, sshUser) {
      const qs = sshUser ? `?ssh_user=${encodeURIComponent(sshUser)}` : "";
      return fetchJsonOrThrow(`/api/cluster/warewulf/nodes/${encodeURIComponent(id)}/boot${qs}`);
    },
    async wwPower(id, action) {
      const r = await fetch(`/api/cluster/warewulf/nodes/${encodeURIComponent(id)}/power`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action }),
      });
      return r.json();
    },
    async wwProvision(id, body) {
      const r = await fetch(`/api/cluster/warewulf/nodes/${encodeURIComponent(id)}/provision`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      return r.json();
    },

    // ---- cluster: kubernetes ----
    async k8sStatus() { return fetchJsonOrThrow("/api/cluster/k8s/status"); },
    async k8sNodes() { return fetchJsonOrThrow("/api/cluster/k8s/nodes"); },
    async k8sPods(ns) { return fetchJsonOrThrow("/api/cluster/k8s/pods" + (ns ? `?namespace=${encodeURIComponent(ns)}` : "")); },
    async k8sServices(ns) { return fetchJsonOrThrow("/api/cluster/k8s/services" + (ns ? `?namespace=${encodeURIComponent(ns)}` : "")); },
    async k8sWorkloads(ns) { return fetchJsonOrThrow("/api/cluster/k8s/workloads" + (ns ? `?namespace=${encodeURIComponent(ns)}` : "")); },
    async k8sLlmdEndpoints(ns) { return fetchJsonOrThrow("/api/cluster/k8s/llmd_endpoints" + (ns ? `?namespace=${encodeURIComponent(ns)}` : "")); },
    async topology(node) { return fetchJsonOrThrow("/api/cluster/topology?node=" + encodeURIComponent(node)); },
    async freeGpus(node, count) { return fetchJsonOrThrow(`/api/cluster/free_gpus?node=${encodeURIComponent(node)}&count=${count||4}`); },
    async k8sJoin(target, ssh_user) {
      const r = await fetch("/api/cluster/k8s/join", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target, ssh_user }),
      });
      return r.json();
    },
  };

  // ---------------------- supported matrix (mirrors backend) ----------------------

  const SUPPORTED = {
    "training:v4.1": { benchmarks: ["llama2_70b_lora"],
      gpus: ["V100", "A100", "H100", "GH200"] },
    "training:v5.1": { benchmarks: ["llama2_70b_lora", "llama31_8b"],
      gpus: ["V100", "A100", "H100", "RTX6000", "RTX_PRO_6000", "GH200", "B300"] },
    "inference:v5.1": { benchmarks: ["llama2_70b"],
      gpus: ["V100", "A100", "H100", "GH200", "B300", "RTX6000", "RTX_PRO_6000"] },
    "inference:v6.0": { benchmarks: ["llama2_70b"],
      gpus: ["V100", "A100", "H100", "GH200", "B300", "RTX6000", "RTX_PRO_6000"] },
  };

  const ALL_GPUS = ["V100", "A100", "H100", "GH200", "B300", "RTX6000", "RTX_PRO_6000"];
  const SUPPORTED_VLLM = {
    engines: ["vllm", "sglang"],
    bench_data: { vllm: ["sharegpt", "random"], sglang: [] },
    gpus: ALL_GPUS,
  };
  const SUPPORTED_PD = {
    engines: ["vllm", "sglang"],
    bench_data: { vllm: ["sharegpt", "random"], sglang: [] },
    gpus: ALL_GPUS,
  };

  // ---------------------- advanced argument schemas ----------------------
  //
  // Each schema is an array of { key, label, type, options?, placeholder?, hint?, role? }.
  //  - type: "int" | "float" | "text" | "select" | "bool"
  //  - options (for select): array of strings; "" = "unset"
  //  - role: for vllm/pd, "cli" means the value goes to a known CLI flag
  //          (handled specially in runner.py); default behavior = pass via

  function resolveSchema(table, key) {

  function _isTrueLike(v) {
    return ["true", "1", "yes", "y", "on"].includes(String(v ?? "").trim().toLowerCase());
  }

  function normalizeTrainerPrecisionValue(v) {
    const raw = String(v ?? "").trim();
    if (!raw) return "bf16-mixed";
    const map = {
      "FP64": "bf16-mixed",
      "64-true": "bf16-mixed",
      "64": "bf16-mixed",
      "FP32": "bf16-mixed",

      "FP8_HYBRID": "transformer-engine",
      "transformer-engine": "transformer-engine",
      "transformer-engine-float16": "transformer-engine-float16",
    };
    return map[raw] || raw;

  function trainingPrecisionUiValue(src = {}) {

    return normalizeTrainerPrecisionValue(src.TRAINER_PRECISION || src.MLPERF_TRAINER_PRECISION || src.precision || "bf16-mixed");
  }

  function applyTrainingPrecisionSelection(src = {}, selected = "bf16-mixed") {
    const out = { ...(src || {}) };
    const opt = TRAINER_PRECISION_OPTIONS.find((x) => x.value === selected || x.label === selected);
    if (opt) {
      out.TRAINER_PRECISION = opt.trainer;
      out.FP8 = opt.fp8;
      out.FP8_HYBRID = opt.fp8Hybrid;
      return out;
    }
    out.TRAINER_PRECISION = normalizeTrainerPrecisionValue(selected);
    out.FP8 = "False";
    out.FP8_HYBRID = "False";
    return out;
  }

  function AdvancedArgs({ schema, value, onChange, title = "advanced arguments", hint = "", alwaysOpen = false }) {

  // Strip out empty values before submission so the backend env stays clean.
  function compactArgs(obj) {
    const out = {};
    Object.entries(obj || {}).forEach(([k, v]) => {
      if (v === "" || v === null || v === undefined) return;
      out[k] = String(v);
    });
    return out;

  // GPU TDP table used only for power chart y-axis scaling.
  // Values are per-GPU watts. For configurable GPUs we use the common/high SXM/server setting.
  const GPU_TDP_W = {
    V100: 300,
    A100: 400,
    H100: 700,
    GH200: 900,
    RTX6000: 300,
    RTX_PRO_6000: 600,
    B300: 1200,
  };

  const tdpForGpu = (gpuType) => GPU_TDP_W[gpuType] || 700;

  const powerDomainForHosts = (hosts, nodeGpuMap, fallbackGpuType) => {
    const maxTdp = Math.max(
      0,
      ...(hosts || []).map((h) => tdpForGpu(nodeGpuMap?.[h] || fallbackGpuType))
    );
    // Use the highest TDP among ADDED NODES exactly as the Y-axis max.
    return maxTdp || tdpForGpu(fallbackGpuType) || 700;
  };

  const parseGpuIndexSet = (value) => {
    if (value === undefined || value === null || value === "") return null;
    if (Array.isArray(value)) {
      const nums = value.map((v) => Number(String(v).trim())).filter((n) => Number.isInteger(n) && n >= 0);
      return nums.length ? new Set(nums) : null;
    }
    const nums = String(value)
      .split(/[,\s]+/)
      .map((v) => Number(v.trim()))
      .filter((n) => Number.isInteger(n) && n >= 0);
    return nums.length ? new Set(nums) : null;
  };

  const firstNGpuIndexSet = (count) => {
    const n = Number(count);
    if (!Number.isInteger(n) || n <= 0) return null;
    return new Set(Array.from({ length: n }, (_, i) => i));
  };

  const gpuCountFromVisible = (value) => {
    const set = parseGpuIndexSet(value);
    return set ? set.size : 0;
  };

  const selectedGpuIndicesForHost = (run, host) => {
    const p = run?.params || {};
    const selected = p.selected_gpus_by_host || {};
    const byHostArgs = p.args_by_host || {};
    const args = p.args || {};
    return parseGpuIndexSet(selected?.[host])
      || parseGpuIndexSet(byHostArgs?.[host]?.MLPERF_CUDA_VISIBLE_DEVICES)
      || parseGpuIndexSet(args?.MLPERF_CUDA_VISIBLE_DEVICES)
      || firstNGpuIndexSet(p.gpus_per_node)
      || firstNGpuIndexSet(args?.NUM_GPUS)
      || firstNGpuIndexSet(args?.MLPERF_NUM_GPUS)
      || null;
  };

  const summarizeGpuAllocation = (run) => {
    const hosts = run?.hosts || [];
    const p = run?.params || {};
    const selected = p.selected_gpus_by_host || {};
    const args = p.args || {};
    const perHost = hosts.map((h) => {
      const explicit = gpuCountFromVisible(selected?.[h]);
      const fallback = Number(p.gpus_per_node || args.NUM_GPUS || args.MLPERF_NUM_GPUS || 0);
      const count = explicit || (Number.isFinite(fallback) && fallback > 0 ? fallback : "—");
      return `${h}=${count}`;
    });
    return {
      hostsText: hosts.join(", ") || "—",
      gpusText: perHost.length ? perHost.join(", ") : "—",
      total: hosts.reduce((acc, h) => {
        const explicit = gpuCountFromVisible(selected?.[h]);
        const fallback = Number(p.gpus_per_node || args.NUM_GPUS || args.MLPERF_NUM_GPUS || 0);
        const n = explicit || (Number.isFinite(fallback) && fallback > 0 ? fallback : 0);
        return acc + n;
      }, 0),
    };
  };

  const filterGpuSampleForRun = (sample, run, host) => {
    const allowed = selectedGpuIndicesForHost(run, host);
    if (!allowed || !Array.isArray(sample?.per_gpu)) return sample;
    const perGpu = sample.per_gpu.filter((g) => allowed.has(Number(g.index)));
    if (!perGpu.length) return sample;
    const utils = perGpu.map((g) => Number(g.util || 0));
    const powers = perGpu.map((g) => Number(g.power_w || 0));
    const memUsed = perGpu.reduce((acc, g) => acc + Number(g.mem_used_gb || 0), 0);
    const memTotal = perGpu.reduce((acc, g) => acc + Number(g.mem_total_gb || 0), 0);
    return {
      ...sample,
      per_gpu: perGpu,
      gpu_count: perGpu.length,
      util_avg: utils.reduce((a, b) => a + b, 0) / perGpu.length,
      util_max: Math.max(0, ...utils),
      power_total_w: powers.reduce((a, b) => a + b, 0),
      power_avg_w: powers.reduce((a, b) => a + b, 0) / perGpu.length,
      mem_used_gb: memUsed,
      mem_total_gb: memTotal,
    };
  };

  const filterGpuSamplesByRun = (byHost, run) => {
    const out = {};
    Object.entries(byHost || {}).forEach(([host, arr]) => {
      out[host] = (arr || []).map((sample) => filterGpuSampleForRun(sample, run, host));
    });
    return out;
  };

  const averageFromSamples = (series, field) => {
    const vals = [];
    Object.values(series || {}).forEach((arr) => (arr || []).forEach((s) => {
      const v = Number(s?.[field]);
      if (Number.isFinite(v)) vals.push(v);
    }));
    if (!vals.length) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  };


  // ---------------------- top: header + tabs ----------------------

  function Brand() {
    return (
      <div className="flex items-center gap-3">
        <div className="brand-logo"><Icon name="platform" /></div>
        <div className="leading-tight brand-text">
          <div className="brand-name">Server PoC Platform</div>
          <div className="brand-sub">AI Infra</div>
        </div>
      </div>
    );
  }

  function InfoTip({ text, align = "center" }) {
    if (!text) return null;
    return (
      <span className="tip-wrap" tabIndex={0}>
        <span className="tip-ico">i</span>
        <span className={"tip-bubble" + (align === "left" ? " tip-left" : "")}>{text}</span>
      </span>
    );
  }

  function ZoneHeader({ icon, accent = "volt", title, sub, tip, titleExtra, right }) {
    return (
      <div className={"zone-head zh-" + accent}>
        <span className={"zone-ico zone-ico-" + accent}><Icon name={icon} /></span>
        <div className="min-w-0">
          <div className="flex items-center gap-2">
            <span className="zone-title">{title}</span>
            {tip && <InfoTip text={tip} />}
            {titleExtra}
          </div>
          {sub && <div className="zone-sub">{sub}</div>}
        </div>
        {right && <div className="ml-auto flex items-center gap-2">{right}</div>}
      </div>
    );
  }

  function ZoneHead({ icon, title, sub, tip, accent = "volt", right }) {
    return (
      <div className="zone-head">
        <span className={"zone-ico zone-ico-" + accent}><Icon name={icon} /></span>
        <div className="min-w-0">
          <div className="flex items-center gap-2">
            <span className="zone-title">{title}</span>
            {tip && <InfoTip text={tip} />}
          </div>
          {sub && <div className="zone-sub">{sub}</div>}
        </div>
        {right && <div className="ml-auto flex items-center gap-2">{right}</div>}
      </div>
    );
  }

  function Tabs({ value, onChange }) {
    const items = [
      { id: "dashboard", label: "Dashboard" },
      { id: "mlperf", label: "MLPerf" },
      { id: "vllm",   label: "vLLM Bench" },
      { id: "pd",     label: "PD 분산 추론" },
    ];
    return (
      <div className="flex items-center gap-1 p-1 rounded-lg border border-line bg-ink-850/60 backdrop-blur">
        {items.map((it) => {
          const active = it.id === value;
          return (
            <button
              key={it.id}
              onClick={() => onChange(it.id)}
              className={
                "btn px-3.5 py-1.5 rounded-md text-sm font-medium tracking-tight " +
                (active
                  ? "bg-volt/10 text-volt border border-volt/30"
                  : "text-fog-300 hover:text-fog-100 border border-transparent hover:bg-white/5")
              }
            >
              {it.label}
            </button>
          );
        })}
      </div>
    );
  }

  // ---------------------- left: config + history ----------------------

  function MlperfField({ label, children, hint }) {
    return (
      <div className="block">
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-[11px] uppercase tracking-[0.16em] text-fog-400 font-mono">{label}</span>
          {hint && <span className="text-[10px] text-fog-500 font-mono">{hint}</span>}
        </div>
        {children}
      </div>
    );
  }

  function MlperfPill({ active, onClick, children }) {
    return (
      <button
        type="button"
        onClick={onClick}
        className={"btn px-3 py-1.5 rounded-md text-sm font-medium border " +
          (active ? "bg-volt/10 text-volt border-volt/40" : "bg-ink-850 text-fog-200 border-line hover:bg-ink-700")}
      >
        {children}
      </button>
    );
  }

  function ConfigPanel({ onStart, busy, args, setArgs, showAdv, setShowAdv, setSchema, historyPanel }) {
    const NODES_STORAGE_KEY = "mlperf_platform_nodes_v3";
    const HOSTS_DRAFT_STORAGE_KEY = "mlperf_platform_hosts_draft_v3";

    const [suite, setSuite] = useState("training");
    const [version, setVersion] = useState("v5.1");
    const [gpuType, setGpuType] = useState("H100");
    const [benchmark, setBenchmark] = useState("llama2_70b_lora");
    const [dryRun, setDryRun] = useState(false);
    const [error, setError] = useState("");
    const [nodes, setNodes] = useState(() => {
      try {
        const raw = window.localStorage.getItem(NODES_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed)
          ? parsed
              .filter((n) => n && n.host && n.gpu_type)
              .map((n) => ({ ...n, args: (n.args && typeof n.args === "object") ? n.args : {} }))
          : [];
      } catch (_) {
        return [];
      }
    });

    const [expandedArgHosts, setExpandedArgHosts] = useState(() => new Set());
    const hostsRef = useRef(null);

    const toggleNodeArgs = (host) => {
      setExpandedArgHosts((prev) => {
        const next = new Set(prev);
        if (next.has(host)) next.delete(host);
        else next.add(host);
        return next;
      });
    };

    const cap = SUPPORTED[`${suite}:${version}`] || { benchmarks: [], gpus: [] };
    const argSchema = resolveSchema(MLPERF_ARG_SCHEMAS, `${suite}:${version}`);

    useEffect(() => {
      if (setSchema) setSchema(argSchema);
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [suite, version]);

    const versions = useMemo(() => {
      if (suite === "training") return ["v4.1", "v5.1"];
      return ["v5.1", "v6.0"];
    }, [suite]);

    useEffect(() => {
      const c = SUPPORTED[`${suite}:${version}`];
      if (!c) return;
      if (!c.gpus.includes(gpuType)) setGpuType(c.gpus[0]);
      if (!c.benchmarks.includes(benchmark)) setBenchmark(c.benchmarks[0]);
      setNodes((prev) => prev.filter((n) => c.gpus.includes(n.gpu_type)));
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [suite, version]);

    useEffect(() => {
      try { window.localStorage.setItem(NODES_STORAGE_KEY, JSON.stringify(nodes)); } catch (_) {}
    }, [nodes]);

    const parseHosts = (raw) => Array.from(new Set(
      String(raw || "").split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)
    ));

    const getDraft = () => {
      if (hostsRef.current) return hostsRef.current.value || "";
      try { return window.localStorage.getItem(HOSTS_DRAFT_STORAGE_KEY) || ""; } catch (_) { return ""; }
    };

    const saveDraft = (value) => {
      try { window.localStorage.setItem(HOSTS_DRAFT_STORAGE_KEY, value || ""); } catch (_) {}
    };

    const clearDraft = () => {
      if (hostsRef.current) hostsRef.current.value = "";
      saveDraft("");
    };

    const defaultNumGpusForGpu = (gt) => {
      if (gt === "GH200") return "1";
      return "8";
    };

    const defaultTrainingArgsForGpu = (gt) => {
      const ng = defaultNumGpusForGpu(gt);
      return compactArgs({
        MLPERF_MAX_STEPS: "10",
        MLPERF_LIMIT_VAL_BATCHES: "1",
        MLPERF_VAL_CHECK_INTERVAL: "10",
        NUM_GPUS: ng,
        MLPERF_NUM_GPUS: ng,
        TP: ng,
        PP: "1",
        CP: "1",
        GBS: "128",
        MBS: "1",
        FP8: "False",
      });
    };

    const defaultArgsForNode = (gt) => {
      if (suite !== "training") return {};
      return defaultTrainingArgsForGpu(gt);
    };

    const addNodes = () => {
      setError("");
      const raw = getDraft();
      saveDraft(raw);
      const hosts = parseHosts(raw);
      if (hosts.length === 0) {
        setError("추가할 host 또는 IP를 입력하세요.");
        return;
      }

      setNodes((prev) => {
        const map = new Map(prev.map((n) => [n.host, n]));
        hosts.forEach((host) => {
          const prevNode = map.get(host);
          map.set(host, {
            host,
            gpu_type: gpuType,
            args: prevNode?.args && typeof prevNode.args === "object"
              ? prevNode.args
              : defaultArgsForNode(gpuType),
          });
        });
        return Array.from(map.values()).sort((a, b) => a.host.localeCompare(b.host));
      });
      clearDraft();
      if (hostsRef.current) hostsRef.current.focus({ preventScroll: true });
    };

    const removeNode = (host) => {
      setNodes((prev) => prev.filter((n) => n.host !== host));
      setExpandedArgHosts((prev) => {
        const next = new Set(prev);
        next.delete(host);
        return next;
      });
    };
    const clearNodes = () => { setNodes([]); setExpandedArgHosts(new Set()); setError(""); };

    const trainingArgsForNode = (node) => {
      const base = defaultTrainingArgsForGpu(node?.gpu_type || gpuType);
      const merged = compactArgs({ ...base, ...((node && node.args) || {}) });
      if (suite === "training") {
        if (!merged.MBS) merged.MBS = "1";
        if (merged.NUM_GPUS && !merged.MLPERF_NUM_GPUS) merged.MLPERF_NUM_GPUS = merged.NUM_GPUS;
      }
      return merged;
    };

    const updateNodeArgs = (host, patch) => {
      setNodes((prev) => prev.map((n) => (
        n.host === host
          ? { ...n, args: compactArgs({ ...((n.args && typeof n.args === "object") ? n.args : {}), ...(patch || {}) }) }
          : n
      )));
    };

    const resetNodeArgs = (host) => {
      setNodes((prev) => prev.map((n) => (
        n.host === host ? { ...n, args: defaultArgsForNode(n.gpu_type) } : n
      )));
    };

    const positiveIntFromArgs = (keys, sourceArgs) => {
      for (const k of keys) {
        const raw = sourceArgs && sourceArgs[k];
        if (raw === undefined || raw === null || raw === "") continue;
        const n = Number(raw);
        if (Number.isInteger(n) && n > 0) return n;
        return NaN;
      }
      return null;
    };

    const mlperfValidationErrors = useMemo(() => {
      const errs = [];
      if (suite !== "training") return errs;

      const validateOne = (node) => {
        const nodeArgs = trainingArgsForNode(node);
        const numGpus = positiveIntFromArgs(["NUM_GPUS", "MLPERF_NUM_GPUS"], nodeArgs);
        const tp = positiveIntFromArgs(["TP", "TENSOR_MODEL_PARALLEL"], nodeArgs);
        const pp = positiveIntFromArgs(["PP", "PIPELINE_MODEL_PARALLEL"], nodeArgs);
        const cp = positiveIntFromArgs(["CP", "CONTEXT_PARALLEL"], nodeArgs);
        const gbs = positiveIntFromArgs(["GBS", "GLOBAL_BATCH_SIZE"], nodeArgs);
        const mbsRaw = positiveIntFromArgs(["MBS", "MICRO_BATCH_SIZE"], nodeArgs);
        const mbs = mbsRaw === null ? 1 : mbsRaw;
        const required = [["NUM_GPUS", numGpus], ["TP", tp], ["PP", pp], ["CP", cp], ["MBS", mbs], ["GBS", gbs]];
        const missing = required.filter(([, v]) => v === null).map(([k]) => k);
        const invalid = required.filter(([, v]) => Number.isNaN(v)).map(([k]) => k);
        const prefix = node?.host ? `${node.host}: ` : "";
        if (missing.length) errs.push(`${prefix}${missing.join(", ")} 값을 입력하세요.`);
        if (invalid.length) errs.push(`${prefix}${invalid.join(", ")} 값은 1 이상의 정수여야 합니다.`);
        if (missing.length || invalid.length) return;

        const modelParallel = tp * pp * cp;
        if (modelParallel > numGpus) {
          errs.push(`${prefix}TP × PP × CP = ${modelParallel} 이 NUM_GPUS(${numGpus})보다 큽니다.`);
          return;
        }
        if (numGpus % modelParallel !== 0) {
          errs.push(`${prefix}NUM_GPUS(${numGpus})는 TP × PP × CP(${modelParallel})로 나누어떨어져야 합니다.`);
          return;
        }
        const dp = numGpus / modelParallel;
        const minGbs = mbs * dp;
        if (gbs < minGbs) {
          errs.push(`${prefix}GLOBAL_BATCH_SIZE(${gbs})는 MICRO_BATCH_SIZE(${mbs}) × DATA_PARALLEL_SIZE(${dp}) = ${minGbs} 이상이어야 합니다.`);
        }
        if (gbs % minGbs !== 0) {
          errs.push(`${prefix}GLOBAL_BATCH_SIZE(${gbs})는 MICRO_BATCH_SIZE(${mbs}) × DATA_PARALLEL_SIZE(${dp}) = ${minGbs}로 나누어떨어져야 합니다.`);
        }
      };

      nodes.forEach(validateOne);
      return errs;
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [suite, benchmark, nodes]);

    const submit = async () => {
      setError("");
      if (nodes.length === 0) {
        setError("최소 1개 이상의 node를 추가하세요.");
        return;
      }
      if (mlperfValidationErrors.length > 0) {
        setError(mlperfValidationErrors[0]);
        return;
      }

      const gpuTypes = Array.from(new Set(nodes.map((n) => n.gpu_type)));
      const hosts = nodes.map((n) => n.host);
      const nodeGpuMap = Object.fromEntries(nodes.map((n) => [n.host, n.gpu_type]));
      const runGpuType = gpuTypes.length === 1 ? gpuTypes[0] : "MIXED";
      const argsByHost = {};
      nodes.forEach((n) => { argsByHost[n.host] = suite === "training" ? trainingArgsForNode(n) : compactArgs(n.args || {}); });

      try {
        await onStart({
          kind: "mlperf",
          suite,
          version,
          gpu_type: runGpuType,
          benchmark,
          hosts,
          node_gpu_map: nodeGpuMap,
          dry_run: dryRun,
          params: { args: {}, args_by_host: argsByHost },
        });
      } catch (e) {
        setError(String(e.message || e));
      }
    };


    const nodeGpuTypes = Array.from(new Set(nodes.map((n) => n.gpu_type)));

    return (
      <>
        <aside className="space-y-6">
          <div className="rounded-xl border border-line bg-ink-850/40 p-5 shadow-panel">
            <div className="space-y-4">
              <MlperfField label="suite">
                <div className="flex gap-2 flex-wrap">
                  {["training", "inference"].map((s) => (
                    <MlperfPill key={s} active={suite === s} onClick={() => { setSuite(s); setVersion(s === "training" ? "v5.1" : "v6.0"); }}>{s}</MlperfPill>
                  ))}
                </div>
              </MlperfField>

              <MlperfField label="version">
                <div className="flex gap-2 flex-wrap">
                  {versions.map((v) => <MlperfPill key={v} active={version === v} onClick={() => setVersion(v)}>{v}</MlperfPill>)}
                </div>
              </MlperfField>

              <MlperfField label="benchmark">
                <select
                  value={benchmark}
                  onChange={(e) => setBenchmark(e.target.value)}
                  className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm focus:outline-none focus:border-volt/50 font-mono"
                >
                  {cap.benchmarks.map((b) => <option key={b} value={b}>{b}</option>)}
                </select>
              </MlperfField>

              <div className="rounded-lg border border-line bg-ink-900/40 p-3 space-y-3">
                <div className="text-[11px] uppercase tracking-[0.16em] text-fog-400 font-mono">add nodes</div>
                <MlperfField label="gpu type" hint={`${cap.gpus.length} allowed`}>
                  <select
                    value={gpuType}
                    onChange={(e) => setGpuType(e.target.value)}
                    className="w-full bg-ink-850 border border-line rounded-md px-3 py-2 text-sm focus:outline-none focus:border-volt/50 font-mono"
                  >
                    {cap.gpus.map((g) => <option key={g} value={g}>{g}</option>)}
                  </select>
                </MlperfField>
                <MlperfField label="hosts">
                  <textarea
                    ref={hostsRef}
                    defaultValue={(() => { try { return window.localStorage.getItem(HOSTS_DRAFT_STORAGE_KEY) || ""; } catch (_) { return ""; } })()}
                    onInput={(e) => saveDraft(e.currentTarget.value)}
                    rows={3}
                    spellCheck={false}
                    autoCapitalize="off"
                    autoCorrect="off"
                    inputMode="text"
                    className="w-full resize-y bg-ink-850 border border-line rounded-md px-3 py-2 text-sm font-mono text-fog-100 placeholder-fog-500 focus:outline-none focus:border-volt/50"
                  />
                </MlperfField>
                <button
                  type="button"
                  onClick={addNodes}
                  className="btn w-full py-2 rounded-md font-semibold bg-ink-700 hover:bg-ink-600 border border-line text-fog-100"
                >
                  + add node
                </button>
              </div>
            </div>
          </div>

          <div className="rounded-xl border border-line bg-ink-850/40 p-5 shadow-panel">
            {historyPanel}
          </div>
        </aside>

        <aside className="space-y-4">
          <div className="rounded-xl border border-line bg-ink-850/40 p-5 shadow-panel space-y-4">
            <div>
              <h2 className="text-[11px] uppercase tracking-[0.18em] text-fog-400 font-mono">ADDED_NODES</h2>
              <div className="text-[10px] text-fog-500 font-mono mt-1">{nodes.length} node{nodes.length === 1 ? "" : "s"} · node-specific arguments per node</div>
            </div>

            <div className="rounded-md border border-line bg-ink-850/70 min-h-[80px] p-2">
              {nodes.length === 0 ? (
                <div className="text-xs text-fog-500 italic font-mono">no nodes added</div>
              ) : (
                <div className="space-y-2 max-h-[560px] overflow-y-auto pr-1">
                  {nodes.map((n) => {
                    const effective = suite === "training" ? trainingArgsForNode(n) : compactArgs(n.args || {});
                    const mp = Number(effective.TP || 0) * Number(effective.PP || 0) * Number(effective.CP || 0);
                    const ng = Number(effective.NUM_GPUS || effective.MLPERF_NUM_GPUS || 0);
                    const dp = suite === "training" && mp > 0 && ng % mp === 0 ? ng / mp : null;
                    return (
                      <div key={n.host} className="rounded bg-ink-700/70 border border-line px-2 py-2 space-y-2">
                        <div className="flex items-center justify-between gap-2">
                          <div className="min-w-0">
                            <div className="font-mono text-xs text-fog-100 truncate">
                              <span className="dot mr-2" style={{ background: colorForHost(n.host) }}></span>
                              {n.host}
                            </div>
                            <div className="font-mono text-[10px] text-fog-500 ml-5">
                              {n.gpu_type} · TDP {tdpForGpu(n.gpu_type)}W
                              {suite === "training" && dp ? ` · NUM_GPUS ${ng} · DP ${dp}` : ""}
                            </div>
                          </div>
                          <div className="flex items-center gap-1 shrink-0">
                            <button
                              type="button"
                              onClick={() => toggleNodeArgs(n.host)}
                              className={"btn px-2 py-1 rounded text-[10px] font-mono border " +
                                (expandedArgHosts.has(n.host)
                                  ? "bg-volt/10 text-volt border-volt/40"
                                  : "border-line bg-ink-850 hover:bg-ink-700 text-fog-300")}
                            >
                              {expandedArgHosts.has(n.host) ? "hide args" : "arg 설정"}
                            </button>
                            {suite === "training" && expandedArgHosts.has(n.host) && (
                              <button
                                type="button"
                                onClick={() => resetNodeArgs(n.host)}
                                className="btn px-2 py-1 rounded text-[10px] font-mono border border-line bg-ink-850 hover:bg-ink-700 text-fog-300"
                                title="이 노드의 argument를 GPU 기본값으로 초기화"
                              >
                                reset
                              </button>
                            )}
                            <button
                              type="button"
                              onClick={() => removeNode(n.host)}
                              className="btn px-2 py-1 rounded text-[10px] font-mono border border-line bg-ink-850 hover:bg-err/10 text-fog-300 hover:text-err"
                            >
                              remove
                            </button>
                          </div>
                        </div>
                        {expandedArgHosts.has(n.host) && (
                          <div className="border-t border-line/70 pt-2">
                            <div className="text-[10px] text-fog-500 font-mono mb-2">
                              node-specific arguments · MBS controls micro batch size
                            </div>
                            <AdvancedArgs
                              schema={argSchema}
                              value={(n.args && typeof n.args === "object") ? n.args : {}}
                              onChange={(next) => updateNodeArgs(n.host, next)}
                              title={`${n.host} arguments`}
                              alwaysOpen={true}
                            />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {nodes.length > 0 && (
              <div className="flex items-center justify-between gap-2">
                <div className="text-[11px] font-mono text-fog-500">
                  {`power y-axis max: ${powerDomainForHosts(nodes.map((n) => n.host), Object.fromEntries(nodes.map((n) => [n.host, n.gpu_type])), nodeGpuTypes[0])}W`}
                </div>
                <button
                  type="button"
                  onClick={clearNodes}
                  className="btn shrink-0 px-2 py-1 text-[10px] rounded bg-ink-700 hover:bg-ink-600 border border-line text-fog-300 font-mono"
                >
                  clear
                </button>
              </div>
            )}

            <label className="flex items-center gap-2 text-sm select-none cursor-pointer">
              <input type="checkbox" checked={dryRun} onChange={(e) => setDryRun(e.target.checked)} className="accent-volt" />
              <span className="text-fog-200">dry-run (validate without executing)</span>
            </label>

            {mlperfValidationErrors.length > 0 && (

  const ConfigPanelStable = React.memo(
    ConfigPanel,
    (prev, next) =>

  function runDurationSec(r) {
    const started = Number(r?.started_at || r?.created_at || 0);
    const ended = Number(r?.finished_at || r?.ended_at || 0);
    if (started && ended && ended >= started) return ended - started;
    if (started && ["pending", "running", "analyzing"].includes(String(r?.status || "").toLowerCase())) return Date.now() / 1000 - started;
    return null;
  }

  function runPinnedLabel(run, pinnedRunIds) {
    const rid = run?.run_id;
    if (!rid || !pinnedRunIds) return "";
    const has = pinnedRunIds instanceof Set ? pinnedRunIds.has(rid) : Array.isArray(pinnedRunIds) && pinnedRunIds.includes(rid);
    return has ? "반영 완료" : "";
  }

  function RunHistory({ runs, currentId, onPick, onDelete, pinnedRunIds }) {
    const [pendingDeleteRun, setPendingDeleteRun] = useState(null);

    const confirmDelete = async () => {
      if (!pendingDeleteRun?.run_id || !onDelete) return;
      setDeleteBusy(true);
      try {
        await onDelete(pendingDeleteRun.run_id);
        setPendingDeleteRun(null);

        setDeleteBusy(false);

    if (!runs.length) {

        <div className="text-xs text-fog-500 font-mono italic">

    return (
      <>
        <div className="space-y-2 max-h-[440px] overflow-y-auto pr-1">

            const active = r.run_id === currentId;
            const pinnedLabel = runPinnedLabel(r, pinnedRunIds);
            return (
              <div
                key={r.run_id}
                className={
                  "run-history-simple-card rounded-xl border " +

                      <div className="text-[11px] text-fog-500 font-mono mt-1 truncate">

  function MiniHistoryChart({ title, series, field, max = "auto", suffix = "", run }) {
    const hosts = Object.keys(series || {});
    if (!hosts.length) return <div className="mini-history-empty">no monitoring data</div>;
    const rows = hosts.map((h) => (series[h] || []).map((sample) => filterGpuSampleForRun(sample, run, h)).map((s) => ({ ts: s.ts, v: Number(s[field] || 0) })));
    const vals = rows.flat().map((p) => p.v).filter((v) => Number.isFinite(v));
    const ymax = max === "auto" ? Math.max(1, ...vals) : Number(max || 1);
    const width = 240, height = 86, pad = 8;
    return (
      <div className="mini-history-chart">
        <div className="mini-history-title">{title}</div>
        <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
          <line x1="0" y1={height-pad} x2={width} y2={height-pad} className="mh-grid" />
          {hosts.map((h, idx) => {
            const arr = rows[idx];
            if (!arr.length) return null;
            const step = (width - pad * 2) / Math.max(1, arr.length - 1);
            const pts = arr.map((p, i) => {
              const x = pad + i * step;
              const y = pad + (1 - Math.min(ymax, Math.max(0, p.v)) / ymax) * (height - pad * 2);
              return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(" ");
            return <polyline key={h} points={pts} fill="none" stroke={colorForHost(h)} strokeWidth="1.7" />;
          })}
        </svg>
        <div className="mini-history-legend">
          {hosts.map((h) => <span key={h}><span className="dot" style={{ background: colorForHost(h) }}></span>{h}</span>)}
        </div>
      </div>
    );
  }

  // GPU charts: each has multiple lines (one per host), backed by per-host
  // sample buffers we keep in App state. Charts render a unified time series
  // by aligning samples to the latest 60 ticks of each host.
  function GpuDetailTooltip({ active, payload, label, dataKey }) {
    if (!active || !payload || !payload.length) return null;
    const row = payload[0]?.payload || {};
    const isUtil = dataKey === "util_avg" || dataKey === "util_max";
    const isPower = dataKey === "power_avg_w" || dataKey === "power_total_w";
    return (
      <div className="gpu-detail-tooltip rounded-md border border-line bg-ink-900/95 px-3 py-2 text-[11px] font-mono shadow-panel">
        <div className="text-volt mb-1">{label}</div>
        {payload.map((p) => {
          const h = p.dataKey;
          const details = row[`__details_${h}`] || [];
          return (
            <div key={h} className="gpu-tooltip-host">
              <div className="flex items-center gap-1.5 text-fog-100">
                <span className="dot" style={{ background: colorForHost(h) }}></span>
                <span>{h}</span>
                <b className="ml-auto">{Number(p.value || 0).toFixed(isPower ? 1 : 0)}{isUtil ? "%" : isPower ? " W" : ""}</b>
              </div>
              {details.length > 0 && (
                <div className="gpu-tooltip-detail">
                  {details.map((g) => {
                    const val = isUtil ? g.util : isPower ? g.power_w : null;
                    if (val == null) return null;
                    return <span key={g.index}>GPU{g.index}: {Number(val || 0).toFixed(isPower ? 1 : 0)}{isUtil ? "%" : isPower ? " W" : ""}</span>;
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  }

  function GpuChart({ title, unit, hosts, byHost, dataKey, domain, color, run }) {
    // Build a wide-format array: [{ ts, host1: v, host2: v, __details_host: [...] }, ...]
    // We use the union of buffered timestamps per host so the slider can pan back in time
    // without exposing Recharts' range-resize travellers.
    const data = useMemo(() => {
      const tsSet = new Set();
      const perHost = {};
      const perHostDetails = {};
      hosts.forEach((h) => {
        const arr = (byHost[h] || []).map((sample) => filterGpuSampleForRun(sample, run, h));
        perHost[h] = new Map();
        perHostDetails[h] = new Map();
        arr.forEach((s) => {
          const t = Math.floor(s.ts);
          tsSet.add(t);
          perHost[h].set(t, s[dataKey]);
          if (Array.isArray(s.per_gpu)) perHostDetails[h].set(t, s.per_gpu);
        });
      });
      const tsArr = Array.from(tsSet).sort((a, b) => a - b);
      return tsArr.map((t) => {
        const row = { ts: t, label: fmtTime(t) };
        hosts.forEach((h) => {
          const v = perHost[h]?.get(t);
          if (v != null) row[h] = +(+v).toFixed(2);
          row[`__details_${h}`] = perHostDetails[h]?.get(t) || [];
        });
        return row;
      });
    }, [hosts, byHost, dataKey, run]);

    const viewWindow = Math.min(180, Math.max(1, data.length));
    const maxStart = Math.max(0, data.length - viewWindow);
    const [viewStart, setViewStart] = useState(0);
    const [lockLatest, setLockLatest] = useState(true);

    useEffect(() => {
      if (!data.length) {
        if (viewStart !== 0) setViewStart(0);
        return;
      }
      if (lockLatest) {
        if (viewStart !== maxStart) setViewStart(maxStart);
        return;
      }
      if (viewStart > maxStart) setViewStart(maxStart);
    }, [data.length, maxStart, lockLatest, viewStart]);

    const visibleStart = Math.min(viewStart, maxStart);
    const visibleData = data.slice(visibleStart, visibleStart + viewWindow);
    const sliderPct = maxStart > 0 ? (visibleStart / maxStart) * 100 : 100;
    const rangeLabel = data.length
      ? `${data[visibleStart]?.label || "—"} ~ ${data[Math.min(data.length - 1, visibleStart + viewWindow - 1)]?.label || "—"}`
      : "—";

    const handleRangeChange = (e) => {
      const next = Math.max(0, Math.min(maxStart, Number(e.target.value || 0)));
      setViewStart(next);
      setLockLatest(next >= maxStart);
    };

    return (
      <div className="rounded-lg border border-line bg-ink-850/70 shadow-panel p-3 gpu-chart-card">
        <div className="flex items-center justify-between mb-2 gap-3">
          <div>
            <div className="text-[11px] uppercase tracking-[0.16em] font-mono text-fog-400">{title}</div>
            {unit && <div className="text-[10px] text-fog-500 font-mono">{unit}</div>}
          </div>
          <div className="flex flex-wrap items-center gap-1.5 max-w-[68%] justify-end">
            {data.length > viewWindow && (
              <button type="button" className={"chart-latest-btn " + (lockLatest ? "active" : "")} onClick={() => setLockLatest(true)}>latest</button>
            )}
            {hosts.map((h) => (
              <div key={h} className="flex items-center gap-1.5 text-[10px] font-mono text-fog-300">
                <span className="dot" style={{ background: colorForHost(h) }}></span>
                <span className="truncate max-w-[80px]">{h}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="gpu-chart-canvas" style={{ width: "100%", height: 205 }}>
          <ResponsiveContainer>
            <LineChart data={visibleData} margin={{ top: 4, right: 12, left: 8, bottom: 8 }}>
              <CartesianGrid strokeDasharray="2 4" vertical={false} />
              <XAxis dataKey="label" tickLine={false} axisLine={false} minTickGap={28} />
              <YAxis
                domain={domain}
                tickLine={false}
                axisLine={false}
                width={64}
                allowDecimals={false}
                tickFormatter={(v) => String(Math.round(v))}
              />
              <Tooltip content={<GpuDetailTooltip dataKey={dataKey} />} />
              {hosts.map((h) => (
                <Line key={h} type="monotone" dataKey={h} stroke={colorForHost(h)}
                      strokeWidth={1.6} dot={false} isAnimationActive={false}
                      connectNulls />
              ))}
            </LineChart>
          </ResponsiveContainer>
        </div>
        {data.length > viewWindow && (
          <div className="gpu-range-control" style={{ "--range-progress": `${sliderPct}%` }}>
            <input
              aria-label={`${title} timeline slider`}
              type="range"
              min="0"
              max={maxStart}
              step="1"
              value={visibleStart}
              onChange={handleRangeChange}
            />
            <div className="gpu-range-meta">
              <span>{rangeLabel}</span>
              <span>{visibleData.length}/{data.length} samples</span>
            </div>
          </div>
        )}
      </div>
    );
  }

  // Per-NIC live bandwidth + GPU binding (from the latest sample's `nics`).
  // Answers: which pod/GPUs -> which NIC -> how much tx/rx right now.
  function NicMonitor({ hosts, byHost }) {
    const rows = useMemo(() => {
      const out = [];
      hosts.forEach((h) => {
        const arr = byHost[h] || [];
        const last = arr[arr.length - 1];
        const nics = (last && last.nics) || [];
        nics.forEach((n) => out.push({ host: h, ...n }));
      });
      return out.sort((a, b) => (a.host + a.device).localeCompare(b.host + b.device));
    }, [hosts, byHost]);

    const bar = (v, max) => Math.max(2, Math.min(100, (v / (max || 1)) * 100));
    const peak = Math.max(25, ...rows.map((r) => Math.max(r.tx_gbps || 0, r.rx_gbps || 0)));

    return (
      <div className="rounded-lg border border-line bg-ink-850/70 shadow-panel p-3">
        <div className="mb-2">
          <div className="text-[11px] uppercase tracking-[0.16em] font-mono text-fog-400">nic bandwidth</div>
        </div>
        {rows.length === 0 ? (
          <div className="text-[11px] text-fog-500 py-4 text-center">NIC 데이터 없음</div>
        ) : (
          <div className="overflow-x-auto">
            <table className="dt">
              <thead><tr>
                <th>host</th><th>nic</th><th>gpus</th><th>tx (Gb/s)</th><th>rx (Gb/s)</th><th style={{width:"30%"}}>util</th>
              </tr></thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.host + r.device}>
                    <td className="font-mono text-[12px] text-fog-300">{r.host}</td>
                    <td><span className="chip chip-cool">{r.device}</span></td>
                    <td className="font-mono text-[12px] text-fog-300">{(r.gpus && r.gpus.length) ? r.gpus.join(",") : "—"}</td>
                    <td className="font-mono text-[12px] text-ok">{(r.tx_gbps ?? 0).toFixed(2)}</td>
                    <td className="font-mono text-[12px] text-cool">{(r.rx_gbps ?? 0).toFixed(2)}</td>
                    <td>
                      <div className="flex gap-1 items-center h-4">
                        <div className="flex-1 h-1.5 rounded bg-ink-900 overflow-hidden">
                          <div className="h-full bg-ok" style={{ width: bar(r.tx_gbps, peak) + "%" }}></div>
                        </div>
                        <div className="flex-1 h-1.5 rounded bg-ink-900 overflow-hidden">
                          <div className="h-full bg-cool" style={{ width: bar(r.rx_gbps, peak) + "%" }}></div>
                        </div>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    );
  }

  function LogStream({ run, logs, hostFilter: controlledHostFilter, onHostFilterChange }) {
    const containerRef = useRef(null);
    const [autoScroll, setAutoScroll] = useState(true);
    const [localHostFilter, setLocalHostFilter] = useState("");
    const hostFilter = controlledHostFilter !== undefined ? controlledHostFilter : localHostFilter;
    const setHostFilter = (next) => {
      if (onHostFilterChange) onHostFilterChange(next);
      else setLocalHostFilter(next);
    };

    useEffect(() => {
      if (!autoScroll || !containerRef.current) return;
      containerRef.current.scrollTop = containerRef.current.scrollHeight;
    }, [logs, autoScroll]);

    const onScroll = () => {
      // Keep the user's auto-scroll setting stable.  Do not auto-disable it
      // merely because the log panel briefly moves while new lines arrive.
    };

    const hosts = run ? run.hosts : [];

    useEffect(() => {
      if (hostFilter && !hosts.includes(hostFilter)) setHostFilter("");
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [run?.run_id, hosts.join("|")]);

    const filtered = hostFilter
      ? logs.filter((l) => l.host === hostFilter)
      : logs;

    const levelClass = (l) => {
      if (l.line.match(/^\[ERROR\]|^\[FATAL\]/)) return "log-error";
      if (l.line.match(/^\[WARN\]/)) return "log-warn";
      if (l.line.match(/^\[PHASE\]/)) return "log-phase";
      if (l.level === "error") return "log-error";
      if (l.level === "warn")  return "log-warn";
      if (l.level === "phase") return "log-phase";
      return "log-info";
    };

    return (
      <div className="log-stream rounded-lg border border-line bg-ink-850/70 shadow-panel flex flex-col h-full">
        <div className="flex items-center justify-between border-b border-line px-3 py-2">
          <div className="flex items-center gap-3">
            <div className="text-[11px] uppercase tracking-[0.16em] font-mono text-fog-400">
              live log
            </div>
            <span className="text-[10px] font-mono text-fog-500">{filtered.length} lines</span>
          </div>
          <div className="flex items-center gap-2">
            <select value={hostFilter} onChange={(e) => setHostFilter(e.target.value)}
                    className="bg-ink-700 border border-line text-xs rounded px-2 py-1 font-mono">
              <option value="">all hosts</option>
              {hosts.map((h) => <option key={h} value={h}>{h}</option>)}
            </select>
            <label className="flex items-center gap-1.5 text-xs text-fog-300">
              <input type="checkbox" checked={autoScroll}
                     onChange={(e) => setAutoScroll(e.target.checked)}
                     className="accent-volt" />
              auto
            </label>
          </div>
        </div>
        <div ref={containerRef} onScroll={onScroll}
             className="flex-1 overflow-y-auto px-3 py-2 font-mono text-[12px]"
             style={{ minHeight: 0 }}>
          {filtered.length === 0 && (
            <div className="text-fog-500 italic">no log output yet…</div>
          )}
          {filtered.map((l, i) => (
            <div key={i} className={"log-line " + levelClass(l)}>
              <span className="log-time">{fmtTime(l.ts)}</span>
              {l.host && (
                <>
                  <span className="text-fog-500"> · </span>
                  <span className="log-host" style={{ color: colorForHost(l.host) }}>
                    [{l.host}]
                  </span>
                </>
              )}
              <span> {l.line}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function ResultTable({ results, pinToDashboard }) {
    if (!results) return null;
    const rows = results.rows || [];

    const metricEntries = (m) => {
      if (!m) return [];
      if (Array.isArray(m.metric_display) && m.metric_display.length) {
        return m.metric_display;
      }
      const skip = new Set(["kind", "_source", "status", "result_hint", "log_dir", "metric_display", "metric_values"]);
      return Object.keys(m)
        .filter((k) => !skip.has(k) && m[k] != null && typeof m[k] !== "object")
        .slice(0, 8)
        .map((k) => ({ key: k, value: m[k] }));
    };

    const summaryEntries = (row) => {
      const s = row?.summary || {};
      const keys = [
        "binding_verify", "gpu_verify", "nic_verify",
        "expected_gpus", "actual_gpus", "expected_gpu_uuids", "actual_gpu_uuids",
        "deploy_gpus", "deploy_nics", "actual_nics", "pod_node"
      ];
      return keys
        .filter((k) => s[k] != null && String(s[k]).trim() !== "")
        .map((k) => ({ key: k, value: s[k] }));
    };

    const fmtMetricValue = (v) => {
      if (v == null) return "—";
      if (typeof v === "number") return fmtNum(v, Math.abs(v) < 1 ? 4 : 2);
      if (typeof v === "boolean") return v ? "true" : "false";
      return String(v);
    };

    const copyPath = async (path) => {
      if (!path) return;
      try {
        await navigator.clipboard.writeText(path);
      } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = path;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand("copy"); } catch (_) {}
        document.body.removeChild(ta);
      }
    };


    const normalizeErrorMessages = (row) => {
      const items = [];
      if (Array.isArray(row.error_messages)) {
        row.error_messages.forEach((v) => {
          if (v != null && String(v).trim()) items.push(String(v).trim());
        });
      }
      if (row.result_error && String(row.result_error).trim()) {
        items.push(String(row.result_error).trim());
      }
      return Array.from(new Set(items));
    };

    const isErrorStatus = (status) => {
      return ["error", "failed", "partial"].includes(String(status || "").toLowerCase());
    };

    return (
      <div className="rounded-lg border border-line bg-ink-850/70 shadow-panel">
        <div className="border-b border-line px-3 py-2 flex items-center justify-between">
          <div>
            <div className="text-[11px] uppercase tracking-[0.16em] font-mono text-fog-400">
              result analysis
            </div>
            <div className="text-[10px] text-fog-500 font-mono">
              {results.suite} · {results.version} · {results.benchmark}
            </div>
          </div>
