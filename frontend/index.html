      MLPERF_INFER_TARGET_QPS: "Target QPS",
      MLPERF_INFER_OFFLINE_QPS: "Offline QPS",
      MLPERF_INFER_MIN_DURATION_MS: "Min duration (ms)",
      MLPERF_INFER_MIN_QUERY_COUNT: "Min query count",
      MLPERF_INFER_CONFIG_VER: "Config version",
      MLPERF_INFER_TEST_MODE: "Test mode",
      MLPERF_INFER_TP_SIZE: "Tensor parallel size",
      MLPERF_INFER_GPU_BATCH_SIZE: "GPU batch size",
      MLPERF_INFER_ACCURACY_TARGET: "Accuracy target",
      MLPERF_RUN_ARGS_EXTRA: "Additional run args",
    };
    const activeKeysFor = (v) => Object.keys(DEFAULT_HP[v] || DEFAULT_HP["v5.1"]);
    const normalizeHp = (raw, v) => {
      const keys = activeKeysFor(v);
      const base = DEFAULT_HP[v] || DEFAULT_HP["v5.1"];
      const src = raw || {};
      const out = {};
      keys.forEach((k) => {
        const val = src[k];
        out[k] = val === undefined || val === null ? base[k] : String(val);
      });
      return out;
    };
    const [envMode, setEnvMode] = useState(persisted.envMode || "bare");
    const [version, setVersionRaw] = useState(BENCH[persisted.version] ? persisted.version : "v5.1");
    const [benchmark, setBenchmark] = useState(persisted.benchmark || "llama2_70b");
    const [nodes, setNodes] = useState(persisted.nodes || [{ host: "gpu-node05", gpus: 4 }]);
    const [hp, setHp] = useState(normalizeHp(persisted.hp, BENCH[persisted.version] ? persisted.version : "v5.1"));
    const [hpDraft, setHpDraft] = useState(hp);
    const [showHp, setShowHp] = useState(false);
    const [gpuSelection, setGpuSelection] = useState(persisted.gpuSelection || {});
    const [gpuSelectionDraft, setGpuSelectionDraft] = useState(gpuSelection);
    const [hostArgs, setHostArgs] = useState(persisted.hostArgs || {});
    const [hostArgsDraft, setHostArgsDraft] = useState(hostArgs);
    const [error, setError] = useState("");
    const Field = BenchField;
    const setVersion = (next) => {
      setVersionRaw(next);
      setBenchmark((BENCH[next] || ["llama2_70b"])[0]);
      const normalized = normalizeHp(hp, next);
      setHp(normalized);
      setHpDraft(normalized);
    };

    useEffect(() => {
      const snap = { envMode, version, benchmark, nodes, hp, gpuSelection };
      try { window.localStorage.setItem(KEY, JSON.stringify(snap)); } catch (_) {}
    }, [envMode, version, benchmark, nodes, hp, gpuSelection]);

    const cleanNodes = () => (nodes || []).map((n) => ({ host: String(n.host || "").trim(), gpus: Number(n.gpus || 0) })).filter((n) => n.host && n.gpus > 0);
    const displayArgs = () => {
      const current = normalizeHp(hp, version);
      const items = activeKeysFor(version)
        .filter((k) => k !== "MLPERF_INFER_SCENARIO")
        .filter((k) => current[k] !== undefined && current[k] !== null && String(current[k]).trim() !== "")
        .map((k) => [LABELS[k] || k, current[k]]);
      if (envMode === "bare") {
        cleanNodes().forEach((n) => {
          items.push([`NUM_GPUS · ${n.host}`, String(n.gpus || 1)]);
        });
        Object.entries(cleanGpuSelectionMap(gpuSelection, cleanNodes().map((n) => n.host))).forEach(([host, v]) => {
          items.push([`CUDA_VISIBLE_DEVICES · ${host}`, v]);
        });
      }
      return items;
    };
    const inferTotalGpus = () => Math.max(1, cleanNodes().reduce((acc, n) => acc + Number(n.gpus || 0), 0) || 1);
    const args = () => {
      const current = normalizeHp(hp, version);
      const out = { MLPERF_INFER_BENCHMARK: benchmark, MLPERF_INFER_SCENARIO: "Offline" };
      if (version === "v6.0" && !String(current.MLPERF_INFER_TP_SIZE || "").trim()) {
        out.MLPERF_INFER_TP_SIZE = String(inferTotalGpus());
      }
      activeKeysFor(version).forEach((k) => {
        if (k === "MLPERF_INFER_SCENARIO") return;
        const v = current[k];
        if (v !== undefined && v !== null && String(v).trim() !== "") out[k] = v;
      });
      return out;
    };
    const submit = async () => {
      setError("");
      const ns = cleanNodes();
      if (!ns.length) { setError("GPU 노드를 1개 이상 추가하세요."); return; }
      const hosts = ns.map((n) => n.host);
      const node_gpu_map = Object.fromEntries(hosts.map((h) => [h, "H100"]));
      const kind = "mlperf";
      try {
        const selected = envMode === "bare" ? await resolveBareMetalGpuMap(ns, gpuSelection) : {};
        await onStart({ kind, suite: "inference", version, benchmark, gpu_type: "H100", hosts, node_gpu_map, dry_run: false, params: { runtime_env: envMode, args: args(), gpus_per_node: ns[0]?.gpus || 1, selected_gpus_by_host: selected } });
      } catch (e) { setError(String(e.message || e)); }
    };

    const openHpModal = async () => {
      setHpDraft(normalizeHp(hp, version));
      try {
        setGpuSelectionDraft(envMode === "bare" ? await prefillBareMetalGpuMap(cleanNodes(), gpuSelection) : {});
        setShowHp(true);
      } catch (e) { setError(String(e.message || e)); }
    };

    const renderHpFields = () => {
      const draft = normalizeHp(hpDraft, version);
      const patch = (k, v) => setHpDraft({ ...draft, [k]: v });
      if (version === "v6.0") {
        return (
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            <Field label="Tensor parallel size"><NumberStepperInput min={1} value={draft.MLPERF_INFER_TP_SIZE || String(inferTotalGpus())} onChange={(v) => patch("MLPERF_INFER_TP_SIZE", v)} /></Field>
            <Field label="GPU batch size"><NumberStepperInput min={1} value={draft.MLPERF_INFER_GPU_BATCH_SIZE || ""} onChange={(v) => patch("MLPERF_INFER_GPU_BATCH_SIZE", v)} /></Field>
            <Field label="Offline QPS"><input className="inp" value={draft.MLPERF_INFER_OFFLINE_QPS || ""} onChange={(e) => patch("MLPERF_INFER_OFFLINE_QPS", e.target.value)} /></Field>
            <Field label="Min duration (ms)"><NumberStepperInput min={1} value={draft.MLPERF_INFER_MIN_DURATION_MS || ""} onChange={(v) => patch("MLPERF_INFER_MIN_DURATION_MS", v)} /></Field>
            <Field label="Min query count"><NumberStepperInput min={1} value={draft.MLPERF_INFER_MIN_QUERY_COUNT || ""} onChange={(v) => patch("MLPERF_INFER_MIN_QUERY_COUNT", v)} /></Field>
            <Field label="Accuracy target"><select className="inp" value={draft.MLPERF_INFER_ACCURACY_TARGET || ".999"} onChange={(e) => patch("MLPERF_INFER_ACCURACY_TARGET", e.target.value)}>{[".999", ".99"].map((v) => <option key={v} value={v}>{v}</option>)}</select></Field>
            <Field label="Test mode"><select className="inp" value={draft.MLPERF_INFER_TEST_MODE || "AccuracyOnly"} onChange={(e) => patch("MLPERF_INFER_TEST_MODE", e.target.value)}>{["AccuracyOnly", "PerformanceOnly", "SubmissionRun"].map((v) => <option key={v} value={v}>{v}</option>)}</select></Field>
            <Field label="Additional run args"><input className="inp" value={draft.MLPERF_RUN_ARGS_EXTRA || ""} onChange={(e) => patch("MLPERF_RUN_ARGS_EXTRA", e.target.value)} placeholder="optional" /></Field>
          </div>
        );
      }
      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <Field label="Target QPS"><input className="inp" value={draft.MLPERF_INFER_TARGET_QPS || ""} onChange={(e) => patch("MLPERF_INFER_TARGET_QPS", e.target.value)} placeholder="optional" /></Field>
          <Field label="Min duration (ms)"><NumberStepperInput min={1} value={draft.MLPERF_INFER_MIN_DURATION_MS || ""} onChange={(v) => patch("MLPERF_INFER_MIN_DURATION_MS", v)} /></Field>
          <Field label="Min query count"><NumberStepperInput min={1} value={draft.MLPERF_INFER_MIN_QUERY_COUNT || ""} onChange={(v) => patch("MLPERF_INFER_MIN_QUERY_COUNT", v)} placeholder="optional" /></Field>
          <Field label="Config version"><select className="inp" value={draft.MLPERF_INFER_CONFIG_VER || "high_accuracy"} onChange={(e) => patch("MLPERF_INFER_CONFIG_VER", e.target.value)}>{["high_accuracy", "default", "maxq"].map((v) => <option key={v} value={v}>{v}</option>)}</select></Field>
          <Field label="Test mode"><select className="inp" value={draft.MLPERF_INFER_TEST_MODE || "AccuracyOnly"} onChange={(e) => patch("MLPERF_INFER_TEST_MODE", e.target.value)}>{["AccuracyOnly", "PerformanceOnly", "SubmissionRun"].map((v) => <option key={v} value={v}>{v}</option>)}</select></Field>
          <Field label="Additional run args"><input className="inp" value={draft.MLPERF_RUN_ARGS_EXTRA || ""} onChange={(e) => patch("MLPERF_RUN_ARGS_EXTRA", e.target.value)} placeholder="optional" /></Field>
        </div>
      );
    };

    return (
      <div className="space-y-4">
        <div className="config-stage-head config-stage-head-run">
          <ConfigStageTitle />
          <div className="basic-settings-inline basic-settings-inference run-inline test-kind-selector">
            <Field label="version"><select className="inp" value={version} onChange={(e) => setVersion(e.target.value)}>{Object.keys(BENCH).map((v) => <option key={v} value={v}>{v}</option>)}</select></Field>
            <Field label="model"><select className="inp" value={benchmark} onChange={(e) => setBenchmark(e.target.value)}>{(BENCH[version] || []).map((b) => <option key={b} value={b}>{b}</option>)}</select></Field>
            <EnvSelector value={envMode} onChange={setEnvMode} />
            <button className="btn-neon run-main-button" onClick={submit} disabled={busy}>{!busy && <Icon name="play" className="w-4 h-4" />}{busy ? "시작 중…" : "Run Inference"}</button>
          </div>
        </div>
        <div className="config-main-grid">
          <div className="control-card node-zone">
            <div className="control-title"><span className="sec-ico"><Icon name="nodes" /></span>GPU 노드 설정{envMode === "k8s" && <InfoTip text="테스트 클러스터 관리 탭에서 Warewulf 클러스터에 추가되었는지, K8s worker node로 추가되었는지 확인하세요." />}</div>
            <NodeAdder title="Inference nodes" nodes={nodes} setNodes={setNodes} defaultGpus={4} showClusterStatus={envMode === "k8s"} />
          </div>
          <div className="control-card is-hp hp-zone">
            <div className="control-title"><span className="sec-ico"><Icon name="settings" /></span>Hyperparameters 설정</div>
            <div className="flex-1 min-h-0 overflow-auto pr-1"><HpKeyValueGrid items={displayArgs()} /></div>
            <button className="btn-param mt-auto" onClick={openHpModal}><Icon name="settings" className="w-4 h-4" /> 세부 파라미터 수정</button>
          </div>
        </div>
        {error && <div className="text-[12.5px] px-3 py-2 rounded-lg border border-err/30 bg-err/10 text-err">{error}</div>}
        {showHp && (
          <ModalShell title="MLPerf Inference 세부 파라미터" onClose={() => setShowHp(false)} onClear={() => { setHpDraft(normalizeHp({}, version)); setGpuSelectionDraft({}); }} onSave={() => { setHp(normalizeHp(hpDraft, version)); setGpuSelection(cleanGpuSelectionMap(gpuSelectionDraft, cleanNodes().map((n) => n.host))); setShowHp(false); }}>
            <div className="space-y-4">
              {renderHpFields()}
              {envMode === "bare" && <GpuSelectionFields nodes={cleanNodes()} value={gpuSelectionDraft} onChange={setGpuSelectionDraft} />}
            </div>
          </ModalShell>
        )}
      </div>
    );
  }

  const InferenceMlperfConfigStable = React.memo(
    InferenceMlperfConfig,
    (prev, next) => prev.busy === next.busy
  );

  function RunMetaStrip({ run, modeLabel }) {
    const p = run?.params || {};
    const chips = [
      ["run", run?.run_id || "idle"],
      ["status", run?.status || "idle"],
      ["nodes", `${(run?.hosts || []).length}`],
    ];
    if (run?.benchmark && run.benchmark !== "—") chips.push(["model", run.benchmark]);
    if (p.model_path || p.model) chips.push(["model", p.model_path || p.model]);
    if (modeLabel) chips.push(["mode", modeLabel]);
    return (
      <div className="run-meta-strip">
        {chips.map(([k, v]) => (
          <span key={k} className="run-meta-chip"><span>{k}</span><strong title={String(v)}>{String(v)}</strong></span>
        ))}
      </div>
    );
  }

  const resultScalar = (v) => {
    if (v == null) return false;
    if (["string", "number", "boolean"].includes(typeof v)) return true;
    return false;
  };

  const metricKeyNorm = (k) => String(k || "").trim().toLowerCase().replace(/[\s\-]+/g, "_");
  const METRIC_BLOCKLIST = new Set([
    "_source", "source", "kind", "_kind", "status", "actual_status", "result_hint",
    "log_dir", "log_path", "metric_display", "metric_values", "metrics", "summary",
    "global_batch_size", "gbs", "batch_size", "exit_code", "return_code", "host", "hostname", "node", "node_name",
    "model", "benchmark", "suite", "version", "gpu_type", "scenario", "mode", "run_id",
  ]);
  const METRIC_ALLOWLIST = new Set([
    "eval_accuracy", "accuracy", "eval_error", "validation_loss", "valid_loss", "loss", "train_loss",
    "perplexity", "train_step_time", "step_time", "validation_time", "duration_sec", "elapsed_sec",
    "samples_per_second", "samples_per_sec", "tokens_per_second", "tokens_per_sec", "token_per_sec",
    "output_tokens_per_second", "output_throughput", "total_token_throughput", "request_throughput",
    "requests_per_second", "qps", "ttft_ms", "mean_ttft_ms", "median_ttft_ms", "p50_ttft_ms",
    "p90_ttft_ms", "p95_ttft_ms", "p99_ttft_ms", "tpot_ms", "mean_tpot_ms", "median_tpot_ms",
    "itl_ms", "mean_itl_ms", "latency_ms", "mean_latency_ms", "p50_latency_ms", "p90_latency_ms",
    "p95_latency_ms", "p99_latency_ms", "time_to_train", "train_time", "throughput",
  ]);
  const isImportantMetricKey = (k) => {
    const nk = metricKeyNorm(k);
    if (!nk || METRIC_BLOCKLIST.has(nk)) return false;
    if (METRIC_ALLOWLIST.has(nk)) return true;
    return /(accuracy|perplexity|loss|throughput|token.*sec|tok.*s|request.*sec|qps|latency|ttft|tpot|itl|duration|elapsed|time_to_train|samples.*sec|samples_per_second|p50|p90|p95|p99)/.test(nk)
      && !/(batch|global_batch|scenario|status|source|kind|path|dir|exit|return)/.test(nk);
  };
  const prettyMetricName = (k) => {
    const map = {
      eval_accuracy: "Eval Accuracy",
      train_loss: "Train Loss",
      train_step_time: "Train Step Time",
      validation_time: "Validation Time",
      samples_per_second: "Samples / sec",
      tokens_per_second: "Tokens / sec",
      output_throughput: "Output Throughput",
      request_throughput: "Request Throughput",
      mean_ttft_ms: "Mean TTFT (ms)",
      median_ttft_ms: "Median TTFT (ms)",
      mean_tpot_ms: "Mean TPOT (ms)",
      median_tpot_ms: "Median TPOT (ms)",
      duration_sec: "Duration (sec)",
      perplexity: "Perplexity",
    };
    const nk = metricKeyNorm(k);
    if (map[nk]) return map[nk];
    return String(k || "").replace(/_/g, " ").replace(/\w/g, (c) => c.toUpperCase());
  };

  const resultRowMetrics = (row) => {
    const out = [];
    const push = (k, v) => {
      if (!resultScalar(v)) return;
      if (!isImportantMetricKey(k)) return;
      const nk = metricKeyNorm(k);
      if (out.some(([kk]) => metricKeyNorm(kk) === nk)) return;
      out.push([k, v]);
    };
    if (Array.isArray(row?.metric_display)) {
      row.metric_display.forEach((item) => {
        if (item && typeof item === "object") push(item.key ?? item.name, item.value);
      });
    }
    [row?.metric_values, row?.metrics, row?.summary, row].filter((x) => x && typeof x === "object").forEach((obj) => {
      Object.entries(obj).forEach(([k, v]) => push(k, v));
    });
    return out.slice(0, 14);
  };

  const runParamChips = (run) => {
    const p = run?.params || {};
    const entries = [];
    const pushObj = (obj, keys) => {
      keys.forEach((k) => {
        const v = obj?.[k];
        if (v !== undefined && v !== null && String(v).trim() !== "") entries.push(`${k}=${v}`);
      });
    };
    pushObj(p, ["mode", "profile", "max_seconds", "prompt_tokens", "output_tokens", "rate", "tp", "max_model_len", "gpus_per_node"]);
    if (p.args) entries.push(`Precision=${trainingPrecisionLabelFromArgs(p.args)}`);
    pushObj(p.args || {}, ["NUM_GPUS", "TP", "PP", "CP", "GBS", "MAX_SEQLEN", "MLPERF_MAX_STEPS"]);
    pushObj(p.common_params || {}, ["profile", "max_seconds", "prompt_tokens", "output_tokens", "rate"]);
    if (p.prefill_params) pushObj(p.prefill_params, ["tp", "pp", "max_model_len"]);
    if (p.decode_params) pushObj(p.decode_params, ["tp", "pp", "max_model_len"]);
    return Array.from(new Set(entries)).slice(0, 14).join(" · ") || "기본값";
  };

  const ensureRunLogPath = (path) => {
    const raw = String(path || "").trim();
    if (!raw) return "";
    if (/\/run\.log$/i.test(raw) || /\.log$/i.test(raw)) return raw;
    return raw.replace(/\/+$/, "") + "/run.log";
  };

  const computeRunLogPath = (run, rows = [], selectedHost = "") => {
    const host = String(selectedHost || "").trim();
    const rowForHost = host ? (rows || []).find((r) => String(r?.host || "") === host) : null;
    const firstRow = rowForHost || rows[0] || null;
    const hostState = host ? (run?.host_states || {})[host] : null;
    const hostStateLogPath = hostState
      ? (hostState.log_path || hostState.log_dir || hostState.result_summary?.log_path || hostState.result_summary?.log_dir || "")
      : (Object.values(run?.host_states || {})
          .map((hs) => hs?.log_path || hs?.log_dir || hs?.result_summary?.log_path || hs?.result_summary?.log_dir || "")
          .find(Boolean) || "");
    return ensureRunLogPath(
      firstRow?.log_path || firstRow?.log_dir || firstRow?.summary?.log_path || firstRow?.summary?.log_dir ||
      hostStateLogPath || run?.log_path || run?.log_dir || ""
    );
  };

  const isFailureStatus = (status) => {
    const st = String(status || "").toLowerCase();
    return ["failed", "failure", "error", "partial", "stopped"].includes(st);
  };

  const cleanErrorLine = (line) => String(line || "")
    .replace(/^\[[^\]]+\]\s*/, "")
    .replace(/^\d{2}:\d{2}:\d{2}\s*[·-]\s*/, "")
    .trim();

  const extractKeyErrorMessage = (logs, statusText) => {
    if (!isFailureStatus(statusText)) return "";
    const errorPatterns = [
      /torch\.OutOfMemoryError/i,
      /CUDA out of memory/i,
      /RuntimeError:\s*CUDA/i,
      /NCCL.*(?:error|failed|failure|unhandled)/i,
      /Traceback \(most recent call last\)/i,
      /Exception:/i,
      /Error:/i,
      /FATAL/i,
      /command failed/i,
    ];
    const candidates = (logs || [])
      .filter((l) => l && typeof l.line === "string")
      .filter((l) => {
        const line = l.line || "";
        return l.level === "error" || errorPatterns.some((p) => p.test(line));
      })
      .map((l) => ({ host: l.host || "", line: cleanErrorLine(l.line) }))
      .filter((l) => l.line && !/^docker run|^ssh|^bash -lc/.test(l.line));
    if (!candidates.length) return "";

    const preferred = [...candidates].reverse().find((l) =>
      /torch\.OutOfMemoryError|CUDA out of memory|RuntimeError:\s*CUDA|NCCL.*(?:error|failed|failure|unhandled)/i.test(l.line)
    ) || candidates[candidates.length - 1];
    return `${preferred.host ? `[${preferred.host}] ` : ""}${preferred.line}`;
  };

  function ResultAnalysisPanel({ run, results, logs, pinToDashboard, dashboardPinState }) {
    const rows = (results && Array.isArray(results.rows)) ? results.rows : [];
    const firstRow = rows[0] || null;
    const statusText = String(firstRow?.actual_status || firstRow?.status || results?.status || run?.status || "idle");
    const statusLower = statusText.toLowerCase();
    const keyError = extractKeyErrorMessage(logs || [], statusText);
    const dashboardEnabled = !!(firstRow && pinToDashboard && (["success", "ok"].includes(statusLower) || String(run?.status || "").toLowerCase() === "success"));
    const pinState = dashboardPinState || "";

    return (
      <section className="run-panel result-panel compact-result-panel">
        <div className="run-panel-head">
          <ZoneHeader icon="results" accent="accent" title="결과 확인" right={<span className={"result-title-status " + statusLower}>{String(statusText || "idle").toUpperCase()}</span>} />
        </div>
        <div className="run-panel-body result-panel-body">
          {keyError && (
            <div className="key-error-card">
              <div className="key-error-title">핵심 에러</div>
              <div className="key-error-text">{keyError}</div>
            </div>
          )}
          <div className="result-metric-scroll">
            {rows.length === 0 ? (
              <table className="metric-table">
                <thead><tr><th>Result metrics</th><th className="text-right">값</th></tr></thead>
                <tbody><tr><td>result</td><td className="value">—</td></tr></tbody>
              </table>
            ) : rows.map((row, idx) => {
              const metrics = resultRowMetrics(row);
              return (
                <div key={idx} className="border-b border-line/60 last:border-b-0">
                  <div className="result-row-head">
                    <span className="font-semibold text-fog-100 text-[12px]">{row.host || `result ${idx + 1}`}</span>
                  </div>
                  <table className="metric-table">
                    <thead><tr><th>Result metrics</th><th className="text-right">값</th></tr></thead>
                    <tbody>
                      {metrics.length ? metrics.map(([k, v]) => (
                        <tr key={k}><td>{prettyMetricName(k)}</td><td className="value">{typeof v === "number" ? fmtNum(v, 3) : String(v)}</td></tr>
                      )) : <tr><td>parsed metric</td><td className="value">—</td></tr>}
                    </tbody>
                  </table>
                </div>
              );
            })}
          </div>
          <div className="result-bottom-actions">
            {run?.run_id && run.run_id !== "idle" ? (
              <a className="btn-soft report-download-btn" href={`/api/runs/${run.run_id}/report`} target="_blank" rel="noreferrer" download={`${run.run_id}_report.html`}>Report 다운 ▼</a>
            ) : (
              <button className="btn-soft report-download-btn disabled" disabled>Report 다운 ▼</button>
            )}
            <div className="dashboard-pin-action-stack">
              <button
                className={"btn-param dashboard-pin-btn result-pin-btn " + (dashboardEnabled ? "" : "disabled")}
                disabled={!dashboardEnabled || pinState === "pending"}
                onClick={() => dashboardEnabled && pinToDashboard(firstRow)}
                title={dashboardEnabled ? "대시보드에 결과를 반영합니다." : "성공한 결과만 대시보드에 반영할 수 있습니다."}
              >{pinState === "pending" ? "대시보드 반영 중" : "대시보드 반영"}</button>
              {pinState === "pending" && <div className="dashboard-pin-feedback pending">대시보드 반영 중</div>}
              {pinState === "done" && <div className="dashboard-pin-feedback">반영 완료</div>}
            </div>
          </div>
        </div>
      </section>
    );
  }

  function LogCheckPanel({ run, results, logs, pinToDashboard }) {
    const rows = (results && Array.isArray(results.rows)) ? results.rows : [];
    const [selectedLogHost, setSelectedLogHost] = useState("");
    const firstRow = rows[0] || null;
    const logPath = computeRunLogPath(run, rows, selectedLogHost);
    const canReport = run?.run_id && run.run_id !== "idle";
    const statusText = String(firstRow?.actual_status || firstRow?.status || results?.status || run?.status || "idle");
    const isSuccess = statusText.toLowerCase() === "success";
    return (
      <section className="run-panel log-check-panel">
        <div className="run-panel-head">
          <ZoneHeader icon="history" accent="second" title="로그 확인" />
        </div>
        <div className="run-panel-body log-check-body">
          <LogStream run={run} logs={logs || []} hostFilter={selectedLogHost} onHostFilterChange={setSelectedLogHost} />
          <div className="log-path-action-bar">
            <div className="log-path-label">
              <span>LOG PATH</span>
              <small className="log-path-value" title={logPath || "log path 없음"}>{logPath || "대기 중"}</small>
            </div>
            <div className="log-actions result-actions-row">
              <button
                className={"btn-soft" + (!logPath ? " disabled" : "")}
                disabled={!logPath}
                onClick={() => logPath && copyText(logPath)}
                title={logPath || "log path 없음"}
              >copy</button>
            </div>
          </div>
        </div>
      </section>
    );
  }

  function LiveMonitoringPanel({ run, hosts, gpuByHost, nodeGpuMap, logs, onStopHost, includeNic = false, modeLabel = "" }) {
    return (
      <section className={"run-panel monitor-panel" + (includeNic ? " include-nic" : "") }>
        <div className="run-panel-head">
          <ZoneHeader icon="monitor" accent="second" title="실시간 모니터링" />
        </div>
        <div className="run-panel-body monitor-panel-body">
          <HostStatusCards run={run} onStopHost={onStopHost} />
          <div className="monitor-chart-grid">
            <GpuChart title="gpu utilization" unit="" hosts={hosts} byHost={gpuByHost} dataKey="util_avg" domain={[0, 100]} run={run} />
            <GpuChart title="power draw" unit="" hosts={hosts} byHost={gpuByHost} dataKey="power_avg_w" domain={[0, powerDomainForHosts(hosts, nodeGpuMap, run.gpu_type)]} run={run} />
          </div>
          {includeNic && (
            <div className="monitor-chart-grid">
              <GpuChart title="nic tx bandwidth" unit="" hosts={hosts} byHost={gpuByHost} dataKey="nic_tx_gbps" domain={[0, "auto"]} run={run} />
              <GpuChart title="nic rx bandwidth" unit="" hosts={hosts} byHost={gpuByHost} dataKey="nic_rx_gbps" domain={[0, "auto"]} run={run} />
            </div>
          )}
          {includeNic && <NicMonitor hosts={hosts} byHost={gpuByHost} />}
        </div>
      </section>
    );
  }

  // ---------------------- App ----------------------

  function App() {
    const [tab, setTab] = useState("dashboard");
    const [dashboardSub, setDashboardSub] = useState("results");
    const [clusterSub, setClusterSub] = useState("os");
    const [trainingSub, setTrainingSub] = useState("mlperf");
    const [inferenceSub, setInferenceSub] = useState("mlperf");
    const [pinned, setPinnedRaw] = useState(loadDashboard);
    const saveDashboardEverywhere = useCallback((items) => {
      const clean = mergeDashboardPins(items || []);
      saveDashboard(clean);
      api.saveDashboard(clean).catch(() => {});
      return clean;
    }, []);
    const setPinned = useCallback((next) => {
      setPinnedRaw((prev) => {
        const resolved = typeof next === "function" ? next(Array.isArray(prev) ? prev : []) : next;
        return saveDashboardEverywhere(resolved);
      });
    }, [saveDashboardEverywhere]);
    useEffect(() => {
      let dead = false;
      api.getDashboard().then((payload) => {
        if (dead) return;
        const serverPins = Array.isArray(payload?.pins) ? payload.pins : [];
        setPinnedRaw((prev) => {
          const localPins = Array.isArray(prev) ? prev : [];
          const merged = mergeDashboardPins(serverPins, localPins);
          saveDashboard(merged);
          if (merged.length || localPins.length) api.saveDashboard(merged).catch(() => {});
          return merged;
        });
      }).catch(() => {
        const localPins = loadDashboard();
        if (localPins.length) api.saveDashboard(localPins).catch(() => {});
      });
      return () => { dead = true; };
    }, []);
    const pinnedRunIds = useMemo(() => new Set((Array.isArray(pinned) ? pinned : []).map((p) => p.run_id).filter(Boolean)), [pinned]);
    const [dashboardPinStatus, setDashboardPinStatus] = useState({});

    // Advanced arguments state — hoisted so the 2nd column (a sibling of
    // ConfigPanel in the layout) can render the same data the form binds to.
    // ConfigPanel pushes its current schema up via onSchemaChange whenever
    // selectors (suite/version, engine/bench_data) change.
    const [mlperfShowAdv, setMlperfShowAdv] = useState(false);
    const [mlperfArgs, setMlperfArgs] = useState(() => {
      try { return JSON.parse(window.localStorage.getItem("mlperf_platform_args_v1") || "{}"); }
      catch (_) { return {}; }
    });
    const [mlperfSchema, setMlperfSchema] = useState([]);
    useEffect(() => {
      try { window.localStorage.setItem("mlperf_platform_args_v1", JSON.stringify(mlperfArgs)); }
      catch (_) {}
    }, [mlperfArgs]);

    const [vllmShowAdv, setVllmShowAdv] = useState(false);
    const [vllmArgs, setVllmArgs] = useState(() => {
      try { return JSON.parse(window.localStorage.getItem("platform_vllm_args_v1") || "{}"); }
      catch (_) { return {}; }
    });
    const [vllmSchema, setVllmSchema] = useState([]);
    useEffect(() => {
      try { window.localStorage.setItem("platform_vllm_args_v1", JSON.stringify(vllmArgs)); }
      catch (_) {}
    }, [vllmArgs]);

    const [pdShowAdv, setPdShowAdv] = useState(false);
    const [pdArgs, setPdArgs] = useState(() => {
      try { return JSON.parse(window.localStorage.getItem("platform_pd_args_v1") || "{}"); }
      catch (_) { return {}; }
    });
    const [pdSchema, setPdSchema] = useState([]);
    useEffect(() => {
      try { window.localStorage.setItem("platform_pd_args_v1", JSON.stringify(pdArgs)); }
      catch (_) {}
    }, [pdArgs]);

    const [runs, setRuns] = useState([]);
    const [dismissedRunNotices, setDismissedRunNotices] = useState(() => {
      try { return JSON.parse(window.localStorage.getItem("platform_dismissed_run_notices_v1") || "[]"); }
      catch (_) { return []; }
    });
    useEffect(() => {
      try { window.localStorage.setItem("platform_dismissed_run_notices_v1", JSON.stringify(dismissedRunNotices.slice(-200))); }
      catch (_) {}
    }, [dismissedRunNotices]);

    // Per-tab run ID tracking. The active tab's runId is mirrored into
    // currentRunIdRaw which drives the existing useEffects (fetch, SSE).
    // When the user switches tabs, monitoring state is cleared and the
    // [currentRunId] effect refetches for the restored tab's run.
    const KIND_TO_TAB = { mlperf: "training", mlperf_k8s: "training", vllm_bench: "inference", pd_bench: "inference", llmd_bench: "inference" };
    const [runIdByTab, setRunIdByTab] = useState({ training: null, inference: null });
    const [currentRunIdRaw, setCurrentRunIdRaw] = useState(null);
    const currentRunId = currentRunIdRaw;

    // Write a runId into a specific tab slot (and mirror to currentRunIdRaw
    // if that slot is the active tab).
    const setRunIdForTab = useCallback((slotTab, id) => {
      setRunIdByTab((prev) => ({ ...prev, [slotTab]: id }));
      if (slotTab === tab) setCurrentRunIdRaw(id);
    }, [tab]);

    // Convenience: set the active tab's runId.
    const setCurrentRunId = useCallback((id) => {
      setRunIdByTab((prev) => ({ ...prev, [tab]: id }));
      setCurrentRunIdRaw(id);
      setGpuByHost({});
      setNodeGpuMap({});
      setLogs([]);
      setResults(null);
    }, [tab]);

    const [currentRun, setCurrentRun] = useState(null);
    const [logs, setLogs] = useState([]);
    const [results, setResults] = useState(null);
    const [busy, setBusy] = useState(false);
    const [gpuByHost, setGpuByHost] = useState({});  // host -> [samples]
    const [monitorHosts, setMonitorHosts] = useState([]); // hosts to monitor immediately after Run click
    const [nodeGpuMap, setNodeGpuMap] = useState({});
    const gpuStreamsRef = useRef({});                // host -> EventSource
    const logStreamRef = useRef(null);               // current log EventSource
    const logSeenRef = useRef(new Set());            // dedupe replay/reconnect log events
    const backendBootRef = useRef(null);

    const clearCurrentRunSelection = useCallback(() => {
      setRunIdByTab({ training: null, inference: null });
      setCurrentRunIdRaw(null);
      setCurrentRun(null);
      setResults(null);
      setLogs([]);
      setMonitorHosts([]);
      setNodeGpuMap({});
      setGpuByHost({});
      logSeenRef.current = new Set();
      Object.values(gpuStreamsRef.current).forEach((es) => { try { es.close(); } catch (_) {} });
      gpuStreamsRef.current = {};
      try { if (logStreamRef.current) logStreamRef.current.close(); } catch (_) {}
      logStreamRef.current = null;
    }, []);

    const clearMissingRun = useCallback((missingRunId) => {
      setRunIdByTab((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => {
          if (next[k] === missingRunId) next[k] = null;
        });
        return next;
      });
      if (currentRunIdRaw === missingRunId) {
        clearCurrentRunSelection();
      }
    }, [currentRunIdRaw, clearCurrentRunSelection]);

    // Tab isolation: when the user switches tabs, blow away all derived
    // monitoring state and restore the destination tab's runId from the
    // per-tab cache.  The existing [currentRunId] useEffect will then
    // refetch run/results for the restored ID (if any), and the SSE/GPU
    // stream effects will reconnect.  This stops MLPerf monitoring from
    // bleeding into the vLLM / PD tabs (and vice versa).
    useEffect(() => {
      const restored = runIdByTab[tab] || null;
      setCurrentRunIdRaw(restored);
      setCurrentRun(null);
      setLogs([]);
      setResults(null);
      setMonitorHosts([]);
      setNodeGpuMap({});
      setGpuByHost({});
      logSeenRef.current = new Set();
      // close any lingering log SSE; the [currentRunId] effect will reopen.
      try { if (logStreamRef.current) logStreamRef.current.close(); } catch (_) {}
      logStreamRef.current = null;
      // close all gpu streams; they'll reopen for the new tab's run hosts.
      Object.values(gpuStreamsRef.current).forEach((es) => {
        try { es.close(); } catch (_) {}
      });
      gpuStreamsRef.current = {};
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [tab]);

    // poll runs list
    useInterval(async () => {
      try { setRuns(await api.listRuns()); } catch (_) {}
    }, 3000, []);

    // Keep run history, but clear the selected run when the backend process restarts.
    useInterval(async () => {
      try {
        const h = await api.health();
        const boot = h?.backend_started_at ? String(h.backend_started_at) : "";
        if (!boot) return;
        if (!backendBootRef.current) {
          backendBootRef.current = boot;
          return;
        }
        if (backendBootRef.current !== boot) {
          backendBootRef.current = boot;
          clearCurrentRunSelection();
          api.listRuns().then(setRuns).catch(() => {});
        }
      } catch (_) {}
    }, 5000, [clearCurrentRunSelection]);

    // poll current run snapshot + results
    useInterval(async () => {
      if (!currentRunId) return;
      try {
        const [run, res] = await Promise.all([
          api.getRun(currentRunId),
          api.getResults(currentRunId),
        ]);
        setCurrentRun(run);
        setMonitorHosts(run.hosts || []);
        if (run.node_gpu_map) setNodeGpuMap(run.node_gpu_map);
        setResults(res);
      } catch (e) {
        if (e && e.status === 404) clearMissingRun(currentRunId);
      }
    }, 2000, [currentRunId, clearMissingRun]);

    // log stream.
    // Use replay=1 to avoid missing early lines emitted before EventSource opens.
    // Deduplicate by timestamp/host/line so EventSource reconnects do not append old logs again.
    useEffect(() => {
      if (logStreamRef.current) {
        try { logStreamRef.current.close(); } catch (_) {}
        logStreamRef.current = null;
      }

      setLogs([]);
      logSeenRef.current = new Set();
      if (!currentRunId) return;

      const appendLog = (line) => {
        if (!line || !line.line) return;
        if (line.line.includes("[platform] stream end")) return;

        const key = `${line.ts || 0}|${line.host || ""}|${line.line}`;
        if (logSeenRef.current.has(key)) return;
        logSeenRef.current.add(key);

        setLogs((prev) => {
          const next = prev.concat(line);
          if (next.length > 4000) return next.slice(-4000);
          return next;
        });

        if (line.line.includes("MLPerf_RESULT_JSON=") ||
            line.line.includes("VLLM_BENCH_RESULT_JSON=") ||
            line.line.includes("PD_BENCH_RESULT_JSON=")) {
          api.getRun(currentRunId).then((run) => {
            setCurrentRun(run);
            setMonitorHosts(run.hosts || []);
            if (run.node_gpu_map) setNodeGpuMap(run.node_gpu_map);
          }).catch((e) => { if (e && e.status === 404) clearMissingRun(currentRunId); });
          api.getResults(currentRunId).then(setResults).catch((e) => { if (e && e.status === 404) clearMissingRun(currentRunId); });
        }
      };

      let closed = false;
      api.getLogs(currentRunId, 4000).then((history) => {
        if (closed) return;
        (Array.isArray(history) ? history : []).forEach(appendLog);
      }).catch((e) => { if (e && e.status === 404) clearMissingRun(currentRunId); });

      const es = new EventSource(`/api/runs/${currentRunId}/logs/stream?replay=1`);
      logStreamRef.current = es;

      es.addEventListener("log", (e) => {
        if (closed) return;
        try { appendLog(JSON.parse(e.data)); } catch (_) {}
      });

      es.onerror = () => {
        // EventSource will retry automatically. replay=1 + dedupe prevents duplicate old logs.
      };

      return () => {
        closed = true;
        try { es.close(); } catch (_) {}
        if (logStreamRef.current === es) logStreamRef.current = null;
      };
    }, [currentRunId, clearMissingRun]);

    // Close log stream only after the whole logical run is terminal.
    // Do not close on each host's MLPerf_RESULT_JSON because mixed-GPU runs have multiple subprocesses/hosts.
    useEffect(() => {
      const terminal = ["success", "failed", "partial", "stopped"].includes(currentRun?.status || "");
      if (terminal && logStreamRef.current) {
        try { logStreamRef.current.close(); } catch (_) {}
        logStreamRef.current = null;
      }
    }, [currentRun?.status]);

    // GPU streams: open one per host as soon as Run is clicked.
    // This does not wait for /api/runs to complete.
    // Streams are closed when:
    //   - host removed from monitorHosts (e.g. tab switch)
    //   - the current run reaches a terminal state (success/failed/partial/stopped)
    //     -> we keep monitorHosts populated so the host cards stay visible,
    //        but we stop the SSE so power/utilization stops growing.
    useEffect(() => {
      const runTerminal = ["success", "failed", "partial", "stopped"]
        .includes(currentRun?.status || "");

      // If the run is finished, close every stream we still hold open.
      if (runTerminal) {
        Object.entries(gpuStreamsRef.current).forEach(([h, es]) => {
          try { es.close(); } catch (_) {}
          delete gpuStreamsRef.current[h];
        });
        return;
      }

      const wanted = new Set(monitorHosts || []);
      const have = Object.keys(gpuStreamsRef.current);

      // close streams we no longer need
      have.forEach((h) => {
        if (!wanted.has(h)) {
          try { gpuStreamsRef.current[h].close(); } catch (_) {}
          delete gpuStreamsRef.current[h];
        }
      });

      // open new streams
      wanted.forEach((h) => {
        if (gpuStreamsRef.current[h]) return;
        const es = new EventSource(`/api/hosts/${encodeURIComponent(h)}/gpu/stream?replay=0`);
        es.addEventListener("sample", (e) => {
          try {
            const s = JSON.parse(e.data);
            setGpuByHost((prev) => {
              const cur = prev[h] ? prev[h].slice() : [];
              cur.push(s);
              if (cur.length > 1800) cur.splice(0, cur.length - 1800);
              return { ...prev, [h]: cur };
            });
          } catch (_) {}
        });
        gpuStreamsRef.current[h] = es;
      });

      // cleanup on unmount
      return () => {};
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [monitorHosts.join(","), currentRun?.status]);

    const mergeGpuSampleMaps = (prev, incoming) => {
      const next = { ...(prev || {}) };
      Object.entries(incoming || {}).forEach(([host, arr]) => {
        const map = new Map();
        [...(next[host] || []), ...(arr || [])].forEach((sample) => {
          const ts = Number(sample?.ts || 0);
          const key = Number.isFinite(ts) && ts > 0 ? ts.toFixed(3) : `${Math.random()}`;
          map.set(key, sample);
        });
        next[host] = Array.from(map.values())
          .sort((a, b) => Number(a?.ts || 0) - Number(b?.ts || 0))
          .slice(-7200);
      });
      return next;
    };

    // Whenever a run is selected/restored, reload the per-run GPU samples from
    // the backend.  This preserves the full experiment window after switching
    // tabs, and still lets live SSE append new samples for running jobs.
    useEffect(() => {
      if (!currentRunId || !currentRun) return;
      let dead = false;
      api.getRunGpuSamples(currentRunId).then((payload) => {
        if (dead || !payload?.by_host) return;
        setGpuByHost((prev) => mergeGpuSampleMaps(prev, payload.by_host));
      }).catch(() => {});
      return () => { dead = true; };
    }, [currentRunId, currentRun?.status, (currentRun?.hosts || []).join(",")]);

    // close all on unmount
    useEffect(() => () => {
      Object.values(gpuStreamsRef.current).forEach((es) => { try { es.close(); } catch (_) {} });
    }, []);

    const onStart = async (body) => {
      const ts = Date.now() / 1000;
      const incomingNodeGpuMap = body.node_gpu_map || Object.fromEntries((body.hosts || []).map((h) => [h, body.gpu_type]));
      // Capture the destination tab from body.kind so the run gets stored
      // in the correct per-tab slot, even if the user switches tabs while
      // /api/runs is in flight.
      const destTab = (body.kind === "mlperf" && body.suite === "inference")
        ? "inference"
        : (KIND_TO_TAB[body.kind || "mlperf"] || tab);

      const optimisticRun = {
        run_id: "starting...",
        kind: body.kind || "mlperf",
        suite: body.suite,
        version: body.version,
        gpu_type: body.gpu_type,
        benchmark: body.benchmark || "—",
        hosts: body.hosts || [],
        node_gpu_map: incomingNodeGpuMap,
        params: body.params || {},
        dry_run: !!body.dry_run,
        status: "pending",
        created_at: ts,
        started_at: ts,
        cmd: [],
        host_states: Object.fromEntries(
          (body.hosts || []).map((h) => [h, {
            host: h,
            status: "pending",
            phase: "starting monitor",
            started_at: ts,
            ended_at: null,
            exit_code: null,
            log_dir: null,
          }])
        ),
      };

      // Show the right-side monitoring panel immediately.  A new Run must start
      // with a clean live view even when the browser tab is not refreshed.
      Object.entries(gpuStreamsRef.current || {}).forEach(([, es]) => {
        try { es.close(); } catch (_) {}
      });
      gpuStreamsRef.current = {};
      if (logStreamRef.current) {
        try { logStreamRef.current.close(); } catch (_) {}
        logStreamRef.current = null;
      }
      logSeenRef.current = new Set();

      setBusy(true);
      setRunIdForTab(destTab, null);
      setCurrentRun(optimisticRun);
      setMonitorHosts(body.hosts || []);
      setNodeGpuMap(incomingNodeGpuMap);
      setResults({
        run_id: optimisticRun.run_id,
        suite: body.suite,
        version: body.version,
        benchmark: body.benchmark || "—",
        gpu_type: body.gpu_type,
        status: "pending",
        rows: (body.hosts || []).map((h) => ({
          host: h,
          status: "pending",
          ui_status: "analyzing",
          phase: "starting monitor",
          exit_code: null,
          duration_sec: null,
          log_dir: null,
          container: null,
          summary: null,
          metrics: null,
          result_error: null,
        })),
      });
      setLogs([]);
      setGpuByHost(Object.fromEntries((body.hosts || []).map((h) => [h, []])));

      try {
        const run = await api.startRun(body);
        setRunIdForTab(destTab, run.run_id);
        setDismissedRunNotices((prev) => prev.filter((id) => id !== run.run_id));
        // Only paint the new run details if user is still on the destination tab.
        if (destTab === tab) {
          setCurrentRun(run);
          setMonitorHosts(run.hosts || body.hosts || []);
          setNodeGpuMap(run.node_gpu_map || incomingNodeGpuMap);
          api.getResults(run.run_id).then(setResults).catch(() => {});
          setLogs([]);
        }
        api.listRuns().then(setRuns).catch(() => {});
      } catch (e) {
        if (destTab === tab) {
          setCurrentRun({
            ...optimisticRun,
            status: "failed",
            host_states: Object.fromEntries(
              (body.hosts || []).map((h) => [h, {
                ...(optimisticRun.host_states[h] || {}),
                status: "failed",
                phase: "start failed",
              }])
            ),
          });
        }
        throw e;
      } finally {
        setBusy(false);
      }
    };

    const onStopHost = async (host) => {
      if (!currentRunId) return;
      await api.stopHost(currentRunId, host).catch((_) => {});
    };
    const onStopAll = async () => {
      if (!currentRunId) return;
      await api.stopRun(currentRunId).catch((_) => {});
    };

    const deleteRunEverywhere = useCallback(async (runId) => {
      if (!runId) return;
      try {
        await api.deleteRun(runId);
      } catch (e) {
        if (!(e && e.status === 404)) throw e;
      }
      setRuns((prev) => (prev || []).filter((r) => r.run_id !== runId));
      setPinned((prev) => (Array.isArray(prev) ? prev.filter((p) => p.run_id !== runId) : prev));
      setDashboardPinStatus((prev) => { const next = { ...(prev || {}) }; delete next[runId]; return next; });
      setDismissedRunNotices((prev) => (prev || []).filter((id) => id !== runId));
      setRunIdByTab((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => { if (next[k] === runId) next[k] = null; });
        return next;
      });
      if (currentRunIdRaw === runId) {
        setCurrentRunIdRaw(null);
        setCurrentRun(null);
        setResults(null);
        setLogs([]);
        setMonitorHosts([]);
        setNodeGpuMap({});
        setGpuByHost({});
        logSeenRef.current = new Set();
        try { if (logStreamRef.current) logStreamRef.current.close(); } catch (_) {}
        logStreamRef.current = null;
      }
    }, [currentRunIdRaw]);

    // Pin a single host's parsed result to the Dashboard tab.
    const pinToDashboard = useCallback((row) => {
      const rid = currentRun?.run_id || row?.run_id || "";
      if (rid) setDashboardPinStatus((prev) => ({ ...prev, [rid]: "pending" }));
      try {
        const entry = buildDashboardPinEntryFromRun(currentRun, row);
        setPinned((prev) => mergeDashboardPins(prev, [entry]));
        if (rid) setDashboardPinStatus((prev) => ({ ...prev, [rid]: "done" }));
      } catch (e) {
        if (rid) setDashboardPinStatus((prev) => ({ ...prev, [rid]: "" }));
        alert(String(e.message || e));
      }
    }, [currentRun, setPinned]);

    const tabRunMatches = !!currentRun && (() => {
      const k = currentRun.kind || "mlperf";
      const suite = currentRun.suite || "";
      if (tab === "training") return (k === "mlperf_k8s") || (k === "mlperf" && suite === "training");
      if (tab === "inference" && inferenceSub === "mlperf") return k === "mlperf" && suite === "inference";
      if (tab === "inference" && inferenceSub === "vllm") return ["llmd_bench", "vllm_bench", "pd_bench"].includes(k);
      return true;
    })();
    const visibleRun = tabRunMatches ? currentRun : null;
    const visibleResults = tabRunMatches ? results : null;

    const displayRun = visibleRun || {
      run_id: "idle",
      suite: "—",
      version: "—",
      gpu_type: "—",
      benchmark: "—",
      status: "idle",
      hosts: [],
      host_states: {},
    };
    const hosts = displayRun.hosts || [];

    const terminalStatuses = new Set(["success", "failed", "partial", "stopped", "error"]);
    const runningStatuses = new Set(["pending", "running", "analyzing"]);
    const runBelongsToTestTab = (r, slot) => {
      const k = r?.kind || "mlperf";
      const suite = r?.suite || "";
      if (slot === "training") return k === "mlperf_k8s" || (k === "mlperf" && suite === "training");
      if (slot === "inference") return ["llmd_bench", "vllm_bench", "pd_bench"].includes(k) || (k === "mlperf" && suite === "inference");
      return false;
    };
    const latestRunForSlot = (slot) => {
      const currentBelongs = currentRun && runBelongsToTestTab(currentRun, slot) ? currentRun : null;
      const latestListed = (runs || [])
        .filter((r) => runBelongsToTestTab(r, slot))
        .sort((a, b) => (b.created_at || 0) - (a.created_at || 0))[0] || null;
      if (!currentBelongs) return latestListed;
      if (!latestListed) return currentBelongs;
      return (currentBelongs.created_at || 0) >= (latestListed.created_at || 0) ? currentBelongs : latestListed;
    };
    const buildTestStatus = (slot) => {
      const r = latestRunForSlot(slot);
      if (!r) return null;
      const st = String(r.status || "idle").toLowerCase();
      const terminal = terminalStatuses.has(st);
      const visible = runningStatuses.has(st) || (terminal && !dismissedRunNotices.includes(r.run_id));
      return { run_id: r.run_id, status: st, terminal, visible };
    };
    const testStatus = {
      training: buildTestStatus("training"),
      inference: buildTestStatus("inference"),
    };
    const onAckTestStatus = useCallback((runId) => {
      if (!runId) return;
      setDismissedRunNotices((prev) => prev.includes(runId) ? prev : [...prev, runId].slice(-200));
    }, []);

    const runningCount = runs.filter((r) =>
      (["llmd_bench", "vllm_bench", "pd_bench", "mlperf_k8s", "mlperf"].includes(r.kind)) && !terminalStatuses.has(String(r.status || "").toLowerCase())
    ).length;

    // Warm up cluster endpoints as soon as the web UI starts.
    // This prevents the first open of the cluster tab from showing a transient unreachable state.
    useEffect(() => {
      let cancelled = false;
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      (async () => {
        api.wwMeta().catch(() => {});
        api.wwNodes().catch(() => {});
        for (let i = 0; i < 4 && !cancelled; i += 1) {
          const s = await api.k8sStatus().catch(() => null);
          await Promise.all([
            api.k8sNodes().catch(() => {}),
            api.k8sPods().catch(() => {}),
            api.k8sServices().catch(() => {}),
            api.k8sWorkloads().catch(() => {}),
          ]);
          if (s && s.available !== false && s.reachable !== false) break;
          await sleep(1500);
        }
      })();
      return () => { cancelled = true; };
    }, []);

    // Page title per tab for the content header.
    const pageMeta = {
      dashboard: { title: "대시보드", sub: "" },
      cluster:   { title: "테스트 클러스터 관리", sub: "" },
      training:  { title: "Training 테스트", sub: "" },
      inference: { title: "Inference 테스트", sub: "" },
    }[tab] || { title: "", sub: "" };

    return (
      <div className="app-shell surface">
        <Sidebar tab={tab} setTab={setTab} dashboardSub={dashboardSub} setDashboardSub={setDashboardSub} clusterSub={clusterSub} setClusterSub={setClusterSub} trainingSub={trainingSub} setTrainingSub={setTrainingSub} inferenceSub={inferenceSub} setInferenceSub={setInferenceSub} runningCount={runningCount} testStatus={testStatus} onAckTestStatus={onAckTestStatus} />

        <div className="min-w-0 grid-bg">
          {/* CONTENT HEADER */}
          <header className="sticky top-0 z-30 backdrop-blur bg-ink-950/60 border-b border-line">
            <div className="px-7 py-4 flex items-center justify-between gap-6">
              <div>
                <h1 className="text-lg font-semibold tracking-tight text-fog-100">{pageMeta.title}</h1>
                {pageMeta.sub && <p className="text-[12px] text-fog-500 mt-0.5">{pageMeta.sub}</p>}
              </div>
              {tab === "dashboard" && (
                <div className="seg">
                  <button className={"seg-btn" + (dashboardSub === "results" ? " active" : "")} onClick={() => setDashboardSub("results")}>테스트 결과</button>
                  <button className={"seg-btn" + (dashboardSub === "perf" ? " active" : "")} onClick={() => setDashboardSub("perf")}>가속기별 성능</button>
                  <button className={"seg-btn" + (dashboardSub === "cost" ? " active" : "")} onClick={() => setDashboardSub("cost")}>비용 분석</button>
                </div>
              )}
              {tab === "cluster" && (
                <div className="seg">
                  <button className={"seg-btn" + (clusterSub === "os" ? " active" : "")} onClick={() => setClusterSub("os")}>클러스터 관리</button>
                  <button className={"seg-btn" + (clusterSub === "k8s" ? " active" : "")} onClick={() => setClusterSub("k8s")}>Kubernetes 관리</button>
                </div>
              )}
              {tab === "training" && (
                <div className="seg">
                  <button className={"seg-btn" + (trainingSub === "mlperf" ? " active" : "")} onClick={() => setTrainingSub("mlperf")}>MLPerf 테스트</button>
                </div>
              )}
              {tab === "inference" && (
                <div className="seg">
                  <button className={"seg-btn" + (inferenceSub === "mlperf" ? " active" : "")} onClick={() => setInferenceSub("mlperf")}>MLPerf 테스트</button>
                  <button className={"seg-btn" + (inferenceSub === "vllm" ? " active" : "")} onClick={() => setInferenceSub("vllm")}>vLLM 테스트</button>
                </div>
              )}
            </div>
          </header>

          {/* BODY */}
          <main className="px-7 py-6">
            {tab === "cluster" && <ClusterTab sub={clusterSub} />}

            {tab === "training" && (
              <div className="space-y-4 fade-up max-w-[1600px] test-run-stack">
                <div className="card"><div className="card-pad"><TrainingK8sConfigStable onStart={onStart} busy={busy} /></div></div>

                <div className="monitor-log-grid">
                  <LiveMonitoringPanel
                    run={displayRun}
                    hosts={hosts}
                    gpuByHost={gpuByHost}
                    nodeGpuMap={nodeGpuMap}
                    logs={logs}
                    onStopHost={onStopHost}
                    includeNic={false}
                    modeLabel={`training · ${displayRun.version}`}
                  />
                  <LogCheckPanel
                    run={displayRun}
                    logs={logs}
                    results={visibleResults || {
                      run_id: displayRun.run_id, suite: "training", version: displayRun.version,
                      benchmark: displayRun.benchmark, gpu_type: displayRun.gpu_type, status: displayRun.status, rows: []
                    }}
                    pinToDashboard={pinToDashboard}
                    dashboardPinState={dashboardPinStatus[displayRun.run_id]}
                  />
                </div>

                <div className="result-history-grid">
                  <ResultAnalysisPanel
                    run={displayRun}
                    logs={logs}
                    results={visibleResults || {
                      run_id: displayRun.run_id, suite: "training", version: displayRun.version,
                      benchmark: displayRun.benchmark, gpu_type: displayRun.gpu_type, status: displayRun.status, rows: []
                    }}
                    pinToDashboard={pinToDashboard}
                    dashboardPinState={dashboardPinStatus[displayRun.run_id]}
                  />
                  <div className="space-y-3 min-w-0">
                    <ZoneHeader icon="history" accent="mut" title="Run History"
                      sub=""
                      right={currentRunId && !["success", "failed", "partial", "stopped"].includes(currentRun?.status || "") && (
                        <button onClick={onStopAll}
                          className="text-[10px] font-mono uppercase tracking-wider px-2.5 py-1.5 rounded-lg bg-err/10 hover:bg-err/20 text-err border border-err/30">
                          stop all
                        </button>
                      )} />
                    <div className="card run-history-card"><div className="card-pad"><RunHistoryPanel runs={runs.filter((r) => r.kind === "mlperf_k8s" || ((r.kind || "mlperf") === "mlperf" && r.suite === "training"))} currentId={currentRunId} onPick={setCurrentRunId} onDelete={deleteRunEverywhere} pinnedRunIds={pinnedRunIds} /></div></div>
                  </div>
                </div>
              </div>
            )}

            {tab === "inference" && (
              <div className="space-y-4 fade-up max-w-[1600px] test-run-stack">
                <div className="card"><div className="card-pad">
                  {inferenceSub === "mlperf"
                    ? <InferenceMlperfConfigStable onStart={onStart} busy={busy} setInferenceSub={setInferenceSub} />
                    : <LlmdConfigStable onStart={onStart} busy={busy} setInferenceSub={setInferenceSub} />}
                </div></div>

                <div className="monitor-log-grid">
                  <LiveMonitoringPanel
                    run={displayRun}
                    hosts={hosts}
                    gpuByHost={gpuByHost}
                    nodeGpuMap={nodeGpuMap}
                    logs={logs}
                    onStopHost={onStopHost}
                    includeNic={false}
                    modeLabel={inferenceSub === "mlperf" ? `mlperf · ${displayRun.version}` : (displayRun.params?.mode || "serve")}
                  />
                  <LogCheckPanel
                    run={displayRun}
                    logs={logs}
                    results={visibleResults || {
                      run_id: displayRun.run_id, suite: "inference", version: inferenceSub === "mlperf" ? displayRun.version : "guidellm_llmd",
                      benchmark: inferenceSub === "mlperf" ? displayRun.benchmark : (displayRun.params?.bench_data || "guidellm"),
                      gpu_type: displayRun.gpu_type, status: displayRun.status, rows: []
                    }}
                    pinToDashboard={pinToDashboard}
                  />
                </div>

                <div className="result-history-grid">
                  <ResultAnalysisPanel
                    run={displayRun}
                    logs={logs}
                    results={visibleResults || {
                      run_id: displayRun.run_id, suite: "inference", version: inferenceSub === "mlperf" ? displayRun.version : "guidellm_llmd",
                      benchmark: inferenceSub === "mlperf" ? displayRun.benchmark : (displayRun.params?.bench_data || "guidellm"),
                      gpu_type: displayRun.gpu_type, status: displayRun.status, rows: []
                    }}
                    pinToDashboard={pinToDashboard}
                    dashboardPinState={dashboardPinStatus[displayRun.run_id]}
                  />
                  <div className="space-y-3 min-w-0">
                    <ZoneHeader icon="history" accent="mut" title="Run History"
                      sub=""
                      right={currentRunId && !["success", "failed", "partial", "stopped"].includes(currentRun?.status || "") && (
                        <button onClick={onStopAll}
                          className="text-[10px] font-mono uppercase tracking-wider px-2.5 py-1.5 rounded-lg bg-err/10 hover:bg-err/20 text-err border border-err/30">
                          stop all
                        </button>
                      )} />
                    <div className="card run-history-card"><div className="card-pad"><RunHistoryPanel
                      runs={inferenceSub === "mlperf"
                        ? runs.filter((r) => (r.kind || "mlperf") === "mlperf" && r.suite === "inference")
                        : runs.filter((r) => ["llmd_bench", "vllm_bench", "pd_bench"].includes(r.kind))}
                      currentId={currentRunId} onPick={setCurrentRunId} onDelete={deleteRunEverywhere} pinnedRunIds={pinnedRunIds} /></div></div>
                  </div>
                </div>
              </div>
            )}

            {tab === "dashboard" && dashboardSub === "results" && (
              <DashboardTab pinned={pinned} setPinned={setPinned} onDeleteRun={deleteRunEverywhere} />
            )}
            {tab === "dashboard" && dashboardSub === "perf" && <AcceleratorPerfTab />}
            {tab === "dashboard" && dashboardSub === "cost" && <CostAnalysisTab pinned={pinned} />}
          </main>

          <footer className="px-7 py-6 text-[10px] text-fog-500 font-mono uppercase tracking-[0.18em]">
            poc platform · console · v6.67
          </footer>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
